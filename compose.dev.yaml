# DEVELOPMENT environment with hot reload.
# Brings the front end and the back end up side by side, each with live reload:
#   - web: Vite dev server (HMR) on 5173
#   - api: Go binary under air (automatic rebuild+restart) on 8080
# The front end calls a relative /api; the Vite proxy resolves it to the `api`
# service (same contract as production, NO CORS).
#
#   docker compose -f compose.dev.yaml up --build
#
# This is NOT production — the immutable image is the Dockerfile at the root.

services:
  web:
    image: node:24
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host --port 5173"
    ports:
      - "5173:5173"
    environment:
      # Vite proxy target inside the compose network: `localhost` is NOT the
      # `api` service; compose DNS resolves `api` to the backend container.
      VITE_PROXY_TARGET: http://api:8080
    volumes:
      # Front-end code bind-mounted so HMR sees the edits made on the host.
      - ./web:/app
      # ANONYMOUS volume: keeps the host node_modules (possibly root-owned
      # and/or from another architecture) from masking the one installed inside
      # the container.
      - /app/node_modules
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    # Uid/gid of the host owner (rafael, 1000:1000) — same pattern as
    # compose.yaml. Without this the container runs as root and
    # the NFO/artwork exported to the host-mounted library are born owned by
    # root, unreadable without sudo (the gap this setting closes).
    user: "1000:1000"
    # Optional credentials (e.g. MYMEDIADB_TMDB_TOKEN for external search, see
    # ADR-0023) come from .env — gitignored, safe. Missing/empty: external search
    # stays off, without an error. NEVER commit .env nor log the value.
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      # The whole repository mounted: air watches the *.go files and rebuilds.
      - .:/app
      # Go caches in named volumes for fast rebuilds between `up`s.
      # go-build-cache points at GOCACHE=/go-cache (Dockerfile.dev), not
      # /root/.cache/go-build — uid 1000 has no HOME=/root.
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/go-cache

volumes:
  go-mod-cache:
  go-build-cache:

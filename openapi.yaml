openapi: 3.1.0
info:
  title: MyMediaDB — native API (v1)
  version: "0.1.0"
  description: >
    OpenAPI contract of the MyMediaDB native /api/v1 surface. It is the SOURCE OF
    TRUTH for the front-end TS types (generated by `npm run gen:types` into
    web/src/lib/api-types.ts — ADR-0014), never kept by hand. It covers catalog
    reads (/entities, briefing 0010) and the datasources (/library, 0008).
    Every error response uses the { error: { code, message } } envelope.
servers:
  - url: /
    description: Same origin as the server (the binary serves API + SPA).
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Service health.
      tags: [meta]
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/health/system:
    get:
      operationId: getSystemHealth
      summary: System telemetry (database + operational usage + storage).
      description: >
        LOCAL snapshot, on demand (briefing 0055): database size (PRAGMA),
        operational portrait (catalog counts, curation queues, uptime,
        memory/goroutines) and disk usage per registered `library_source`.
        SEPARATE from GET /api/v1/health on purpose — this one is more expensive
        (N Statfs syscalls + SQL aggregations) and must not weigh on the Docker
        HEALTHCHECK, which hits /health every 10s. Cached in memory for 60s: a
        reload right after returns the SAME `computed_at`. A source with an
        unreachable `path` shows up as `offline:true`/`filesystem:null`, without
        aborting the others or the whole endpoint.
      tags: [meta]
      responses:
        "200":
          description: Computed snapshot (or served from the 60s cache).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemHealth" }
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities:
    get:
      operationId: listEntities
      summary: Paginated list of entities (catalog cards).
      description: >
        Each item carries the DERIVED ownership (EXISTS media_file present), the
        file count, the match confidence (review badge) and the poster link when
        local artwork exists. Optional filters and sorting by title.
      tags: [entities]
      parameters:
        - name: type
          in: query
          description: "Filters by type (e.g. movie, tv). Absent = all."
          required: false
          schema: { type: string }
        - name: owned
          in: query
          description: Filters by ownership (true = in the library). Absent = all.
          required: false
          schema: { type: boolean }
        - name: limit
          in: query
          description: Page size (default 50, max 200).
          required: false
          schema: { type: integer, minimum: 0, default: 50 }
        - name: offset
          in: query
          description: Page offset (default 0).
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: sort
          in: query
          description: >
            Sorting — by title `title` (asc, default) or `-title` (desc), or
            by creation date `-created_at` (most recent first, briefing
            0109 — feeds the "recently added" carousels on the home page).
          required: false
          schema:
            type: string
            enum: [title, -title, -created_at]
            default: title
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Page of cards.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityList" }
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: createItem
      summary: "Creates a local manual item without an external source (briefing 0027)."
      description: >
        Creates a LOCAL media entity (type=movie|tv), without external_ids, with the base
        fields given by the owner — to catalog something the source does not have or has not
        matched yet. It combines with PUT /entities/{id}/external-ids (pin the source id later,
        to sync). It answers 201 with the RESOLVED entity. 400 invalid body; 422
        type outside movie|tv or empty title.
      tags: [entities]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItem" }
      responses:
        "201":
          description: Item created, resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/types:
    get:
      operationId: listEntityTypes
      summary: >
        Entity types with cataloged data (briefings 0109/0110).
      description: >
        Returns the distinct `type` values with at least 1 CATALOGED entity
        (status != draft), sorted by `count DESC, type ASC`, with no fixed
        list — it covers any type that actually exists in the database (e.g.
        movie, tv, album, artista, faixa). Feeds the "recently added" carousels
        on the home page (0109) and the navbar library dropdown (0110).
        STATIC route, resolved before /entities/{id}.
      tags: [entities]
      responses:
        "200":
          description: Types with data, from most to least numerous.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityType" }

  /api/v1/entities/{id}:
    get:
      operationId: getEntity
      summary: Entity resolved per language (layers + fallback chain).
      description: >
        Resolves the entity in the requested language (?lang=, default = primary
        from settings), with the fallback chain `requested → fallback → original_language
        → file` (ADR-0019). The response is FLAT and carries `resolved_languages`
        (field → effective language map) and `lang` (echo of the request). `lang`
        outside the allowed set → 400.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Resolved entity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: purgeEntity
      summary: Individual purge of an entity (briefing 0018).
      description: >
        Explicit PURGE (the only destructive door, ADR-0012): deletes the entity;
        the ON DELETE CASCADE takes media_file/media_external/media_override/asset
        along, and the on-disk asset binary directory is cleaned up best-effort.
        It is never a side effect of another action — always the owner's, always
        explicit.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Entity purged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeResult" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/settings/languages:
    get:
      operationId: getLanguageSettings
      summary: Language config (primary, fallback, allowed).
      description: >
        Returns the current language config (ADR-0018). When there is no row
        stored yet, it answers the safe default (`pt-BR` / `en` / `[pt-BR, en]`).
      tags: [settings]
      responses:
        "200":
          description: Language config.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageSettings" }
    put:
      operationId: putLanguageSettings
      summary: Stores the language config (with validation).
      description: >
        Validates that `primary` and `fallback` ∈ `allowed` and that the codes are
        not empty, then persists (upsert) and invalidates the cache. 422 when invalid.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguageSettings" }
      responses:
        "200":
          description: Config gravada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageSettings" }
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/settings/enrichment-retroativo:
    get:
      operationId: getEnrichmentRetroativoSettings
      summary: Retroactive enrichment throttle config (briefing 0085).
      description: >
        Returns the minimum interval (in days) between two retroactive
        enrichment attempts for the SAME item, applied to libraries without
        their own override (`Source.retroactive_enrichment_days`). When there is
        no row stored yet, it answers the safe default (`{"retry_days": 15}`).
      tags: [settings]
      responses:
        "200":
          description: Retroactive enrichment throttle config.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/RetroactiveEnrichmentSettings" }
    put:
      operationId: putEnrichmentRetroativoSettings
      summary: Stores the retroactive enrichment throttle config (with validation).
      description: >
        Validates that `retry_days` is between 1 and 365, then persists (upsert)
        and invalidates the cache. From the NEXT run of the `saude_biblioteca`
        job on, libraries without their own override start to use the new value,
        without restarting the server. 422 when outside the range.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/RetroactiveEnrichmentSettings" }
      responses:
        "200":
          description: Config gravada.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/RetroactiveEnrichmentSettings" }
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/settings/auto-materialize-artwork:
    get:
      operationId: getAutoMaterializeArtworkSettings
      summary: Automatic artwork materialization toggle (briefing 0089).
      description: >
        Returns whether automatic artwork materialization is on. When it is on,
        every successful scan auto-import (movie via immediate auto-match, or
        series) immediately materializes, in the real library folder, the
        artwork discovered in the inventory -- without waiting for the
        `midias_faltantes` periodic job or a manual click. When there is still
        no row stored, it answers the safe default (`{"enabled": false}`).
      tags: [settings]
      responses:
        "200":
          description: Automatic artwork materialization toggle.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AutoMaterializeArtworkSettings" }
    put:
      operationId: putAutoMaterializeArtworkSettings
      summary: Stores the automatic artwork materialization toggle.
      description: >
        Persists (upsert) the toggle and invalidates the cache. Scope restricted
        to the scan AUTO-IMPORT path (new auto-matched movie, new series) -- it
        does not affect manual actions (Fix, Confirm candidate, Download
        Metadata, batch auto-match), even with the toggle on.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/AutoMaterializeArtworkSettings" }
      responses:
        "200":
          description: Toggle stored.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AutoMaterializeArtworkSettings" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/settings/auto-download-trailer-tema:
    get:
      operationId: getAutoDownloadTrailerTemaSettings
      summary: Automatic trailer/theme song download toggle (briefing 0104, ADR-0026).
      description: >
        Returns whether automatic trailer/theme song download is on.
        The toggle is shared by TWO mechanisms (ADR-0026 item 5): the
        `trailer_tema_faltantes` periodic job (always registered/schedulable,
        independent of this toggle) AND the automatic trigger on scan -- when
        on, every successful auto-import (movie via immediate auto-match,
        or series) fires, in the background, an attempt to download
        trailer/theme for the new item, without waiting for the periodic job or
        a manual click and without delaying the scan response. When there is
        still no row stored, it answers the safe default (`{"enabled": false}`).
      tags: [settings]
      responses:
        "200":
          description: Automatic trailer/theme song download toggle.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AutoDownloadTrailerTemaSettings" }
    put:
      operationId: putAutoDownloadTrailerTemaSettings
      summary: Stores the automatic trailer/theme song download toggle.
      description: >
        Persists (upsert) the toggle and invalidates the cache. Scope restricted
        to the scan AUTO-IMPORT path (new auto-matched movie, new series) -- it
        does not affect the manual trailer/theme button (0102/0103), even with
        the toggle on; the periodic job remains always schedulable regardless
        of this value.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/AutoDownloadTrailerTemaSettings" }
      responses:
        "200":
          description: Toggle stored.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AutoDownloadTrailerTemaSettings" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/settings/ytdlp:
    get:
      operationId: getYtdlpSettings
      summary: yt-dlp binary status + custom path (briefing 0101, ADR-0025).
      description: >
        Foundation of the YouTube downloader reused by trailer (briefing
        0102) and theme song (briefing 0103). Returns the EFFECTIVE status of
        yt-dlp: `disponivel` says whether there is a usable binary now; `origem`
        is `"custom"` (admin path, database or env `MYMEDIADB_YTDLP_PATH`),
        `"baixado"` (downloaded dynamically by the process itself on first
        need) or `"nenhum"` (unavailable); `detalhe` carries the reason
        when `disponivel=false` (e.g. download failure with no network).
        `custom_binary_path` is the path currently stored in the DATABASE (`null`
        when not configured -- distinct from `origem="custom"` via env, which
        is never echoed by this API). Precedence database > env, same spirit
        as ADR-0023.
      tags: [settings]
      responses:
        "200":
          description: yt-dlp status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YtdlpSettings" }
    put:
      operationId: putYtdlpSettings
      summary: Stores (or clears) the custom yt-dlp binary path.
      description: >
        Persists (upsert) `custom_binary_path` into `app_settings` and syncs
        the yt-dlp Manager IMMEDIATELY -- runtime effect, without restarting
        the server. `null` or an empty string clears the override (goes back to
        inheriting the `MYMEDIADB_YTDLP_PATH` env var/automatic download). Returns
        the same shape as GET, already with the recalculated status.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/YtdlpCustomPath" }
      responses:
        "200":
          description: Path stored; status recalculated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/YtdlpSettings" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/settings/catalog-completeness:
    get:
      operationId: getCatalogCompletenessSettings
      summary: Catalog completeness config, per type (briefing 0057).
      description: >
        Returns the current "catalog completeness" config — which fields and
        artwork the owner considers desirable for an item of each `entity.type`
        to be well cataloged (a concept DIFFERENT from OWNERSHIP completeness, see
        `web/src/lib/entity-badges.ts`). When there is still no
        `catalog_completeness` key stored in `app_settings`, it answers the
        factory default (`description` + `media_file` + `artwork:[poster]` marked for
        `movie` and `tv`, the rest unmarked) without writing anything.
      tags: [settings]
      responses:
        "200":
          description: Catalog completeness config.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CatalogCompletenessSettings" }
    put:
      operationId: putCatalogCompletenessSettings
      summary: Stores the catalog completeness config (full replacement).
      description: >
        Replaces the whole config (it is not a partial PATCH — same pattern as
        PUT /settings/languages: the form always sends the complete object).
        Validates that each type key is not empty (`""`) and that each item of
        `artwork` belongs to the system's valid kinds registry
        (`internal/server/assets.go`); types without an entry (`{}`) are accepted and
        are equivalent to "nothing required" for the missing types. It answers an echo of the
        stored config. 400 body is not a valid JSON object; 422 empty type key
        or unknown artwork kind.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogCompletenessSettings" }
      responses:
        "200":
          description: Config gravada.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/CatalogCompletenessSettings" }
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/integrations:
    get:
      operationId: listIntegrations
      summary: Lists the registered configurable integrations (briefing 0095, ADR-0023).
      description: >
        Foundation of integration config writable to the database, with precedence
        over the environment variable — today only `tmdb` is registered (TVDB and
        fanart.tv still go via env var directly, out of scope). For each
        integration, it resolves the EFFECTIVE value (database → env var → absent) of
        each field and computes `configurada` via the provider's own rule
        (e.g. TMDB accepts `token` OR `api_key`). No dedicated UI in this delivery
        — consumed by briefing 0096.
      tags: [integrations]
      responses:
        "200":
          description: Registered integrations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationsListResponse" }

  /api/v1/integrations/{slug}:
    get:
      operationId: getIntegration
      summary: Field schema + effective value of ONE integration (briefing 0095).
      description: >
        Returns the integration field schema (`token`/`api_key` for
        TMDB) along with the EFFECTIVE value of each one (database → env var → absent).
        A field with `tipo:"secret"` NEVER returns the raw `valor` — only `definido`
        (whether there is any effective value) and `origem` (`"banco"`, `"env"` or
        `"nenhum"`). 404 if the slug is not registered.
      tags: [integrations]
      parameters:
        - $ref: "#/components/parameters/IntegrationSlug"
      responses:
        "200":
          description: Integration detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationDetail" }
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putIntegration
      summary: Stores (partially) the values of ONE integration (briefing 0095).
      description: >
        PARTIAL upsert into `integration_config`: only the keys present in
        `valores` change; a `null` value REMOVES the key (the field goes back to
        inheriting the bootstrap/fallback env var, or stays `origem:"nenhum"` if
        that one is also empty). It does not block on missing required fields —
        the owner can save partially (it only reflects in `configurada:false` in the
        listing). No hot-reload: a provider already built at boot (e.g. the
        external search TMDB) only starts to use the new value after restarting the
        process (ADR-0023). 404 if the slug is not registered; 422 if
        `valores` comes empty or names a key that is not a field of the schema
        of this integration.
      tags: [integrations]
      parameters:
        - $ref: "#/components/parameters/IntegrationSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutIntegrationRequest" }
      responses:
        "200":
          description: Integration detail after the write (same shape as GET).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationDetail" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/schema/entity-fields:
    get:
      operationId: getEntityFieldsSchema
      summary: Description of the schema-driven editorial form (briefing 0030).
      description: >
        Returns the field DESCRIPTORS of the editorial form, derived from the single
        source `resolver.CamposEditaveis()` combined with the presentation registry
        (label/group/widget/order/range). The front end builds the inputs and the
        client validation from here — without retyping the field list. Static metadata
        (immutable between deploys), without authentication and cacheable. The list comes SORTED
        by ascending `order`. `extension_data` is left out (it is not a simple
        form field).
      tags: [schema]
      responses:
        "200":
          description: Field descriptors of the editorial form.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldSchema" }

  /api/v1/entities/{id}/enrich:
    post:
      operationId: enrichEntity
      summary: Enriches an existing entity from the provider (briefing 0015).
      description: >
        Pulls the source detail and writes the external layer (media_external, raw
        payload) + the identity (external_ids) + the cached poster; it does NOT touch
        override or the owner's artwork (non-destructive). Optional body: without
        source it uses "tmdb"; without source_id it uses the entity's
        external_ids[source] (422 if there is no id).
        It answers the RESOLVED entity (with the composed external data).
        MULTI-LANGUAGE (briefing 0020): the source pulls ALL allowed translations
        (settings.allowed) in a single round trip and writes an AUGMENTED payload tagged by
        language, besides writing entity.original_language (fallback anchor). The
        RESOLVED shape of this response does not change — it only starts to have more languages for
        the `?lang=` of GET /entities/{id} to serve. `force: true` (briefing 0088)
        ignores the 24h cache of `external_detail` and always fetches the most
        recent detail from the provider — without `force` (or `force: false`) the cache
        keeps being served normally.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrichRequest" }
      responses:
        "200":
          description: Entity resolved after the enrichment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/external-ids:
    put:
      operationId: updateExternalIds
      summary: "Edits the entity external identity (briefing 0027)."
      description: >
        Writes the COMPLETE external_ids map (source -> id at the source). The generated
        columns external_id_tmdb/imdb re-derive from the JSON, so pinning the id prepares a
        future sync (the owner fixes the id when the source changes/deletes/merges). An
        empty value removes that source. It does NOT re-enrich (the owner calls /enrich later).
        It answers 200 with the RESOLVED entity. 404 entity does not exist; 400 invalid body;
        422 empty (source) key.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateExternalIds" }
      responses:
        "200":
          description: Entity resolved with the new identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/override:
    get:
      operationId: getOverride
      summary: RAW override blob of the owner (briefing 0016).
      description: >
        Returns `override_json` exactly as STORED (`{}` when there is no override),
        so the UI can tell "overridden" from "inherited" PER FIELD and PER LANGUAGE. It does not
        reinterpret the values — the resolver interprets them when reading the entity. Translatable
        fields (title/description/tags) appear as a MAP per language
        (`{"pt-BR":…, "en":…}`); neutral fields (original_title/release_date/
        extension_data) as the direct scalar/object. 404 if the entity does not exist.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Raw override blob (sparse object).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverrideBlob" }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchOverride
      summary: Merges a sparse override patch, PER LANGUAGE (briefing 0016).
      description: >
        SPARSE 2-level MERGE over `override_json`. `?lang=` is the BRUSH of the
        translatable fields: each translatable key in the body is merged into
        `override[campo][lang]` (deep-merge preserving the other languages of the field; a
        LEGACY scalar override migrates to `{primary: <legacy>}` first). NEUTRAL fields
        merge the scalar into `override[campo]` (`lang` is ignored for them).
        `null` in the language is a VALID value = "set empty" (erases the base and interrupts the
        fallback in that language — distinct from CLEARING via DELETE). `lang` default =
        primary; outside the allowed set → 400. It answers the entity RESOLVED in `lang`.
        Non-editorial key or invalid shape → 422.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/LangQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverridePatch" }
      responses:
        "200":
          description: Entity resolved in the requested language after the merge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: resetOverride
      summary: Reset — deletes the whole override (briefing 0016).
      description: >
        Removes the entity override row: all fields go back to INHERITING the base
        (external/file). It answers the RESOLVED entity. 404 if the entity does not exist.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Entity resolved (on the base, without override).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/owner-order:
    get:
      operationId: getOwnerOrder
      summary: Series owner order (ADR-0033).
      description: >
        Returns the OWNER ORDER: the numbering the owner declared for the series when the
        release they have does not follow any provider order. It is the only place where
        SEVERAL episodes can share the same season/number — the unit that
        merged several broadcast episodes into a single entry (a DVD/streaming re-release),
        which neither TMDB nor TheTVDB can model. Missing order → `units: []`.
        Entity that is not a series → 422; nonexistent → 404.
      tags: [entities]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Owner ordering (empty when not declared).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerOrder" }
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    put:
      operationId: putOwnerOrder
      summary: Declares (or replaces) the owner order (ADR-0033).
      description: >
        Writes the COMPLETE series order. It validates everything BEFORE writing: a unit with at
        least 1 episode, season >= 0 and number >= 1, no repeated (season, number)
        pair, no episode in two units and every episode belonging to THIS
        series. Refusal → 422 with a stable code (`empty_units`, `invalid_number`,
        `duplicate_number`, `empty_unit`, `duplicate_episode`, `episode_not_in_series`,
        `too_many_units`, `too_many_episodes`) and nothing is written. The order lives in the
        OVERRIDE layer (`extension_data.core.tv@1.owner_order`), so it survives a
        re-enrichment and does not erase the owner's other overrides. When it exists, it is the
        DEFAULT order of the series and the scanner matches files by it first.
      tags: [entities]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerOrder" }
      responses:
        "200":
          description: Order stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerOrder" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteOwnerOrder
      summary: Removes the owner order (ADR-0033).
      description: >
        Removes ONLY the owner order, preserving the other overrides in the blob (the
        namespace/`extension_data` disappear when they become empty; an empty blob removes the
        override row). Idempotent: 204 even when there was no order.
      tags: [entities]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed (or already absent).
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/override/{campo}:
    delete:
      operationId: clearOverrideField
      summary: Clear the override of one field (per language or whole, briefing 0016).
      description: >
        CLEAR override (≠ set empty). TRANSLATABLE field WITH `?lang=` removes only
        `override[campo][lang]` (and the field key if the map becomes empty). Translatable field
        WITHOUT `?lang=`, or NEUTRAL field, removes the WHOLE field key (all languages).
        Removing a missing key is idempotent (200). If the blob becomes empty, the override
        row is removed. It answers the RESOLVED entity. Non-editorial `{campo}` →
        422; `lang` present outside the allowed set → 400; entity does not exist → 404.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: campo
          in: path
          required: true
          description: >
            Editorial field to clear (title, original_title, description,
            release_date, tags, extension_data).
          schema: { type: string }
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Entity resolved after clearing the field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/files:
    get:
      operationId: getEntityFiles
      summary: Entity files (media_file) with mediainfo.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: File list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileList" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/members:
    get:
      operationId: getEntityMembers
      summary: Members of a collection (briefing 0025).
      description: >
        The movies linked to a `type='collection'` entity by
        `entity_relation(kind='collection')`, as CARDS (the same shape as
        GET /entities), sorted by ascending YEAR (no year at the end). `[]` when the
        entity is not a collection or has no members; 404 when the entity does not exist. The
        `?lang=` is accepted for parity, but the card uses the base title (like the list).
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Member cards (array, possibly empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityCard" }
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: addCollectionMember
      summary: "Links an item to the collection as a member (briefing 0025, Phase B)."
      description: >
        Links the `child_id` item to the `id` collection by `entity_relation(kind='collection')`.
        Validates that the parent exists and is a collection (otherwise 404/422), and that the child exists,
        is not itself and is not another collection (no nesting). Idempotent (re-linking
        does not duplicate). Returns the UPDATED member list (same shape and ordering by
        year as GET).
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMember" }
      responses:
        "200":
          description: Member cards after linking (array, sorted by year).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityCard" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/members/{childId}:
    delete:
      operationId: removeCollectionMember
      summary: "Unlinks a member from the collection (briefing 0025, Phase B)."
      description: >
        Removes the `entity_relation(kind='collection')` link between the `id` collection and the
        `childId` item. Idempotent (unlinking what is not linked is a no-op). 404 when
        the collection does not exist. Returns the UPDATED member list.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: childId
          in: path
          required: true
          description: Id of the member item to unlink.
          schema: { type: string }
      responses:
        "200":
          description: Member cards after unlinking (array).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityCard" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/episodes:
    get:
      operationId: getEntityEpisodes
      summary: Series episodes grouped by display order (briefing 0040).
      description: >
        Returns ALL episodes of the series (descendants via the
        series→season→episode tree) GROUPED and sorted by the `ordering` order
        (official/dvd/absolute…), projected ON READ from the `numbering`
        stored at import (core.tv@1) — ADR-0021: ALTERNATIVE orders do not become
        a season entity, they are grouped here on the server (season headers
        are labels, only the episode is navigable). Each card carries `numbering` already in that
        order. A missing or invalid `ordering` falls back to the series default; `absolute` is a
        special order (a single continuous group by `absolute_number`). An episode without
        numbering in that order falls into a "Sem numeração" group at the end. Entity that is not a
        series → empty groups; 404 when the entity does not exist.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: ordering
          in: query
          required: false
          description: >
            Display order (one of the `orderings.available` from the series detail, e.g.
            `official`, `dvd`, `absolute`). Absent/invalid falls back to the series default.
          schema: { type: string }
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Episodes grouped by the applied order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeGroups" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/assets/poster:
    get:
      operationId: getEntityPoster
      summary: Serves the local poster binary (image/*).
      description: >
        Returns the poster file with the correct content-type. 404 when there is no
        artwork (the UI falls back to the placeholder); 403 when the stored path is not under
        a known datasource (path-traversal guard).
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Image binary.
          content:
            image/*:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/assets:
    get:
      operationId: listAssets
      summary: Entity artwork gallery (briefing 0017).
      description: >
        Lists the entity assets (poster/fanart), each with origin (`user` from the
        owner × cached `external` × `local` from the scanner), the `preferred` flag (read
        from `meta_json`) and the binary `url` (the /file route). `[]` when there is no
        artwork; 404 if the entity does not exist.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Asset list (empty when there is no artwork).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetList" }
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: uploadAsset
      summary: Upload of custom owner artwork (origin=user, briefing 0017).
      description: >
        Receives multipart/form-data — field `file` (the binary) + field `kind`
        (`poster`|`fanart`, default `poster`). The type is validated by the MAGIC BYTES
        (not by the extension nor by the client header): only `image/jpeg|png|webp`.
        Size ≤ 20 MiB. It writes the binary atomically under the assets directory and
        creates the asset with `origin='user'`. Uploading artwork already makes it be served
        as the poster (it beats the external one). 201 with the created asset.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image binary (JPEG, PNG or WebP).
                kind:
                  type: string
                  enum: [poster, fanart]
                  description: "Artwork kind (default: poster)."
      responses:
        "201":
          description: Asset created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/assets/{assetId}/file:
    get:
      operationId: getAssetFile
      summary: Serves the binary of a specific asset (image/*).
      description: >
        Gallery thumbnails: returns the asset file with the correct content-type
        and the SAME path-traversal guard as the poster. The `assetId` must
        belong to the entity. 404 when it does not exist/the binary is gone; 403 outside the
        trusted roots.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Image binary.
          content:
            image/*:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/assets/{assetId}/prefer:
    put:
      operationId: preferAsset
      summary: Marks the asset as preferred/main of its kind (briefing 0017; extended in 0062).
      description: >
        Sets `meta.preferred=true` on the asset and CLEARS the flag on the others of the same
        `(entity, kind)` — one preferred per kind. Preserves the other keys of
        `meta_json`. Since briefing 0062: if the asset has no `local_path` yet
        (not materialized in the real folder), it materializes first — the SAME effect as
        POST .../assets/{assetId}/materialize, including the download to the cache
        if needed (reuses the 0048 download function). Then it RENAMES
        the physical files of the same `kind`/folder to reflect the new order: the
        former main one (if any) becomes the next free numeric suffix
        (`os.Rename`, never copies bytes again), the new main one takes the bare name
        (e.g. `poster.jpg`). Sets `is_principal=1` on the asset (and `0` on the one that was
        main before in the same pair) — source of truth in its own column,
        replacing `meta_json.preferred` for the new code. 200 with the updated
        asset (`local_path`/`is_principal` reflected); 404 asset/entity
        does not exist OR entity without a present `media_file` (no destination folder
        to materialize/rename); 502 if materialization requires a download and
        it fails; 503 without a configured assets (cache) directory.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Asset marked as preferred/main (materialized and renamed if needed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/assets/{assetId}:
    delete:
      operationId: deleteAsset
      summary: Removes owner artwork (origin=user, briefing 0017).
      description: >
        Deletes the asset row + the binary (best-effort). It refuses (422) to delete
        `origin='external'` artwork: it is re-pullable cache that disappears by itself on re-enrich
        (non-destructive). 200 with the asset removed; 404 if it does not exist/it is not from the
        entity.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Asset removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/assets/{assetId}/materialize:
    post:
      operationId: materializeAsset
      summary: Writes the artwork physically into the real library folder (briefing 0062).
      description: >
        Downloads the artwork to the internal cache (`assetsDir`) if `path_or_uri` is not
        already materialized there (reuses the 0048 download function) and then
        writes a physical COPY inside the real library folder, under the canonical
        Kodi/Emby name computed by `internal/localmedia/naming.go` (bare name if it is the
        only video/only `is_principal` of the kind in the folder; otherwise prefixed by the video
        name or a numeric rotation suffix). Atomic write (temporary file
        + rename). For a candidate that does not exist yet as an `asset` (item of the
        fanart.tv/TMDB lazy inventory not selected yet), the UI chains
        a POST .../artwork/select first (which creates the asset) and only then calls this
        endpoint. 200 with the updated `asset`, with `local_path` filled; 404 if
        the asset/entity does not exist OR the entity has no present `media_file`
        (no destination folder); 502 if the download to the cache fails; 503 without a
        configured assets (cache) directory.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Asset materialized in the real folder (local_path filled).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/artwork:
    get:
      operationId: getEntityArtwork
      summary: Available artwork grouped by kind (briefing 0048).
      description: >
        Merges three sources per kind: the owner's LOCAL assets (upload `origin='user'`
        and cache `origin='external'`), the poster/background from external layers with a provider
        (e.g. TMDB) and the fanart.tv lazy INVENTORY (`media_external source='fanarttv'`,
        without downloading binaries). Every `url` already goes through the image proxy, so the UI
        does not depend on the source CDN. It also brings `available: {kind: count}` for the
        card badges. Since briefing 0062, each item also carries `is_local_in_library`
        (`local_path != null`) and `is_principal`, and each array per kind comes SORTED:
        `is_principal` desc, `is_local_in_library` desc, original order preserved asc
        (same `montarGruposArtwork` aggregator, it only adds the sort at the end). Read
        only. 404 if the entity does not exist; 503 without persistence.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Artwork grouped by kind plus `available`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtworkResponse" }
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/artwork/select:
    post:
      operationId: selectArtwork
      summary: Downloads the selected artwork from the inventory (briefing 0048).
      description: >
        The ACTION of the decision "list on import, download ONLY the selected one": it receives the `url` of
        ONE inventory artwork (fanart.tv/TMDB) and the `kind`, DOWNLOADS the binary and materializes it
        as an `origin='external'` asset, keeping the origin url in `meta_json`. Idempotent:
        if an external asset with the same url+kind already exists, it reuses it without downloading again. With `prefer=true`,
        it marks it as preferred (one per kind). Security (anti-SSRF): the body is from the user,
        so the url HOST is validated against the SAME allowlist as the image proxy — a host outside it
        → 422. 200 with the asset; 404 entity does not exist; 422 kind outside the set or host not
        allowed; 502 if the download fails; 503 without an assets directory.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelectArtworkRequest" }
      responses:
        "200":
          description: Asset materialized (new or reused).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/search:
    get:
      operationId: search
      summary: Local-first search in the catalog + external source (briefing 0014).
      description: >
        ALWAYS queries the local catalog (FTS5) and returns cards in the same shape as the
        list. When an external provider is configured (e.g. TMDB), it adds
        "not saved" results (saved:false) — the search never creates an entity.
        `external_available:false` separates "source unavailable/not configured" from
        "zero results". External failure/timeout degrades (external:[]) without 5xx.
      tags: [entities]
      parameters:
        - name: q
          in: query
          description: Search term (required).
          required: true
          schema: { type: string }
        - name: type
          in: query
          description: "Filters by type (movie, tv). Absent = all."
          required: false
          schema:
            type: string
            enum: [movie, tv]
        - name: include
          in: query
          description: >
            Re-links sub-nodes of the series tree in the local results, which by
            default are left out (the search is top-level: movie/tv/collection). CSV,
            accepts `season` and/or `episode` (e.g. `include=season,episode`);
            values outside that set are ignored. The sub-nodes come in the same
            `local[]`, distinguishable by the `type` field — the UI splits them into sections.
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Local and external results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/import:
    post:
      operationId: importEntity
      summary: Explicit import of an external result (find-or-create, briefing 0015).
      description: >
        Find-or-create by external id (MD4 dedup): if an entity with that
        external_id already exists, it reuses it (200); otherwise it creates one (201, status cataloged, initial title
        from the detail). In both cases it enriches by the same path (writes external
        + external_ids + cached poster, never override). It answers the entity
        RESOLVED. MULTI-LANGUAGE (briefing 0020): pulls all allowed translations
        and writes entity.original_language — see POST /entities/{id}/enrich.
        `type=collection` (0025) imports the whole collection: creates the collection entity,
        imports each member movie (find-or-create) and links them by entity_relation.
      tags: [entities]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: Entity already exists (reuse), resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "201":
          description: Entity created and enriched, resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/collections:
    post:
      operationId: createCollection
      summary: "Creates a local manual collection (briefing 0025, Phase B)."
      description: >
        Creates a LOCAL `type='collection'` entity (without an external source) with the title and
        description given by the owner. Unlike collection import (0025 Phase A), there
        is no source: the collection is born empty and members enter later via
        POST /entities/{id}/members. It answers 201 with the RESOLVED entity. 400 invalid
        body; 422 empty title.
      tags: [entities]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCollection" }
      responses:
        "201":
          description: Created collection, resolved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/external/{source}/{type}/{id}:
    get:
      operationId: getExternalDetail
      summary: Rich external detail before importing (briefing 0022).
      description: >
        COMPLETE detail of an external item (like TMDB), so the owner can decide to
        import: title/original title, synopsis, tagline, genres and keywords,
        runtime, age rating (per active language region, US fallback),
        poster and background, videos, collection, similar (navigable), external score and links.
        It PERSISTS on the first call (re-composable cache) and serves from the cache on the following
        ones (refresh by TTL or when the set of allowed languages changes). It resolves the
        translatable fields in the active language. Viewing the external item NEVER creates an entity. NO
        cast/crew (MD6) nor local score — dedicated briefings.
      tags: [entities]
      parameters:
        - name: source
          in: path
          required: true
          description: "External source (e.g. tmdb)."
          schema: { type: string }
        - name: type
          in: path
          required: true
          description: "Item type at the source (movie|tv)."
          schema:
            type: string
            enum: [movie, tv]
        - name: id
          in: path
          required: true
          description: Item id AT THE SOURCE (source_id).
          schema: { type: string }
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Rich external detail, resolved in the active language.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalDetail" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/external/{source}/collection/{id}:
    get:
      operationId: getExternalCollection
      summary: External collection as its own page (briefing 0024, follow-up of 0023).
      description: >
        Movie collection (TMDB belongs_to_collection) as a navigable destination:
        name/synopsis/artwork of the set and the list of PARTS (movies), each
        navigable to the external detail. Localized in the active language (pragmatic
        single-language — without the 0022 multi-language re-composable cache, which stays as a
        follow-up). The hero artwork (poster/background) may come as a local proxy
        route (0024); the part thumbnails remain direct. Viewing the collection NEVER
        creates an entity. Requires a source with collection capability (otherwise 503).
      tags: [entities]
      parameters:
        - name: source
          in: path
          required: true
          description: "External source (e.g. tmdb)."
          schema: { type: string }
        - name: id
          in: path
          required: true
          description: Collection id AT THE SOURCE (source_id).
          schema: { type: string }
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: External collection, resolved in the active language.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalCollectionDetail" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/external/{source}/album/{id}:
    get:
      operationId: getExternalAlbum
      summary: External album as its own page (briefing 0115 Part 2, ADR-0029).
      description: >
        OFFICIAL tracks of an album release, so the owner can see what is missing to import
        from what is already in the catalog -- the same "not owned external item" pattern that
        movie/series/collection already use. `id` is the RELEASE-GROUP MBID (the same stored
        in external_ids["mbid"] of the internal `album` entity). `internal_id` (internal-
        first, 0026) comes filled on the album and on each track already cataloged. Requires
        a source with the selective album capability (provider.MusicaAlbumProvider,
        otherwise 503). Viewing the external item NEVER creates an entity.
      tags: [entities]
      parameters:
        - name: source
          in: path
          required: true
          description: "External source (e.g. musicbrainz)."
          schema: { type: string }
        - name: id
          in: path
          required: true
          description: Album release-group MBID AT THE SOURCE (source_id).
          schema: { type: string }
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: External album with its official tracks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalAlbum" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/images:
    get:
      operationId: getImageProxy
      summary: Read-through proxy for external images (briefing 0024).
      description: >
        Downloads and CACHES on disk the image pointed to by `src` (poster/background of the
        EXTERNAL detail, pre-import) and serves it from the cache on the next ones — the UI stops hitting
        the source CDN at runtime, like the cached poster/fanart of the entity (0015).
        `src` MUST point to an allowlist host (SSRF defense); the cache is per
        URL (sha256), shared. It answers the image BINARY (not JSON). 503 without
        an assets directory; 400 if `src` is missing or the host is not allowed; 502 if the
        source fails or does not return an image.
      tags: [entities]
      parameters:
        - name: src
          in: query
          required: true
          description: "Absolute image URL, on an allowed host (e.g. image.tmdb.org)."
          schema: { type: string, format: uri }
      responses:
        "200":
          description: Cached image binary.
          content:
            image/*:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/person/{id}:
    get:
      operationId: getPerson
      summary: Person page with filmography from the catalog (briefing 0029 Phase D).
      description: >
        The person (actor/crew member) deduplicated in the catalog plus their
        FILMOGRAPHY = the works already imported that credit them. It is the internal-first destination
        of the cast/crew card (when the credit carries `person_id`). Read-only at this
        stage (the person is not cataloged as its own entity). 404 when the id does not
        exist in the catalog.
      tags: [entities]
      parameters:
        - name: id
          in: path
          required: true
          description: "Person id in our catalog (person.id)."
          schema: { type: string }
      responses:
        "200":
          description: The person and their filmography.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/review:
    get:
      operationId: listReview
      summary: Review queue (draft or low confidence, briefing 0018).
      description: >
        Cards (same EntityCard shape as the list) of the items that ask for curation:
        `status='draft'` (unidentified) OR with a `present` media_file whose
        `match_confidence` is in (0, 70) — the threshold mirrors the
        LIMIAR_BAIXA_CONFIANCA=70 of the front end. Sorted by ascending confidence (worst
        first), drafts at the end. `[]` when empty.
      tags: [entities]
      responses:
        "200":
          description: Review queue cards (array, possibly empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityCard" }

  /api/v1/review/auto-match:
    post:
      operationId: autoMatchReview
      summary: BATCH auto-match of the review queue (briefing 0050).
      description: >
        Tries to resolve by itself all eligible items of the queue (or the
        subset of `ids` given in the body, when present): for each
        one, it derives title/year from the file, searches local-first + the default
        external source, scores the candidates (Jaro-Winkler + year adjustment) and applies
        the best one when the score reaches `LimiarAutoMatch` (92) — it links to an
        existing local entity (never duplicates) or applies the external identity
        (same sequence as "Fix"). Without `ids` or with empty `ids`,
        it processes ALL eligible ones (same source as GET /review). Always 200
        with the aggregated summary; a nonexistent id in the body is ignored
        (idempotent), it does not bring down the batch.
      tags: [entities]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoMatchBatchRequest" }
      responses:
        "200":
          description: Aggregated summary of the batch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoMatchBatchResult" }

  /api/v1/orphans:
    get:
      operationId: listOrphans
      summary: Orphan queue (auto-created, gone, no investment, briefing 0018).
      description: >
        Cards of the orphan entities: `status='cataloged'` (auto-created by the scanner),
        with at least one media_file and ALL of them `missing`, and WITHOUT owner investment
        (no media_override and no asset with origin='user'). An entity that was only imported (without
        media_file) is not an orphan. Nothing is deleted by itself — the purge is always explicit.
      tags: [entities]
      responses:
        "200":
          description: Orphan queue cards (array, possibly empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityCard" }

  /api/v1/entities/{id}/confirm:
    post:
      operationId: confirmEntity
      summary: Confirms the low-confidence match (briefing 0018).
      description: >
        The owner accepts the guess: it raises the `match_confidence` of all media_file of the
        entity to 100 (owner authority), taking the item out of the review queue.
        It answers the RESOLVED entity. It does not touch override/artwork. 404 if the entity does
        not exist.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Entity resolved after confirming.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/correct:
    post:
      operationId: correctEntity
      summary: Fixes the match by providing the correct identity (briefing 0018).
      description: >
        The owner provides the correct source id: it writes external_ids[source]=source_id
        (identity wins, MD4) and RE-ENRICHES through the 0015 service (multi-language for
        free), then raises the confidence to 100. It does not touch override/artwork (enrich is
        non-destructive). It answers the RESOLVED entity. source default "tmdb";
        source_id required (422). 404 does not exist; 502 if the source fails; 503 if
        enrich is disabled.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectRequest" }
      responses:
        "200":
          description: Entity resolved after fixing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/auto-match:
    post:
      operationId: autoMatchEntity
      summary: Individual auto-match of one queue item (briefing 0050).
      description: >
        Tries to resolve ALONE a low-confidence/draft item: it derives
        title/year from the file (same parser as the scan), searches local-first
        (existing catalog) and, with no strong local candidate, searches the default
        external source. It scores the candidates (title Jaro-Winkler + year
        adjustment — final score 0-100) and automatically applies the best one when it
        reaches `LimiarAutoMatch` (92, deliberately above the
        `LIMIAR_BAIXA_CONFIANCA`=70 of 0018): a LOCAL candidate links the entity
        via merge (never duplicates, 0026); an EXTERNAL candidate applies through the SAME
        sequence as "Fix" (writes external_ids + re-enriches + raises the
        confidence). A candidate whose year diverges by more than 1 year is
        DISCARDED, even with an identical title. With no strong candidate in any
        source, the item stays intact in the queue. ALWAYS 200 (never 5xx just for "not
        finding a candidate" — it is a valid result). 404 if the entity does not exist.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Auto-match result (resolved or not).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoMatchResult" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/match-suggestion:
    delete:
      operationId: dismissMatchSuggestion
      summary: Dismisses the "did you mean this?" hint of an item.
      description: >
        The item screen offers the hint the backend computed for a name it could
        not resolve (see `ResolvedEntity.match_suggestion`). This endpoint says
        the owner is not interested. The row is KEPT with `dismissed = 1`, so
        opening the item again neither queries the sources again nor brings the
        warning back -- dismissing must cost nothing and must not be undone by a
        page reload. Always `204` (idempotent, like the other DELETEs of the
        API); `404` only when the ENTITY does not exist.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "204":
          description: "The hint is dismissed (or there was none)."
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/match-preview:
    get:
      operationId: matchPreview
      summary: Preview of the match candidate, without applying anything (briefing 0060).
      description: >
        Dry-run, read-only, WITHOUT side effect: it reuses the local-first +
        external search and the auto-match scoring (0050), but WITHOUT the
        `LimiarAutoMatch` cut — it returns the HIGHEST-score candidate among local and
        external, even below the threshold (only the disqualifier of a year
        diverging by more than 1 year still excludes a candidate).
        `meets_auto_threshold` signals whether that score would reach the cut of the
        auto-match (0050), without filtering the result. Always `200`, even with no
        candidate in any source (valid result, not an error — same
        convention as the auto-match). 404 if the entity does not exist.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: "The candidate preview (or `found: false` with no candidate)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchPreview" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/confirm-candidate:
    post:
      operationId: confirmCandidate
      summary: Applies the candidate shown by the preview (briefing 0060).
      description: >
        Applies the candidate that `GET /match-preview` showed, **without checking
        `LimiarAutoMatch`** (it is an informed human decision, not an automatic
        cut). `method=local`: merges the queue entity with `local_id`
        (`fundirEntities` — the survivor is always the `local_id` of the body, the
        chosen candidate). `method=external`: same sequence as
        `POST /correct` (writes `external_ids[source]=source_id`, re-enriches
        and raises the confidence). A third endpoint — not a rework of
        `/confirm` nor `/correct`, which keep existing unchanged. 404 if
        the entity does not exist; 422 if the body does not match the `method` (missing
        `local_id`, or missing `source`/`source_id`); 409 when
        `source`/`source_id` already belongs to another entity with owner
        investment (safety net of 0051, the same one `/correct` already exposes today);
        502 if the external source fails to deliver the detail; 503 if enrich
        is disabled.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmCandidateBody" }
      responses:
        "200":
          description: >
            Entity resolved after applying the candidate (same shape as
            `/confirm` and `/correct`).
          headers:
            X-Duplicate-Merged-Id:
              description: >
                Id of the duplicate entity that was merged (removed) during this
                write — present only when the `external` branch automatically merges
                a duplicate without owner investment
                (`resolverColisaoExterna`, briefing 0051; same header that
                `/correct` already uses).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/enrich-missing:
    post:
      operationId: enrichMissing
      summary: On-demand external enrichment of ONE item (briefing 0059).
      description: >
        Fires the SAME search/apply/signal orchestration of the library health
        job (`tentarEnriquecerOuSinalizar`, briefing 0056),
        but for ONE item, outside the job batch and IGNORING the re-attempt
        throttle (`intervaloReTentativaRetroativa`) — an explicit action of the
        owner on the detail page, not the daily sweep. No eligibility guard
        by status/confidence: unlike the job, it can be called on
        ANY non-purged entity, including one that already has `external_ids`
        filled. It always stamps `last_external_match_attempt_at` at the end
        (even with `outcome=none`), to coordinate with the next job batch.
        ALWAYS 200 (never 5xx just for "not finding a candidate" — same pattern as
        `/auto-match`). 404 if the entity does not exist.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Result of the on-demand enrichment (applied, signaled or nothing).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrichMissingResult" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/download-missing-artwork:
    post:
      operationId: downloadMissingArtwork
      summary: Downloads the best available artwork for the missing kinds (briefing 0059).
      description: >
        Recomputes `catalog_completeness` LIVE (same path as the detail page,
        briefing 0058), filters the `artwork:<kind>` keys of `missing` and, for
        each kind, queries the SAME inventory aggregator of briefing 0048
        (local assets + external layers + fanart.tv) and downloads the best option
        available (highest fanart.tv `likes`; on a tie/absence, the first one
        in the aggregator stable order) via `baixarEMaterializarArte`. An item already
        complete (or draft, without `catalog_completeness`) answers 200 with the
        two lists empty, without touching anything. Per kind, it tries multiple
        candidates in sequence before giving up — a download failure of ONE
        option does not propagate as an HTTP error (never 502 here); it only falls into
        `unavailable` when NO candidate of the kind was downloaded. 404 if the
        entity does not exist; 503 if the assets directory is not configured;
        500 only on a real database/infra error.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Kinds that got new artwork, and kinds that were missing with no option available.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/DownloadMissingArtworkResult" }
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/force-reconcile:
    post:
      operationId: forceReconcile
      summary: Forces a manual reconciliation of ONE entity, ignoring the throttle (briefing 0122).
      description: >
        Fires the SAME logic of `Manager.ReconciliarFaixaDraft`/
        `Manager.ReconciliarSerieDraft` (`internal/scanner/reconciliar.go`) already
        used by the `ReconciliarFilhosOrfaos` batch (briefing 0120), but for ONE
        item and COMPLETELY IGNORING the 1x/day throttle
        (`last_external_match_attempt_at`/`retry_days`) — an explicit action of the
        owner on the detail page, not the daily sweep of the `saude_biblioteca` job.
        Difference from `/enrich-missing`: here it is parent-child reconciliation
        (re-linking a draft track/series against the parent already identified),
        not external identity resolution. Dispatch by `entity.type`:
        `faixa` and `tv` actually try; any other type answers
        `{"linked": false}` without trying anything and without stamping. It always stamps
        `last_external_match_attempt_at` at the end of a real attempt (even
        when `linked=false`), to coordinate with the next job batch. 404
        if the entity does not exist.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Forced reconciliation result (relinked or not).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForceReconcileResult" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/refresh-files:
    post:
      operationId: refreshEntityFiles
      summary: Rechecks files/assets/local playback fields on disk (briefing 0088).
      description: >
        Unconditional action of the "Manage" menu (it does not depend on
        `catalog_completeness`, unlike `/download-missing-artwork`).
        It forces the re-hash/mediainfo of the entity `media_file` entries even without
        an mtime/size change (the incremental scan of a whole datasource
        stays as it is — this is a separate entry path, restricted
        to the files of THIS entity); it looks for a new/updated `origin='local'`
        asset in the folder(s) of the files (it covers the case that is
        broken today of the entity already existing in the catalog); and, if there is an `.nfo` in
        `entity.nfo_path`, it reads the LOCAL playback fields
        (watched/play count/user rating/last
        played/resume) and fills in the database only the ones still
        empty — it never overwrites a value already present (non-destructive).
        No body. 404 if the entity does not exist.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Summary of what was rechecked/found/filled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshFilesResult" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/audio-tags/write:
    post:
      operationId: writeAudioTags
      summary: Rewrites the audio tag (ID3v2/Vorbis comment) with the resolved metadata (briefing 0125).
      description: >
        Alternative to the music NFO (decision of briefing 0125: it is not worth the
        investment — only Kodi reads it, the rest of the owner's real ecosystem —
        LMS/Lyrion, Navidrome, gonic, Supysonic and Subsonic/
        OpenSubsonic clients — reads straight from the file tag). It rewrites the tag of the audio
        file(s) with the ALREADY RESOLVED metadata (override ⟵ external
        ⟵ file — the same value that the entity detail displays): title,
        artist, album, year, track/disc, genre, compilation flag,
        MusicBrainz IDs, ISRC and the embedded album cover. `id` can be a
        `faixa` (writes only its file) or an `album` (writes ALL the owned
        tracks of the album, one by one, best-effort — an isolated
        failure does not abort the others); each track carries the artist of its OWN
        track in the artist tag when the artist-credit diverges from the main
        album artist (feat./collaboration, ADR-0027 item 4) — album/
        year/genre/cover keep coming from the album. After each rewritten
        track, it syncs `media_file.hash`/`mtime`/`size` (same
        restricted recheck of briefing 0088), so the next incremental scan
        does not see the file as "changed" by surprise. The write is always
        OVER THE RESOLVED VALUE — it is never read back into the database (the
        "file" layer of the resolver keeps coming only from the next natural
        `ffprobe`). No body. Destructive/irreversible action on the original
        file (no "undo") — it only fires from an explicit click of the
        owner. 404 if the entity does not exist; 422 if `type` is not `faixa`/
        `album` (e.g. `artista` — no coherent "work" cascade); 503 if the
        write mechanism (ffmpeg) is not available in the environment.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Summary of rewritten tracks and failures (partial success is normal in an album cascade).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AudioTagsWriteResult" }
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/materialize-missing-media:
    post:
      operationId: materializeMissingMedia
      summary: Forces a new query to the artwork provider + materializes what is missing (briefing 0088).
      description: >
        Unconditional action of the "Manage" menu (it does not depend on
        `catalog_completeness`). First it queries the registered `ArteProvider`(s)
        again (today: fanart.tv) to update the entity artwork inventory
        (`media_external(source='fanarttv')`);
        then it reuses the SAME materialization of the `midias_faltantes`
        periodic job (`MaterializarMidiasFaltantes`, briefing 0064)
        to write, in the real library folder, the artwork that WINS today
        for each kind still without `local_path`, and the `.nfo` when absent — the same
        effect as the job, only immediate and on demand, restricted to this
        entity. No body. 404 if the entity does not exist.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Materialized artwork and whether the .nfo was written.
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/MaterializeMissingMediaResult" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/nfo:
    post:
      operationId: writeEntityNfo
      summary: (Re)generates and writes the entity .nfo in the real folder (briefing 0062).
      description: >
        Builds the XML from the SAME `resolver.Entidade` that
        `(s *Server) resolverEntity(ctx, id, lang)` already produces (it never duplicates the
        resolution) and writes `<video-name>.nfo` (movie/episode) or `tvshow.nfo`
        at the root of the series folder, via atomic write (temporary file +
        rename). IDEMPOTENT: it always overwrites completely, without merging with an NFO
        from another origin — it is never read back (one-way export, database
        authoritative). It updates `entity.nfo_path`/`entity.nfo_written_at`. 404 if
        the entity does not exist OR has no present `media_file` (no destination
        folder); nothing is written in that case.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: NFO written (or rewritten) successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NfoWriteResult" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/theme:
    get:
      operationId: getEntityTheme
      summary: Serves the local theme song binary (audio/*, briefing 0082).
      description: >
        MINIMAL and LOCAL-ONLY foundation of the theme song (without any provider — there
        is no reliable integrated source, see briefing 0082 §3): it resolves the root folder
        of the item (SAME `DiretorioDestino` resolution used by
        POST .../nfo and .../assets/{assetId}/materialize — series root or
        movie folder) and looks for `theme.mp3`/`theme.ogg`/`theme.flac` there,
        in that order. It returns the binary with the correct Content-Type when
        found. 404 when the entity does not exist, has no present
        `media_file` (no destination folder) or there is no theme file
        in the folder; 503 if entity reads are unavailable (database).
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Theme song binary.
          content:
            audio/*:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/theme/candidato:
    get:
      operationId: getEntityThemeCandidato
      summary: Tells whether there is a ThemerrDB theme song candidate to download (briefing 0103).
      description: >
        The candidate lives in cache (media_external, source=themerrdb, written
        by the best-effort enrichment of briefing 0103, ADR-0025) — this
        endpoint only READS, it never queries ThemerrDB live. It does NOT leak the
        YouTube URL to the client (conservative decision, re-evaluate if the product
        wants a preview before the download); the download happens
        entirely on the server via POST .../theme/download. `ja_tem_local`
        reflects the SAME file that GET /entities/{id}/theme (briefing 0082)
        already serves — theme.{mp3,ogg,flac} in the item root folder, placed by hand
        by the owner OR downloaded by this briefing. 404 when the entity does not
        exist; 503 if entity reads are unavailable (database).
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Availability of the candidate and of the local file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeCandidatoResult" }
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/theme/download:
    post:
      operationId: postEntityThemeDownload
      summary: Downloads the ThemerrDB theme song candidate via yt-dlp and materializes it on disk (briefing 0103, ADR-0025).
      description: >
        Downloads via yt-dlp (foundation of briefing 0101) the candidate cached in
        media_external (source=themerrdb, written by the enrichment) to
        `theme.mp3` at the folder root — the SAME path that GET /entities/{id}/theme
        (briefing 0082) already serves. The download is SYNCHRONOUS (the request stays
        pending until it finishes). NO `force` parameter (unlike the
        trailer): the theme is singular per folder — a `theme.*` already present
        (downloaded before OR placed by hand by the owner) is NEVER overwritten; the
        owner must delete the file manually before re-downloading.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Theme song downloaded and materialized successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThemeDownloadResult" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/trailer:
    get:
      operationId: getEntityTrailer
      summary: Serves the trailer binary materialized on disk (video/*, briefing 0102).
      description: >
        Resolves the item root folder (SAME `DiretorioDestino` resolution
        used by .../nfo, .../theme and .../assets/{assetId}/materialize) and
        looks for the trailer under the canonical Kodi/Jellyfin name
        (`<video-name>-trailer.<ext>` or `trailer.<ext>` in a dedicated
        folder), testing `.mp4`/`.mkv`/`.webm` in that order — `.mp4` is what
        POST .../trailer/download always writes; the others cover a
        trailer placed by hand by the owner with another container. It returns
        the binary with the correct Content-Type when found. 404 when the
        entity does not exist, has no present `media_file` (no destination
        folder) or there is no materialized trailer in the folder; 503 if the entity
        reads are unavailable (database).
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Trailer binary.
          content:
            video/*:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/trailer/download:
    post:
      operationId: postEntityTrailerDownload
      summary: Downloads the item YouTube trailer via yt-dlp and materializes it on disk (briefing 0102, ADR-0025).
      description: >
        Resolves the trailer to download from `videos` (already extracted from
        TMDB/TVDB, SAME shape as GET /entities/{id}): with `key` in the body, the
        YouTube video with that exact key; without `key`, the first video
        `type=="Trailer" && site=="YouTube"` (richfields.PrimeiroTrailerYoutube,
        same criterion as the frontend "Watch trailer" button). Downloads via
        yt-dlp (foundation of briefing 0101) to a TEMPORARY file in the
        final destination and only renames it to the canonical name
        (`<video-name>-trailer.mp4` or `trailer.mp4` in a dedicated folder)
        on success — it never leaves a partial file under the canonical
        name. The download is SYNCHRONOUS in this delivery (the request stays
        pending until it finishes). **Never overwrites** a trailer already
        present (downloaded before OR placed manually by the owner) — 409
        without an explicit `force:true`.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/LangQuery"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrailerDownloadRequest" }
      responses:
        "200":
          description: Trailer downloaded and materialized successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrailerDownloadResult" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/historico:
    post:
      operationId: createHistoricoEvento
      summary: Records a consumption history event (briefing 0092, ADR-0022).
      description: >
        Creates a generic `historico_evento` (vertical-agnostic — movie,
        series and, in the future, music/book/game) linked to the entity. A missing
        `source` becomes `"manual"`; a missing `occurred_at` becomes the server
        timestamp at call time. 201 with the created event; 404 if the
        entity does not exist; 422 if `kind`/`status` come empty or
        `progress_percent` is outside `[0, 100]`.
      tags: [historico]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHistoricoEvento" }
      responses:
        "201":
          description: Event created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoricoEvento" }
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    get:
      operationId: listHistoricoEventos
      summary: Lists the consumption history of an entity (briefing 0092).
      description: >
        Events in reverse chronological order (`occurred_at DESC`). `?kind=`
        filters by a specific `kind` (e.g. `assistir`) when present.
        404 if the entity does not exist.
      tags: [historico]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: kind
          in: query
          description: "Filters by kind (e.g. assistir, ouvir). Absent = all."
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Event history (empty when there is none).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoricoEventoList" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/historico/estado:
    get:
      operationId: getHistoricoEstado
      summary: Current state derived from the history, per kind (briefing 0092).
      description: >
        One object per distinct `kind` already seen in the entity history, with the
        most recent event (highest `occurred_at`) of that `kind` —
        derived on every call, never kept as a redundant column
        (it never "lies" — see ADR-0022). Empty object (`{}`) when there is no
        history. 404 if the entity does not exist.
      tags: [historico]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Current state, per kind.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoricoEstado" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/historico/{eventoId}:
    delete:
      operationId: deleteHistoricoEvento
      summary: Removes a history event (briefing 0092).
      description: >
        Punctual correction by the owner (fat-finger, test) — the same logic already
        applied to removable custom `asset`/`credit`; it is not a mass purge
        (principle 5 of AGENTS.md remains intact). 204 on success; 404 if the
        entity or the event do not exist, or the event does not belong to the
        entity.
      tags: [historico]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/HistoricoEventoId"
      responses:
        "204":
          description: Event removed.
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/historico/orfaos:
    get:
      operationId: listHistoricoEventoOrfaos
      summary: Lists history events without a linked entity (briefing 0099).
      description: >
        Webhook events (e.g. Jellyfin) whose external IDs did not match
        any local entity at the moment they arrived, kept as
        "orphans" instead of discarded (principle 2 of AGENTS.md). GLOBAL
        route (outside /entities/{id}), since by definition an orphan event
        does not have an entity yet. It disappears from the list automatically when a
        retroactive backfill links the event (match correction/confirmation
        that makes the entity gain the same raw external ID). Paginated, in
        `occurred_at DESC` order.
      tags: [historico]
      parameters:
        - name: limit
          in: query
          description: Page size (default 50, max 200).
          required: false
          schema: { type: integer, minimum: 0, default: 50 }
        - name: offset
          in: query
          description: Page offset (default 0).
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Page of orphan events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoricoEventoOrfaoList" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/entities/purge:
    post:
      operationId: purgeEntities
      summary: Batch purge of entities (briefing 0018).
      description: >
        Explicit BATCH purge: purges each id in the body (ApagarEntity + CASCADE +
        best-effort cleanup of the binaries), ignoring missing ids (idempotent).
        It answers how many entities were actually removed. 422 invalid body.
      tags: [entities]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurgeBatchRequest" }
      responses:
        "200":
          description: Batch purge summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeBatchResult" }
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/library:
    get:
      operationId: listLibrary
      summary: Lists the datasources (with state re-evaluated on read).
      tags: [library]
      responses:
        "200":
          description: Source list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceList" }
    post:
      operationId: createLibrary
      summary: Registers a datasource.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSource" }
      responses:
        "201":
          description: Source created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/library/{id}:
    get:
      operationId: getLibrary
      summary: Gets a datasource.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchLibrary
      summary: Edits the configuration of a registered datasource (briefings 0064/0070).
      description: >
        PARTIAL patch: fields missing from the body stay unchanged; `path` and
        `watch_enabled` can come together or each one alone. Changing
        `watch_enabled` from `false` to `true` activates the `fsnotify` watcher
        of this source IMMEDIATELY (same registration routine used at server
        boot, without restarting anything); from `true` to `false` deactivates the
        watcher IMMEDIATELY (`Close()` + removal of the in-memory entry). Both
        directions are a behavioral guarantee of the contract: neither of them
        requires a server restart. Changing `path` (briefing 0070) re-points the
        datasource to a new path — it validates as on registration (exists, is a
        directory, readable, without duplicating another source) and cascades
        `media_file.path`, `asset.local_path` and `entity.nfo_path` of this source
        to the new prefix; it does NOT trigger a scan nor move bytes on disk. When
        both fields come together, `path` is applied first. A new path EQUAL to
        the current one is a no-op (200, nothing changes in the database).
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchSource" }
      responses:
        "200":
          description: Source updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteLibrary
      summary: Removes a datasource (does not purge entities).
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "204":
          description: Removed.
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/library/{id}/scan:
    get:
      operationId: getScanStatus
      summary: Progress of a datasource scan.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Job status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanStatus" }
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: startScan
      summary: Triggers a scan in the background.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "202":
          description: Scan accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartScan" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/library/browse:
    get:
      operationId: browseLibraryPath
      summary: Lists subdirectories of a path (folder browser).
      description: >
        Folder browser for the filesystem that the API process sees
        (briefing 0071) — used by the datasource registration/edition form to
        choose a `path` by clicking instead of typing it from
        scratch. A missing or empty `path` uses `/` as root. It lists ONLY
        subdirectories (loose files are omitted), sorted by `name`
        alphabetically (case-insensitive); symlinks are followed (`os.Stat`,
        not `os.Lstat`) to decide whether they count as a folder, since mounts via
        symlink are common. Each entry is opened for listing only
        to decide `readable`; an entry without permission appears with
        `readable:false` (the owner sees that the folder exists, but the front end disables
        the click on it) WITHOUT aborting the rest of the listing. Safety cap
        of **2000 entries**: if the directory has more, the response comes
        truncated (alphabetical order) with `truncated:true`. `parent` is the
        directory one level above the requested `path`, or `null` when `path` already
        is the filesystem root (`/`). Errors reuse `mapLibraryError`
        (same codes as `createLibrary`/`patchLibrary`): `422
        invalid_path` when the requested `path` itself does not exist or is not a
        directory; `422 path_unreadable` when the requested `path` itself cannot
        be opened for listing (different from an unreadable CHILD
        entry, which only marks `readable:false` without becoming an error).
      tags: [library]
      parameters:
        - name: path
          in: query
          required: false
          schema: { type: string }
          description: >
            Absolute path to list; missing or empty is equivalent to the root `/`.
      responses:
        "200":
          description: Directory listing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowseResult" }
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/jobs:
    get:
      operationId: listJobs
      summary: Lists the known jobs (briefing 0052).
      description: >
        All job_definition entries with the current state (enabled, schedule,
        last/next execution) + the in-memory `running` state of the Manager.
        Never empty after the foundation (it always has the `backup_vacuum` seed).
      tags: [jobs]
      responses:
        "200":
          description: Job list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/jobs/{id}:
    patch:
      operationId: patchJob
      summary: Edits the configuration of a job (enabled/schedule).
      description: >
        PARTIAL patch: fields missing from the body stay unchanged.
        An explicit `schedule_cron: null` clears the schedule (the job becomes
        manual-only). It recalculates `next_run_at`. `enabled` only governs the AUTOMATIC
        trigger — manual execution (POST .../run) works regardless
        of this flag.
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchJob" }
      responses:
        "200":
          description: Job updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/jobs/{id}/run:
    post:
      operationId: runJob
      summary: Triggers a manual run of the job.
      description: >
        Triggers in the background (trigger="manual"), regardless of `enabled`.
        409 if there is already a run in progress for this job; 503 if the job
        is seeded in the database but no Handler is registered in the binary
        (e.g. downgrade).
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: Execution accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunJob" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/jobs/{id}/executions:
    get:
      operationId: listJobExecutions
      summary: Paginated execution history of a job, most recent first.
      tags: [jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: limit
          in: query
          description: Page size (default 20, max 100).
          required: false
          schema: { type: integer, minimum: 0, default: 20 }
        - name: before
          in: query
          description: >
            Pagination cursor (the `started_at` of the last execution of the previous
            page); it pages backwards (older ones). Absent = first
            page.
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Execution page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobExecutionList" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/queue:
    get:
      operationId: getQueue
      summary: The whole execution queue (ADR-0040) — running, waiting and recently finished.
      description: >
        One request for the queue screen: the running item (with stage, current
        item, counters and elapsed time), the items waiting in FIFO order
        (with position and waiting time) and the last finished ones (with duration).
        It covers kind=scan and kind=job; `ref_label` brings the readable name of the
        reference and `current_label` the readable name of the item being processed
        (the entity title, when the run narrates only an id). Read-only.
      tags: [queue]
      parameters:
        - name: recent
          in: query
          description: How many finished items to bring (default 20).
          required: false
          schema: { type: integer, minimum: 0, default: 20 }
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueView" }
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/queue/{id}:
    get:
      operationId: getQueueItem
      summary: One queue item with the per-item trace (what each processed thing did).
      description: >
        The trace answers "which ones succeeded and which ones failed" after the
        run finished: one line per processed item (ok/error/skip).
      tags: [queue]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: events
          in: query
          description: How many trace events to bring (default 200).
          required: false
          schema: { type: integer, minimum: 0, default: 200 }
      responses:
        "200":
          description: Item and trace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueItemDetail" }
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/webhooks/jellyfin:
    post:
      operationId: receiveJellyfinWebhook
      summary: Receives the Jellyfin playback webhook (briefing 0093, ADR-0022).
      description: >
        Destination of the `jellyfin-plugin-webhook` plugin — JSON body whose shape
        varies by plugin version (`NotificationType`, `ItemType`,
        `Provider_tmdb`/`Provider_imdb`/`Provider_tvdb`,
        `PlaybackPositionTicks`, `RunTimeTicks`, `PlaybackPercentage`, among
        others), parsed best-effort — any field may be missing without
        bringing down the handler. It matches the item by the external IDs present in the
        payload; without a match, the event is discarded and logged (it never creates a
        new entity from a webhook). Authenticated by a query `token`,
        compared in constant time. It always answers `204` when the
        token matches — including an unrecognizable payload/without match, to avoid
        making Jellyfin retry; `401` when the `token` is missing or does not match.
      tags: [webhooks]
      parameters:
        - name: token
          in: query
          description: Webhook token (generated via POST .../webhooks/jellyfin/token).
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                Payload of jellyfin-plugin-webhook — free/variable shape by
                plugin version, parsed best-effort.
              additionalProperties: true
      responses:
        "204":
          description: >
            Accepted — event written, or discarded/logged without a match (same
            code to avoid a Jellyfin retry).
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/webhooks/jellyfin/token:
    post:
      operationId: regenerateJellyfinWebhookToken
      summary: Generates (or regenerates) the Jellyfin webhook token (briefing 0093).
      description: >
        Creates a new token and replaces the previous one (stored in
        `app_settings`, key `webhook_jellyfin_token`) — subsequent
        calls to the webhook with the old token stop working.
        Authenticated like any other internal API endpoint (it is the owner's
        panel operating, without its own token). 200 with the new token.
      tags: [webhooks]
      responses:
        "200":
          description: Token generated/regenerated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JellyfinWebhookToken" }
    get:
      operationId: getJellyfinWebhookToken
      summary: Returns the current Jellyfin webhook token (briefing 0093).
      description: >
        200 with the current token; 404 if no token has been generated yet (in that
        case the owner must call POST .../webhooks/jellyfin/token first).
      tags: [webhooks]
      responses:
        "200":
          description: Current token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JellyfinWebhookToken" }
        "404":
          $ref: "#/components/responses/Error"

components:
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      description: Entity id.
      schema: { type: string }
    SourceId:
      name: id
      in: path
      required: true
      description: Datasource id.
      schema: { type: string }
    JobId:
      name: id
      in: path
      required: true
      description: >
        Job id (briefing 0052) — stable slug (the Handler.Nome() key,
        e.g. "backup_vacuum"), not a uuid.
      schema: { type: string }
    AssetId:
      name: assetId
      in: path
      required: true
      description: Asset (artwork) id.
      schema: { type: string }
    HistoricoEventoId:
      name: eventoId
      in: path
      required: true
      description: Consumption history event id (briefing 0092).
      schema: { type: string }
    LangQuery:
      name: lang
      in: query
      required: false
      description: >
        Requested language (BCP-47/TMDB code, e.g. `pt-BR`). Absent = primary
        language from settings. Outside the allowed set → 400. In the list, it validates the
        contract; the cards serve the neutral title (per-language resolution belongs to the
        detail page).
      schema: { type: string }
    IntegrationSlug:
      name: slug
      in: path
      required: true
      description: >
        Stable integration slug (URL and registry key in
        `integration_config`, e.g. `"tmdb"` — briefing 0095).
      schema: { type: string }
  responses:
    Error:
      description: "Error in the standard envelope { error: { code, message } }."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable slug (not localized) for the client to branch on.
            message:
              type: string
              description: Human text (pt-BR).
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string }
        version: { type: string }
    SystemHealth:
      type: object
      description: >
        Snapshot of the GET /api/v1/health/system telemetry (briefing 0055):
        database + operational portrait + storage per source.
      required: [computed_at, database, usage, storage]
      properties:
        computed_at:
          type: string
          description: Instant (UTC) at which the snapshot was computed — equal across calls within the cache TTL (60s).
        database: { $ref: "#/components/schemas/DatabaseHealth" }
        usage: { $ref: "#/components/schemas/UsageCounts" }
        storage: { $ref: "#/components/schemas/StorageSnapshot" }
    DatabaseHealth:
      type: object
      description: >
        LOGICAL size of the main .sqlite file via PRAGMA
        page_count/page_size (does NOT add the -wal/-shm sidecars, a conscious
        decision of briefing 0055). schema_version is the SAME value as
        Health via GET /health (db.schema), re-exposed here for convenience.
      required: [size_bytes, page_count, page_size, schema_version]
      properties:
        size_bytes: { type: integer, description: "page_count * page_size." }
        page_count: { type: integer }
        page_size: { type: integer }
        schema_version: { type: integer }
    UsageCounts:
      type: object
      description: >
        Operational portrait: catalog counts + curation queues
        (0018/0053) + process uptime/memory/goroutines (rough
        thermometer, without profiling).
      required:
        [
          uptime_seconds,
          entities,
          media_files,
          library_sources,
          review_queue_size,
          orphans_count,
          job_executions_total,
          goroutines,
          mem_alloc_bytes,
        ]
      properties:
        uptime_seconds:
          type: integer
          description: How many seconds the process has been up.
        entities: { $ref: "#/components/schemas/EntitiesUsage" }
        media_files: { $ref: "#/components/schemas/MediaFilesUsage" }
        library_sources:
          type: integer
          description: "COUNT(*) of registered library_source entries."
        review_queue_size:
          type: integer
          description: Review queue size (same count as GET /review).
        orphans_count:
          type: integer
          description: Size of the orphan queue (same count as GET /orphans).
        job_executions_total:
          type: integer
          description: "COUNT(*) of job_execution (full history, all jobs)."
        goroutines:
          type: integer
          description: "runtime.NumGoroutine() at computation time."
        mem_alloc_bytes:
          type: integer
          description: "runtime.MemStats.Alloc (allocated heap) at computation time."
    EntitiesUsage:
      type: object
      description: >
        by_type only includes the types that OCCUR (missing key = zero, not an explicit
        `0`) — the contract does not fix a list of types that is already free in the
        schema (entity.type is TEXT without CHECK).
      required: [total, by_type]
      properties:
        total: { type: integer }
        by_type:
          type: object
          additionalProperties: { type: integer }
    MediaFilesUsage:
      type: object
      required: [total, present, missing]
      properties:
        total: { type: integer }
        present: { type: integer }
        missing: { type: integer }
    StorageSnapshot:
      type: object
      description: >
        Since briefing 0063, besides database and TRACKED media per source
        (`sources`), it separates the disk used by the tracked folders into
        managed media, internal app cache and unidentified —
        reusing the SAME sweep of the library health job
        (0053), without a dedicated disk scan.
      required: [sources, managed_media_bytes, app_cache_bytes, unmanaged_bytes]
      properties:
        sources:
          type: array
          items: { $ref: "#/components/schemas/SourceStorage" }
        managed_media_bytes:
          type: integer
          description: >
            Sum of indexed videos (media_file.size) + NFO/artwork files
            with a canonical name (briefing 0062, internal/localmedia/naming.go)
            inside the tracked folders. It reflects the last result of the library
            health job (0053), not an on-demand scan.
        app_cache_bytes:
          type: integer
          description: >
            Total size of the application internal cache (`assetsDir`) — artwork
            and sidecars downloaded that were not materialized in the real folder
            yet, or that live only in the cache (sources without local media).
        unmanaged_bytes:
          type: integer
          description: >
            Rest found inside the tracked folders that matches neither an
            indexed video nor a canonical-name NFO/artwork from 0062
            (samples, loose subtitles, junk from another tool). It does not include
            any action — this field only measures/displays (briefing 0063).
    SourceStorage:
      type: object
      description: >
        One row per registered library_source: how much TRACKED media
        (SUM(media_file.size), without scanning the filesystem again) it occupies and the
        free/total space of the filesystem that hosts `path`. `offline`/`error`
        mirror the avaliarState semantics already used in library.Listar (the
        path does not answer Statfs); `filesystem` is `null` when offline —
        without an invented number. An error in ONE source does not abort the others.
      required: [source_id, path, used_bytes, filesystem, offline]
      properties:
        source_id: { type: string }
        path: { type: string }
        used_bytes:
          type: integer
          description: SUM(media_file.size) with state=present for that source. It reflects the LAST SCAN, not the disk right now.
        filesystem:
          oneOf:
            - $ref: "#/components/schemas/FilesystemStats"
            - type: "null"
          description: "null when offline (Statfs failed)."
        offline: { type: boolean }
        error:
          type: string
          description: Raw Statfs error message (only present when offline).
    FilesystemStats:
      type: object
      required: [free_bytes, total_bytes]
      properties:
        free_bytes: { type: integer }
        total_bytes: { type: integer }
    FieldSchema:
      type: object
      description: >
        Field descriptors of the editorial form (briefing 0030), sorted by
        ascending `order`.
      required: [fields]
      properties:
        fields:
          type: array
          items: { $ref: "#/components/schemas/FieldDescriptor" }
    FieldDescriptor:
      type: object
      description: >
        Descriptor of ONE editable field: it combines the presentation (label/group/widget/
        order/range, on the server) with the public label of the resolver (translatable/kind).
      required:
        [name, label, group, widget, translatable, kind, order, creatable]
      properties:
        name:
          type: string
          description: Field key (= override/registry key).
        label:
          type: string
          description: pt-BR label (single-language UI today).
        group:
          type: string
          enum: [traduzivel, neutro]
          description: Form section.
        widget:
          type: string
          enum: [text, textarea, number, date, tags]
          description: Input render widget.
        translatable:
          type: boolean
          description: Whether the field composes per language (= registroOrigem[campo].traduzivel).
        kind:
          type: string
          enum: [escalar, lista, numero]
          description: Public composition class of the resolver (extensao stays out of the form).
        order:
          type: integer
          description: Stable render order.
        creatable:
          type: boolean
          description: Appears in the CREATE item form (flat subset).
        min:
          type: number
          description: Minimum (only for the number widget).
        max:
          type: number
          description: Maximum (only for the number widget).
        step:
          type: number
          description: Step (only for the number widget).
        placeholder:
          type: [string, "null"]
          description: Optional input placeholder.
    ReviewGroup:
      type: object
      description: >
        Group of review queue items (briefing 0137). The key is the path
        (relative to the library root) already without the disc/season segment; the
        label is what the UI shows in the section header.
      required: [kind, key, label, size]
      properties:
        kind:
          type: string
          enum: [album, serie, pasta]
          description: >
            File context: `album` (type=faixa), `serie` (type=episode) and
            `pasta` (any other type with a file). Every item of the queue has a
            file: an entity the provider publishes and the library does not have is
            a hole in the collection, not a review decision.
        key:
          type: string
          description: Stable group key (used to group in the frontend).
        label:
          type: string
          description: 'Readable label — e.g. "Duran Duran — Notorious (Deluxe Edition)".'
        size:
          type: integer
          format: int64
          description: How many queue items are in this group.

    EntityCard:
      type: object
      required:
        [
          id,
          type,
          title,
          status,
          owned,
          file_count,
          match_confidence,
          poster_url,
          catalog_completeness,
        ]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [movie, tv, collection, season, episode, album, artista, faixa]
          description: >
            Canonical type of the entity. `season`/`episode` (0031) compose the series
            tree: GET /members of a `tv` brings the `season`s; of a `season`, the
            `episode`s (sorted by sort_index). `album`/`artista`/`faixa`
            (0105-0107) are the music vertical -- names in Portuguese in the schema,
            not `artist`/`track`.
        title: { type: string }
        status: { type: string }
        owned:
          type: boolean
          description: Derived ownership (EXISTS media_file present).
        file_count:
          type: integer
          format: int64
        match_confidence:
          type: [number, "null"]
          description: Highest match confidence among the files (review badge).
        poster_url:
          type: [string, "null"]
          description: Local poster route, or null when there is no artwork.
        ownership:
          description: >
            AGGREGATED ownership of the card in the series tree (0036): owned episodes
            over the total. OPTIONAL — present only in the `season` cards (and optionally
            `tv`) of GET /entities/{id}/members; absent/`null` for movie/episode/
            collection (which use the simple ownership of `owned`). Annotated on the server
            after listing, without changing the card query.
          oneOf:
            - $ref: "#/components/schemas/OwnershipInfo"
            - type: "null"
        review_group:
          description: >
            Review queue group (briefing 0137): the context of the FILE that
            explains why the item is here — album (tracks, ignoring
            `Disc N`), series (episodes, ignoring `Season N`) or folder (movie).
            Annotated on the server, from the `media_file.path` made relative against
            the library root; it does NOT come from the card query. `omitempty`: present
            only in GET /api/v1/review.
          oneOf:
            - $ref: "#/components/schemas/ReviewGroup"
            - type: "null"
        numbering:
          description: >
            REAL numbering of the episode (0039): `season`/`number` projected in the
            ordering of the parent season and the `absolute_number` when present. It reflects the
            CATALOGED number (S02E05), not the position in the list — a library with E01+E05
            shows E01 and E05. OPTIONAL: present only in the `episode` cards of
            GET /entities/{id}/members; absent/`null` for the other types and for an
            episode without numbering (draft), which falls back to the neutral label. Annotated on the server
            after listing, without changing the card query.
          oneOf:
            - $ref: "#/components/schemas/EpisodeNumbering"
            - type: "null"
        still_url:
          type: [string, "null"]
          description: >
            RAW URL of the episode still (16:9 frame) (0042), as it came from the provider —
            language-NEUTRAL artwork, stored at import WITHOUT downloading the image. OPTIONAL:
            present only in `episode` cards with a still; absent/`null` for the other
            types and for an episode without a still (falls back to the placeholder). The front end serves it through the
            image proxy (GET /images?src=), which fetches+caches on demand at first display.
        catalog_completeness:
          description: >
            Catalog completeness of the item (0058) against the ruler configured
            in /settings (0057). `null` when the item is a draft (never matched) OR
            when it has not gone through the first run of the `saude_biblioteca`
            job that fills the cache yet (0053) — this field is read
            from a persisted cache, recomputed in batch, so it can become
            outdated with respect to the config until the next run of the job
            (unlike `ResolvedEntity.catalog_completeness`, computed live
            on every request).
          oneOf:
            - $ref: "#/components/schemas/CatalogCompletenessResult"
            - type: "null"
    CatalogCompletenessResult:
      type: object
      description: >
        Result of the CATALOG completeness evaluation (0058) of an item
        against the per-type ruler configured in 0057 — distinct from the
        OWNERSHIP completeness (`EntityCard.owned`/`OwnershipInfo`). Reused in
        `EntityCard.catalog_completeness` and `ResolvedEntity.catalog_completeness`.
      required: [complete, missing]
      properties:
        complete:
          type: boolean
          description: true when the item satisfies the whole ruler, or when the type has no entry in the config (a type without a ruler is never incomplete).
        missing:
          type: array
          description: >
            STABLE keys of what is missing, in a fixed order (description, runtime,
            certification, keywords, cast, media_file, artwork:<kind>...).
            Free string (it is not a closed enum here): the possible values
            today are `description`, `runtime`, `certification`, `keywords`,
            `cast`, `media_file`, or `artwork:<kind>` (one item per artwork kind
            ABSENT from the configured list, e.g. `artwork:poster`,
            `artwork:fanart`). `[]` when `complete` is true.
          items: { type: string }
    EpisodeNumbering:
      type: object
      description: >
        Numbering of an episode in the ordering of the parent season (0039). `season`/`number`
        come from the multi-order numbering stored at import (core.tv@1); `absolute_number` is the
        continuous number across seasons (anime), present when the source reported it.
      required: [season, number]
      properties:
        season: { type: integer }
        number: { type: integer }
        absolute_number:
          type: integer
          description: Absolute (continuous) number, when available.
        merged_episodes:
          type: integer
          description: >
            Present and > 1 when this number is SHARED by several episodes because the
            OWNER ORDER declares a unit that merges them (ADR-0033). No provider order
            produces this.
        merged_ordinal:
          type: integer
          description: Position (1-based) of this episode inside the merged unit.
    OwnerOrder:
      type: object
      description: >
        Owner order (ADR-0033): the numbering declared by the owner, anchored in episode
        IDS (never in numbers) to survive a re-scrape. An empty `units` means
        "not declared".
      required: [units]
      properties:
        name:
          type: string
          description: Free label of the order (e.g. "HBO 2004").
        based_on:
          type: string
          description: Provider ordering it is based on, for comparison (e.g. official).
        units:
          type: array
          items: { $ref: "#/components/schemas/OwnerOrderUnit" }
    OwnerOrderUnit:
      type: object
      description: >
        A numbered unit of the owner order. `episodes` has 1..N episodes and the ORDER
        matters: it is the `ordinal` of the file↔episode link.
      required: [season, number, episodes]
      properties:
        season: { type: integer, minimum: 0 }
        number: { type: integer, minimum: 1 }
        title:
          type: string
          description: Free title of the unit (optional).
        episodes:
          type: array
          minItems: 1
          items: { type: string }
          description: Ids of the unit episodes, in release order.
    EntityList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EntityCard" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    EntityType:
      type: object
      description: >
        An entity `type` with at least 1 CATALOGED item (status != draft,
        briefing 0109/0110) and the corresponding count. No fixed list of
        types — it covers album/artista/faixa (0105-0107) together with movie/tv.
      required: [type, count]
      properties:
        type: { type: string }
        count: { type: integer, format: int64 }
    ExternalResult:
      type: object
      description: >
        Result of an EXTERNAL source (e.g. TMDB). saved is always false: it is never
        a catalog entity until the explicit import (briefing 0015).
      required:
        [source, source_id, type, title, year, overview, poster_url, saved]
      properties:
        source:
          type: string
          description: "Source name (e.g. tmdb)."
        source_id:
          type: string
          description: Item id AT THE SOURCE.
        type: { type: string }
        title: { type: string }
        year: { type: [string, "null"] }
        overview: { type: [string, "null"] }
        poster_url:
          type: [string, "null"]
          description: Direct URL of the artwork at the source (the proxy/cache belongs to 0015).
        saved:
          type: boolean
          description: Always false in search (an external result is not an entity).
        internal_id:
          type: [string, "null"]
          description: >
            Id of the internal entity when this external result has ALREADY been imported
            (internal-first, 0027); null otherwise. The UI shows "in the library"
            and links to the internal one instead of reimporting.
    SearchResult:
      type: object
      required: [query, local, external, external_available]
      properties:
        query: { type: string }
        local:
          type: array
          description: Catalog cards (same shape as the list).
          items: { $ref: "#/components/schemas/EntityCard" }
        external:
          type: array
          description: Results not saved from the external source (empty when unavailable).
          items: { $ref: "#/components/schemas/ExternalResult" }
        external_available:
          type: boolean
          description: >
            false when there is no credential/provider or the source failed — it distinguishes
            "source unavailable" from "zero results".
    Asset:
      type: object
      description: >
        One entity artwork (briefing 0017). origin distinguishes the provenance: `user`
        (owner upload), `external` (re-pullable enrichment cache) or `local`
        (scanner artwork). preferred is the owner flag (one per (entity, kind), read
        from meta_json — compat). Since briefing 0062, `is_principal` (its own
        column) is the SOURCE OF TRUTH of which asset is the main one of its
        `(entity, kind)`, and `local_path` marks whether the asset was also materialized
        physically in the real library folder (distinct from the cache in
        `assetsDir`, which is where the binary always lives). url is the route that serves the
        binary.
      required: [id, kind, origin, preferred, is_principal, url]
      properties:
        id: { type: string }
        kind:
          type: string
          description: "Artwork kind (e.g. poster, fanart)."
        origin:
          type: string
          description: "Provenance (user, external, local)."
        preferred:
          type: boolean
          description: Marked as preferred of its kind (read from meta_json).
        is_principal:
          type: boolean
          description: >
            Briefing 0062: source of truth of "main" for its `(entity, kind)`
            — at most one `true` per pair, applied in code (no FK/trigger).
            When marking a new main one via PUT .../prefer, the previous one of the same
            pair becomes `false` in the same transaction.
        local_path:
          type: [string, "null"]
          description: >
            Briefing 0062: absolute path of the file materialized in the REAL library
            folder, with the canonical Kodi/Emby name (see naming.go). `null`
            when the asset has not been saved there yet — it exists only in the internal cache
            (`assetsDir`/`path_or_uri`). Filled by
            POST .../assets/{assetId}/materialize or by PUT .../prefer (which
            materializes before rotating, if needed).
        url:
          type: string
          description: Route that serves the binary of this asset.
    AssetList:
      type: array
      description: Artwork gallery of the entity (empty when there is no artwork).
      items: { $ref: "#/components/schemas/Asset" }
    CreateHistoricoEvento:
      type: object
      description: >
        Body of POST .../historico (briefing 0092). `kind`/`status` are free
        TEXT (e.g. kind="assistir", status="started"|"paused"|"stopped"|
        "completed") — suggested vocabulary, not locked in the schema.
      required: [kind, status]
      properties:
        kind:
          type: string
          description: "Event type (e.g. assistir, ouvir, jogar). Non-empty."
        status:
          type: string
          description: "Event status (e.g. started, paused, stopped, completed). Non-empty."
        progress_percent:
          type: [number, "null"]
          description: "Progress in [0, 100]. Outside the range → 422."
        position_seconds:
          type: [number, "null"]
          description: Playback position in seconds, when applicable.
        occurred_at:
          type: string
          description: >
            Event instant (RFC3339). Absent → server timestamp at
            call time.
        source:
          type: string
          description: 'Event provenance (e.g. manual, jellyfin-webhook). Absent → "manual".'
        payload:
          type: [object, "null"]
          description: "Optional raw payload (e.g. the original webhook body), stored as is."
    HistoricoEvento:
      type: object
      description: A consumption history event (briefing 0092, ADR-0022).
      required: [id, kind, status, occurred_at, source, created_at]
      properties:
        id: { type: string }
        kind: { type: string }
        status: { type: string }
        progress_percent: { type: [number, "null"] }
        position_seconds: { type: [number, "null"] }
        occurred_at: { type: string }
        source: { type: string }
        payload: { type: [object, "null"] }
        created_at: { type: string }
    HistoricoEventoList:
      type: object
      description: Response of GET .../historico — events in occurred_at DESC order.
      required: [eventos]
      properties:
        eventos:
          type: array
          items: { $ref: "#/components/schemas/HistoricoEvento" }
    HistoricoEstadoItem:
      type: object
      description: >
        Projection of the most recent event of one `kind` (briefing 0092) — without
        `id`/`payload`, only the summary used by the UI.
      required: [status, occurred_at, source]
      properties:
        status: { type: string }
        progress_percent: { type: [number, "null"] }
        position_seconds: { type: [number, "null"] }
        occurred_at: { type: string }
        source: { type: string }
    HistoricoEstado:
      type: object
      description: >
        Response of GET .../historico/estado — one `HistoricoEstadoItem` per
        distinct `kind` already seen in the entity history (key = kind).
        Empty object when there is no history.
      required: [estado]
      properties:
        estado:
          type: object
          additionalProperties:
            { $ref: "#/components/schemas/HistoricoEstadoItem" }
    HistoricoEventoOrfao:
      type: object
      description: >
        History event without a linked entity (briefing 0099). It keeps the
        external IDs and RAW title/year from the original payload (not resolved
        against the catalog) — used to locate backfill candidates
        when an entity gains that ID in the future; they remain filled
        even after eventually linked.
      required: [id, kind, status, occurred_at, source, raw_external_ids]
      properties:
        id: { type: string }
        kind: { type: string }
        status: { type: string }
        progress_percent: { type: [number, "null"] }
        position_seconds: { type: [number, "null"] }
        occurred_at: { type: string }
        source: { type: string }
        raw_title: { type: [string, "null"] }
        raw_year: { type: [string, "null"] }
        raw_external_ids:
          type: object
          description: Raw external IDs of the payload, per source. Absent means the event did not report them.
          properties:
            tmdb: { type: string }
            imdb: { type: string }
            tvdb: { type: string }
    HistoricoEventoOrfaoList:
      type: object
      description: Response of GET /historico/orfaos, same pagination envelope as GET /entities.
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HistoricoEventoOrfao" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    JellyfinWebhookToken:
      type: object
      description: Response of GET/POST .../webhooks/jellyfin/token (briefing 0093).
      required: [token]
      properties:
        token: { type: string }
    ArtworkItem:
      type: object
      description: >
        One artwork in the /artwork per-kind grouping (briefing 0048). `url` already comes
        proxied. `lang`/`likes` come from the inventory (fanart.tv) and are empty/zero for the
        other sources. `source` is the provenance (`user`|`external`|`tmdb`|`fanarttv`);
        `is_local` marks the materialized asset (served from disk, internal cache),
        `is_preferred` the owner choice (compat, read from meta_json). `disc_type`/`disc`/
        `season` only appear in the artwork that has them. Since briefing 0062, `is_local_in_library`
        and `is_principal` distinguish the physical materialization in the REAL library folder
        (only possible when `is_local=true`; always `false` for inventory/external URL
        artwork). The ORDERING of each per-kind array is `is_principal` desc,
        `is_local_in_library` desc, original order preserved asc.
      required:
        [url, source, is_preferred, is_local, is_local_in_library, is_principal]
      properties:
        url:
          type: string
          description: URL already passed through the image proxy.
        lang:
          type: string
          description: "Artwork language (2 letters or empty=textless); only in the inventory."
        likes:
          type: integer
          description: "Likes at the source; only in the inventory (fanart.tv)."
        source:
          type: string
          description: "Provenance: user, external, tmdb or fanarttv."
        disc_type:
          type: string
          description: "Disc type (bluray/dvd/cd/3d); only in the disc kind."
        disc:
          type: integer
          description: "Disc number; only in the disc kind."
        season:
          type: string
          description: Season of the artwork (a number, all or 0); only on season artwork.
        is_preferred:
          type: boolean
          description: Owner choice (only for a local asset).
        is_local:
          type: boolean
          description: Materialized asset, served from disk.
        is_local_in_library:
          type: boolean
          description: >
            Briefing 0062: `true` when the materialized asset (`is_local=true`)
            was also saved physically in the REAL library folder
            (`asset.local_path != null`) — it mirrors the "Saved to folder" badge of the
            gallery. Always `false` for inventory/external URL artwork
            (`is_local=false`).
        is_principal:
          type: boolean
          description: >
            Briefing 0062: `true` when this is the `is_principal=1` asset of its
            `(entity, kind)` (source of truth in its own column, distinct from
            `is_preferred`/meta_json). At most one `true` per kind. Always
            `false` for inventory/external URL artwork.
        asset_id:
          type: string
          description: >
            Id of the materialized asset (only when `is_local`): use it in
            PUT /entities/{id}/assets/{assetId}/prefer and DELETE .../assets/{assetId}.
        src_url:
          type: string
          description: >
            RAW URL at the source (only for inventory artwork, `is_local=false`): send it in
            POST /entities/{id}/artwork/select to download/prefer.
    ArtworkResponse:
      type: object
      description: >
        AVAILABLE artwork grouped by kind (briefing 0048): one ArtworkItem array per
        kind (poster/fanart/logo/clearart/disc/banner/thumb/characterart/still) plus
        `available: {kind: count}` for the card badges. The kind keys and the
        `available` key coexist at the top level (no kind is named `available`).
      properties:
        poster:
          { type: array, items: { $ref: "#/components/schemas/ArtworkItem" } }
        fanart:
          { type: array, items: { $ref: "#/components/schemas/ArtworkItem" } }
        logo:
          { type: array, items: { $ref: "#/components/schemas/ArtworkItem" } }
        clearart:
          { type: array, items: { $ref: "#/components/schemas/ArtworkItem" } }
        disc:
          { type: array, items: { $ref: "#/components/schemas/ArtworkItem" } }
        banner:
          { type: array, items: { $ref: "#/components/schemas/ArtworkItem" } }
        thumb:
          { type: array, items: { $ref: "#/components/schemas/ArtworkItem" } }
        characterart:
          { type: array, items: { $ref: "#/components/schemas/ArtworkItem" } }
        still:
          { type: array, items: { $ref: "#/components/schemas/ArtworkItem" } }
        available:
          type: object
          description: "Artwork count per kind (for the badges)."
          additionalProperties: { type: integer }
    SelectArtworkRequest:
      type: object
      description: >
        Body of POST /entities/{id}/artwork/select: which inventory artwork (url on a
        proxy allowlist host) to materialize as an `origin='external'` asset of the `kind`,
        and whether it should be marked as preferred.
      required: [kind, url]
      properties:
        kind:
          type: string
          enum:
            [
              poster,
              fanart,
              still,
              logo,
              clearart,
              disc,
              banner,
              thumb,
              characterart,
            ]
          description: Artwork kind to materialize.
        url:
          type: string
          description: Artwork URL (host must be in the proxy allowlist — anti-SSRF).
        prefer:
          type: boolean
          description: "Marks the artwork as preferred of its kind (default: false)."
    EnrichRequest:
      type: object
      description: >
        OPTIONAL body of POST /entities/{id}/enrich. Without source it uses "tmdb"; without
        source_id it uses the entity's external_ids[source].
      properties:
        source:
          type: string
          description: "Source to query (default tmdb)."
        source_id:
          type: string
          description: Item id AT THE SOURCE; if absent, it uses external_ids[source].
        force:
          type: boolean
          default: false
          description: >
            When true, it ignores the 24h cache of the external detail
            (`external_detail`) and always fetches the most recent version from the
            provider (briefing 0088). Default false preserves the
            existing cache behavior.
    ImportRequest:
      type: object
      description: Body of POST /import — the external item to import.
      required: [source_id, type]
      properties:
        source:
          type: string
          description: "Source (default tmdb)."
        source_id:
          type: string
          description: Item id AT THE SOURCE (required).
        type:
          type: string
          enum: [movie, tv, collection, artista, faixa]
          description: >
            Canonical item type (required). `collection` (0025) imports the whole
            collection: it creates the `type='collection'` entity and imports/links the member movies.
            `artista` (0106) imports the whole discography (albums + tracks). `faixa`
            (briefing 0115 Part 2) imports ONE standalone track missing from an album already
            internal -- it requires `parent_id`.
        parent_id:
          type: string
          description: >-
            INTERNAL id of the parent album to link (entity_relation kind=music_album) --
            required when type=faixa; ignored in the other types.
    CreateCollection:
      type: object
      description: >
        Body of POST /collections (0025 Phase B) — creates a manual LOCAL collection.
        Only the title is required; the description is optional.
      required: [title]
      properties:
        title:
          type: string
          description: Collection name (required, cannot be empty).
        description:
          type: string
          description: Free-form collection description (optional).
    AddMember:
      type: object
      description: >
        Body of POST /entities/{id}/members (0025 Phase B) — the item to link to the collection.
      required: [child_id]
      properties:
        child_id:
          type: string
          description: Id of the entity (movie/series) to include as a member.
    CreateItem:
      type: object
      description: >
        Body of POST /entities (0027) — creates a manual LOCAL ITEM (movie|tv) WITHOUT an
        external source. type and title are required; the other base fields are optional.
      required: [type, title]
      properties:
        type:
          type: string
          enum: [movie, tv]
          description: Item type (movie or tv; a collection uses POST /collections).
        title:
          type: string
          description: Item title (required, cannot be empty).
        original_title:
          type: string
          description: "Original title (optional)."
        description:
          type: string
          description: "Synopsis (optional)."
        release_date:
          type: string
          description: "ISO release date, e.g. 1999-03-31 (optional)."
    UpdateExternalIds:
      type: object
      description: >
        Body of PUT /entities/{id}/external-ids (0027) — the COMPLETE map of external
        identities (source -> id at the source). It replaces the whole map; an empty value
        removes that source. It does NOT re-enrich (it only pins the identity, for future sync).
      required: [external_ids]
      properties:
        external_ids:
          type: object
          additionalProperties: { type: string }
          description: 'Map source->id, e.g. {"tmdb": "603", "imdb": "tt0133093"}.'
    CorrectRequest:
      type: object
      description: >
        Body of POST /entities/{id}/correct — the correct identity that the owner
        provides. source default "tmdb"; source_id required.
      required: [source_id]
      properties:
        source:
          type: string
          description: "Source (default tmdb)."
        source_id:
          type: string
          description: Correct item id AT THE SOURCE (required).
    PurgeBatchRequest:
      type: object
      description: Body of POST /entities/purge — the ids to purge in batch.
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string }
          description: Ids of the entities to purge (missing ids are ignored).
    PurgeResult:
      type: object
      description: Result of the individual purge (DELETE /entities/{id}).
      required: [purged]
      properties:
        purged:
          type: boolean
          description: Always true when the entity existed and was purged.
    PurgeBatchResult:
      type: object
      description: Result of the batch purge (POST /entities/purge).
      required: [removed]
      properties:
        removed:
          type: integer
          description: How many entities were actually removed (idempotent per missing one).
    AutoMatchTarget:
      type: object
      description: >
        The candidate applied by the auto-match (briefing 0050) — local or
        external. `id` is the id of the RESULTING entity: in the `local` method, the id of the
        already cataloged SURVIVING entity (the queue entity was merged into it and
        ceased to exist); in the `external` method, the id of the queue entity
        itself (the identity was applied to it, without changing the id).
      required: [id, title, year]
      properties:
        id: { type: string }
        title: { type: string }
        year:
          type: [integer, "null"]
          description: Year of the applied candidate; null when the source does not report it.
    AutoMatchResult:
      type: object
      description: >
        Response of POST /entities/{id}/auto-match. `target` is null when
        `resolved` is false (no candidate reached `LimiarAutoMatch`).
      required: [resolved, method, score, target]
      properties:
        resolved:
          type: boolean
          description: true when a candidate was applied automatically.
        method:
          type: string
          enum: [local, external, none]
          description: >
            How it was resolved — `local` (merged into an already cataloged entity),
            `external` (identity applied via external source) or `none`
            (no candidate reached the threshold; the item stays in the queue).
        score:
          type: number
          description: Score of the best candidate (0-100); 0 when method=none.
        target:
          description: The applied candidate; null when method=none.
          oneOf:
            - $ref: "#/components/schemas/AutoMatchTarget"
            - type: "null"
    AutoMatchBatchRequest:
      type: object
      description: >
        OPTIONAL body of POST /review/auto-match — the ids to process.
        Omitted or with empty/missing `ids` it processes ALL eligible items of the review
        queue (ListarRevisao, same source as GET /review).
      properties:
        ids:
          type: array
          items: { type: string }
          description: Ids of the entities to process; empty/missing = all eligible ones.
    AutoMatchBatchItem:
      type: object
      description: Auto-match result of ONE batch item.
      required: [id, resolved, method, score]
      properties:
        id: { type: string }
        resolved: { type: boolean }
        method:
          type: string
          enum: [local, external, none]
        score: { type: number }
    AutoMatchBatchResult:
      type: object
      description: Response of POST /review/auto-match — the aggregated summary of the batch.
      required: [resolved_count, pending_count, items]
      properties:
        resolved_count:
          type: integer
          description: How many items were resolved automatically.
        pending_count:
          type: integer
          description: How many items remain in the queue (no candidate reached the threshold).
        items:
          type: array
          items: { $ref: "#/components/schemas/AutoMatchBatchItem" }
    MatchPreviewTarget:
      type: object
      description: >
        The candidate shown by the match preview (briefing 0060) — local or
        external, without applying anything. When it came from the local catalog, `local_id`
        is the id of the already cataloged entity and `source`/`source_id` are null;
        when it came from the external source, `local_id` is null and `source`/
        `source_id` come filled. `poster_url`: for local, the proxy route of the
        entity itself (same as `EntityCard.poster_url`); for
        external, the RAW URL from the provider (the front end routes it via `arteSrc`).
      required: [title, year, poster_url, local_id, source, source_id]
      properties:
        title: { type: string }
        year:
          type: [integer, "null"]
          description: Year of the candidate; null when the source does not report it.
        poster_url: { type: [string, "null"] }
        local_id:
          type: [string, "null"]
          description: Id of the local candidate entity; null when method=external.
        source:
          type: [string, "null"]
          description: External source of the candidate; null when method=local.
        source_id:
          type: [string, "null"]
          description: Id at the external source; null when method=local.
        matched_title:
          type: string
          description: >
            Title (main or alternative/translated) that effectively
            produced the score shown (briefing 0084). Absent when the
            candidate is local or when the winning title is the candidate
            main title itself.
    MatchPreview:
      type: object
      description: >
        Response of GET /entities/{id}/match-preview (briefing 0060) —
        dry-run, read-only, WITHOUT side effect. It returns the HIGHEST-score
        candidate among local and external, even below `LimiarAutoMatch`
        (it reuses the same search+scoring of the auto-match/0050, without the
        threshold cut). `target` is null when `found` is false.
      required: [found, method, score, meets_auto_threshold, target]
      properties:
        found:
          type: boolean
          description: true when some candidate was found (local or external).
        method:
          type: string
          enum: [local, external, none]
          description: >
            Where the candidate came from — `local` (existing catalog),
            `external` (default external source) or `none` (no candidate
            found in any source).
        score:
          type: number
          description: Score of the best candidate (0-100); 0 when method=none.
        meets_auto_threshold:
          type: boolean
          description: >
            true when that score would reach the `LimiarAutoMatch` (92) of the
            auto-match (0050) — purely informative here, it does NOT filter the
            preview result nor block `confirm-candidate`.
        target:
          description: The candidate found; null when found=false.
          oneOf:
            - $ref: "#/components/schemas/MatchPreviewTarget"
            - type: "null"
    ConfirmCandidateBody:
      type: object
      description: >
        Body of POST /entities/{id}/confirm-candidate (briefing 0060) —
        applies the candidate shown by the preview, WITHOUT checking
        `LimiarAutoMatch`. Two formats according to `method`: `local` requires
        `local_id`; `external` requires `source` and `source_id`. A body that does not
        match the `method` (missing required field) answers 422.
      required: [method]
      properties:
        method:
          type: string
          enum: [local, external]
        local_id:
          type: string
          description: Id of the local candidate entity (required when method=local).
        source:
          type: string
          description: External source of the candidate (required when method=external).
        source_id:
          type: string
          description: Id at the external source (required when method=external).
    EnrichMissingResult:
      type: object
      description: >
        Response of POST /entities/{id}/enrich-missing (briefing 0059) —
        it mirrors the `resultado` of `tentarEnriquecerOuSinalizar` (0056),
        reused as the public DTO of this endpoint. `method`/`score`
        present only when `outcome=="applied"`; `score` also present in
        `outcome=="flagged"` (without `method`); neither of the two in
        `outcome=="none"`.
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [applied, flagged, none]
          description: >
            `applied` (strong candidate applied by itself), `flagged`
            (plausible candidate, item signaled to the Review queue) or
            `none` (no candidate found in any source).
        method:
          type: string
          enum: [local, external]
          description: >
            How the candidate was applied — present only when
            `outcome=="applied"`.
        score:
          type: number
          description: >
            Candidate score (0-100) — present when `outcome` is
            `applied` or `flagged`; absent when `none`.
    DownloadMissingArtworkResult:
      type: object
      description: >
        Response of POST /entities/{id}/download-missing-artwork (briefing
        0059). `downloaded` are the kinds (`poster`, `fanart`, ...) that
        gained a new asset; `unavailable` are the kinds that were in
        `catalog_completeness.missing` (`artwork:<kind>`) but had
        NO option available in any provider now. A kind that already
        had an asset (race with a concurrent manual upload) does not appear in
        either list. Both `[]` when the item is already complete or
        is a draft (without `catalog_completeness`).
      required: [downloaded, unavailable]
      properties:
        downloaded:
          type: array
          items: { type: string }
          description: Artwork kinds that gained a new asset in this call.
        unavailable:
          type: array
          items: { type: string }
          description: Kinds that were missing but had no option in any provider.
    ForceReconcileResult:
      type: object
      description: >
        Response of POST /entities/{id}/force-reconcile (briefing 0122) —
        `linked=true` when the entity was re-linked against the parent in this
        call; `linked=false` when there was no candidate, the type is not
        applicable (neither `faixa` nor `tv`) or there is no scanner configured.
      required: [linked]
      properties:
        linked:
          type: boolean
          description: Whether the entity was re-linked against the parent in this call.
    RefreshFilesResult:
      type: object
      description: >
        Response of POST /entities/{id}/refresh-files (briefing 0088) —
        informative summary of what was rechecked/found/filled
        in this call; loose format (it is not a strict contract for another
        integration to consume, only feedback for the owner in the UI).
      required: [files_rechecked, assets_found, playback_fields_filled]
      properties:
        files_rechecked:
          type: integer
          description: How many entity `media_file` entries had re-hash/mediainfo forced.
        assets_found:
          type: integer
          description: >
            How many `origin='local'` assets were created/updated
            from file(s) found in the folder.
        playback_fields_filled:
          type: array
          items: { type: string }
          description: >
            Names of the local playback fields (`watched`, `play_count`,
            `user_rating`, `last_played_at`, `resume_position_seconds`,
            `resume_total_seconds`) that were empty and were filled
            from the `.nfo` in this call. Empty if there was no `.nfo`, or if
            all fields already had a value.
    AudioTagsWriteResult:
      type: object
      description: >
        Response of POST /entities/{id}/audio-tags/write (briefing 0125) —
        informative summary, same loose spirit as RefreshFilesResult
        (the format is not a strict contract for another integration to consume, only
        feedback for the owner in the UI). PARTIAL success is the normal case of an
        album cascade (a track without a file/with an unreadable tag does not block
        the others).
      required: [faixas_regravadas, falhas]
      properties:
        faixas_regravadas:
          type: integer
          description: How many tracks had the tag rewritten successfully in this call.
        falhas:
          type: array
          items: { type: string }
          description: >
            One entry per track that failed ("trackID: reason"). Empty
            when all tracks were rewritten successfully (or when `id`
            was a standalone `faixa` that was rewritten).
    MaterializeMissingMediaResult:
      type: object
      description: >
        Response of POST /entities/{id}/materialize-missing-media (briefing
        0088) — it mirrors the return of `MaterializarMidiasFaltantes` (the same one
        used internally by the `midias_faltantes` job, briefing 0064),
        reused as the public DTO of this endpoint.
      required: [artes_baixadas, nfo_gravado]
      properties:
        artes_baixadas:
          type: array
          items: { type: string }
          description: >
            Artwork kinds (`poster`, `fanart`, ...) materialized in the real
            folder in this call.
        nfo_gravado:
          type: boolean
          description: Whether the entity `.nfo` was written in this call (it was absent).
    NfoWriteResult:
      type: object
      description: >
        Response of POST /entities/{id}/nfo (briefing 0062) — it mirrors the two
        new `entity` columns that the write updates. `nfo_path` is the absolute
        path of the `.nfo` written (`<video>.nfo` for movie/episode, `tvshow.nfo`
        at the root of the series folder); `nfo_written_at` is the ISO timestamp of this
        write (it changes on every call, even when idempotent in content).
      required: [nfo_path, nfo_written_at]
      properties:
        nfo_path:
          type: string
          description: Absolute path of the .nfo written in the real library folder.
        nfo_written_at:
          type: string
          description: ISO timestamp of the last write (entity.nfo_written_at).
    TrailerDownloadRequest:
      type: object
      description: >
        (Optional) body of POST /entities/{id}/trailer/download (briefing
        0102, ADR-0025). A missing/empty body uses both defaults.
      properties:
        key:
          type: string
          description: >
            YouTube key of the video to download (it selects a SPECIFIC video
            from `videos`). Absent/empty: it downloads the first
            `type=="Trailer" && site=="YouTube"` (same criterion as the frontend
            "Watch trailer" button).
        force:
          type: boolean
          description: >
            `true` requests a RE-DOWNLOAD even with a trailer already materialized
            (downloaded before OR placed manually by the owner) — it overwrites.
            Default `false`: a trailer already present is never overwritten
            (principle 5, non-destructive), answering 409.
    TrailerDownloadResult:
      type: object
      description: >
        Success response of POST /entities/{id}/trailer/download
        (briefing 0102).
      required: [local_path]
      properties:
        local_path:
          type: string
          description: Absolute path of the trailer written in the real library folder.
    ThemeCandidatoResult:
      type: object
      description: >
        Response of GET /entities/{id}/theme/candidato (briefing 0103,
        ADR-0025).
      required: [disponivel, ja_tem_local]
      properties:
        disponivel:
          type: boolean
          description: >
            There is a ThemerrDB theme song candidate cached for this
            item (without exposing the YouTube URL — the download happens
            server-side via POST .../theme/download).
        ja_tem_local:
          type: boolean
          description: >
            The entity already has a theme.{mp3,ogg,flac} in the root folder (downloaded
            before OR placed by hand by the owner) — the same file that
            GET /entities/{id}/theme (briefing 0082) serves.
    ThemeDownloadResult:
      type: object
      description: >
        Success response of POST /entities/{id}/theme/download
        (briefing 0103).
      required: [local_path]
      properties:
        local_path:
          type: string
          description: Absolute path of the theme song written in the real library folder.
    MatchSuggestion:
      type: object
      description: >
        Something the backend refuses to decide alone, kept for the owner to
        accept or ignore (migrations 0028 and 0029). Three reasons share the
        shape: `name` (a cheaper variant of the name on disk found this
        candidate), `empty_tree` (the source answered the current match with zero
        episodes, so no file can ever be placed) and `tree_mismatch` (the tree
        exists but does not fit the files). For `name` and `empty_tree`
        `source`/`source_id` identify a REAL candidate; for `tree_mismatch` they
        carry the CURRENT identity, which is the thing under suspicion -- that is
        what `can_apply` is for.
      required:
        [
          source,
          source_id,
          title,
          score,
          query,
          reason,
          can_apply,
          files_unmatched,
          files_total,
        ]
      properties:
        source:
          type: string
          description: Source of the candidate (e.g. `tmdb`).
        source_id:
          type: string
          description: Id of the candidate IN that source.
        title:
          type: string
          description: Title of the candidate, in the source's reading language.
        year:
          type: string
          nullable: true
          description: Release year of the candidate when the source reports one.
        poster_url:
          type: string
          nullable: true
          description: Poster of the candidate (direct source URL).
        score:
          type: integer
          description: >
            Similarity (0-100) between the name ON DISK (the misspelled one) and
            the candidate -- it says how plausible the hint is.
        query:
          type: string
          description: >
            The variant that found it (one token dropped, or a character cut that
            became a prefix of the real title). It explains the guess. Empty for
            `tree_mismatch`, which found nothing.
        reason:
          type: string
          enum: [name, empty_tree, tree_mismatch]
          description: >
            Why the owner is being asked. It selects the sentence the screen
            shows; the actions are the same for every reason. `name` is the typo
            door (0028), `empty_tree` a match whose source has no episodes, and
            `tree_mismatch` a tree that does not fit the files.
        can_apply:
          type: boolean
          description: >
            Whether applying the candidate makes sense. False when the candidate
            IS the identity the item already has -- the `tree_mismatch` case, and
            the `empty_tree` case when no sibling candidate reached the
            threshold. The screen hides the apply action in that case.
        files_unmatched:
          type: integer
          description: >
            Episodes of the series that found no place in the tree (the evidence
            behind `tree_mismatch`). Zero for the other reasons.
        files_total:
          type: integer
          description: >
            Episodes considered by that census (matched plus unmatched). Zero for
            the reasons that have no census.

    ResolvedEntity:
      type: object
      description: >
        Resolved view — FINAL shape. Today it reflects the file/core layer; Phase 3
        fills the same fields from override/external without changing the shape.
        The RICH fields (tagline, keywords, runtime, certification, vote_average,
        backdrop_url, videos, collection, similar, external_links) give PARITY
        with the external detail (0022/0023): they come from the already enriched external
        layer and use the SAME shape (ExternalVideo/Collection/Similar components). Genres
        do NOT have their own field — they are the `tags` (which already carry them).
      required:
        [
          id,
          type,
          title,
          original_title,
          description,
          release_date,
          status,
          tags,
          external_ids,
          owned,
          file_count,
          poster_url,
          extension_data,
          lang,
          original_language,
          resolved_languages,
          tagline,
          keywords,
          runtime,
          certification,
          vote_average,
          local_rating,
          ratings,
          backdrop_url,
          videos,
          collection,
          similar,
          external_links,
          ancestors,
          ownership,
          catalog_completeness,
        ]
      properties:
        match_suggestion:
          description: >
            The "did you mean this?" hint for an item that is still unidentified:
            the name on disk found nothing, but a cheaper variant of it did. It is
            a HINT, never an identity -- the owner decides, and the action behind it
            is `POST /confirm-candidate` with `method=external`. Absent when there
            is no hint, which is the normal case. Computed on the first open of the
            item (never during a scan, to avoid a burst of source queries) and
            persisted, so the next open is a single row read.
          allOf:
            - $ref: "#/components/schemas/MatchSuggestion"
          nullable: true
        id: { type: string }
        type:
          type: string
          enum: [movie, tv, collection, season, episode, album, artista, faixa]
          description: >
            Canonical type of the entity. `season`/`episode` (0031) are the internal nodes of the
            series tree (same resolved shape; navigated by GET /members).
            `album`/`artista`/`faixa` (0105-0107) are the music vertical -- same
            enum as EntityCard.type (Portuguese names, not `artist`/`track`).
        title: { type: string }
        original_title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        release_date: { type: [string, "null"] }
        status: { type: string }
        tags:
          type: array
          items: { type: string }
        external_ids:
          type: object
          additionalProperties: { type: string }
        owned: { type: boolean }
        file_count: { type: integer }
        poster_url: { type: [string, "null"] }
        extension_data:
          type: object
          description: >
            Vertical data (namespace → field object), composed by the
            same precedence override ⟵ external ⟵ file. Empty object when
            there are no extensions; never null.
          additionalProperties: { type: object }
        lang:
          type: string
          description: >
            Echo of the requested language (ADR-0019). Empty when there is no language
            context (compatible with the pre-multi-language behavior).
        original_language:
          type: [string, "null"]
          description: NEUTRAL code of the work original language (fallback anchor), or null.
        resolved_languages:
          type: object
          description: >
            LANGUAGE provenance (ADR-0019): translatable field → effective language
            that served the value (`""` = neutral/file base). Side map; it does not change
            the fields (the shape stays flat).
          additionalProperties: { type: string }
        tagline:
          type: [string, "null"]
          description: Translatable tagline resolved in the active language (parity with the external one).
        keywords:
          type: array
          description: Translatable keywords (distinct from genres/tags). `[]` when absent.
          items: { type: string }
        runtime:
          type: [integer, "null"]
          description: Duration in minutes, or null.
        certification:
          type: [string, "null"]
          description: Content rating of the active-language region (US fallback), or null.
        airing_status:
          type: [string, "null"]
          description: >
            Airing SITUATION of a SERIES (0045): RAW string from the source, exposed
            VERBATIM (TMDB: "Returning Series"|"Ended"|"Canceled"|"In Production"|
            "Planned"; TVDB: status.name) — the UI translates the label to pt-BR. Neutral and
            read-only. OPTIONAL: present only when the source reports it; ABSENT for
            movie and for a TVDB-only series without a match.
        vote_average:
          type: [number, "null"]
          description: External average score (0–10), or null.
        local_rating:
          type: [number, "null"]
          description: >
            LOCAL score of the owner (0–10), stored in the override layer (ADR-0012):
            it complements/overrides the source score (vote_average). null when the owner
            did not rate it — the UI then shows the source score (clearing is non-destructive).
        ratings:
          type: array
          description: >
            Score (vote_average) of EACH external layer that models the field,
            one entry per source (0086) — unlike vote_average
            (merged by priority, a single value), it allows the UI to show
            scores from different sources side by side. `[]` when absent.
          items: { $ref: "#/components/schemas/EntityRating" }
        backdrop_url:
          type: [string, "null"]
          description: >
            Entity backdrop: LOCAL route of the cached fanart (0015) when
            it exists, otherwise the direct source URL; null when there is none.
        videos:
          type: array
          description: Videos (trailer/clip) from the source. `[]` when absent.
          items: { $ref: "#/components/schemas/ExternalVideo" }
        collection:
          oneOf:
            - $ref: "#/components/schemas/ExternalCollection"
            - type: "null"
          description: Collection the item belongs to, or null.
        similar:
          type: array
          description: Similar items. `[]` when absent.
          items: { $ref: "#/components/schemas/ExternalSimilar" }
        cast:
          type: array
          description: >
            Cast (0029), top ~50 by billing order. `[]` when absent.
            Movie: simple character. Series: joined roles + `episode_count`.
          items: { $ref: "#/components/schemas/CreditCast" }
        crew:
          type: array
          description: Crew (0029) groupable by `department`. `[]` when absent.
          items: { $ref: "#/components/schemas/CreditCrew" }
        companies:
          type: array
          description: Production companies/studios (0029). `[]` when absent.
          items: { $ref: "#/components/schemas/CreditCompany" }
        external_links:
          type: object
          description: "Map link→URL (imdb, tmdb…). `{}` when absent."
          additionalProperties: { type: string }
        ancestors:
          type: array
          description: >
            ROOT→PARENT trail (breadcrumb, 0032) in the series tree: episode →
            [series, season]; season → [series]; top-level work
            (movie/tv/collection) → `[]`. Never null.
          items: { $ref: "#/components/schemas/AncestorRef" }
        ownership:
          description: >
            AGGREGATED ownership of a parent entity in the series tree (0034): owned
            episodes over the total. Present only for `tv` (sum across seasons)
            and `season` (direct episodes); `null` for movie/episode/collection (which
            use the simple ownership of `owned`).
          oneOf:
            - $ref: "#/components/schemas/OwnershipInfo"
            - type: "null"
        orderings:
          description: >
            Available episode display orders of a SERIES (0040): the
            `default` and the `available` list (union of the episode `numbering`
            keys + `absolute` when there is an absolute_number, with the default first).
            OPTIONAL: present only for `tv` with at least one order; ABSENT for the
            other types and for a series without numbering. The UI only shows the selector when
            `available` has more than one item.
          $ref: "#/components/schemas/OrderingsInfo"
        still_url:
          type: [string, "null"]
          description: >
            RAW URL of the EPISODE still (16:9 frame) (0042), as it came from the provider —
            language-NEUTRAL artwork, from the extension_data core.tv@1. OPTIONAL: present only
            for `episode` with a still; ABSENT for the other types and for an episode without a
            still (falls back to the placeholder). The front end serves it through the image proxy (fetches+caches
            on demand); it is never downloaded at import.
        catalog_completeness:
          description: >
            Catalog completeness of the item (0058) against the ruler configured
            in /settings (0057), computed LIVE on every request (it reuses
            the data that this same endpoint already resolves, without an extra query).
            `null` only when the item is a draft (never matched) — it makes no
            sense to evaluate metadata that does not exist yet; for a non-draft
            item it is never null here (unlike `EntityCard.catalog_completeness`,
            which reads from a batch cache and can stay `null` until the first
            run of the job).
          oneOf:
            - $ref: "#/components/schemas/CatalogCompletenessResult"
            - type: "null"
    EntityRating:
      type: object
      description: >
        Score (vote_average) of ONE specific source, for side-by-side display
        of scores from different sources (0086) — see `ResolvedEntity.ratings`.
      required: [source, value]
      properties:
        source: { type: string }
        value: { type: number }
    OrderingsInfo:
      type: object
      description: >
        Episode display orders of a series (0040): `default` is the initial
        order (the default_season_type stored at import) and `available` the list
        offered to the selector (the default first, `absolute` at the end when there is an absolute
        number). The selector only appears with more than one order.
      required: [default, available]
      properties:
        default:
          type: string
          description: Initial order (default_season_type of the series).
        available:
          type: array
          description: Orders offered, the default first.
          items: { type: string }
    EpisodeGroups:
      type: object
      description: >
        Response of GET /entities/{id}/episodes (0040): the order effectively applied
        (`ordering`, already resolved against the available ones) and the episode groups.
      required: [ordering, groups]
      properties:
        ordering:
          type: string
          description: Applied order (the default when the requested one was absent/invalid).
        groups:
          type: array
          items: { $ref: "#/components/schemas/EpisodeGroup" }
    EpisodeGroup:
      type: object
      description: >
        A group of episodes (season of the requested ORDER) with the NON-navigable
        header label and the episode cards already with `numbering` projected in that order. In
        `absolute` there is a single continuous group (`season` 0, label "Episódios"); episodes
        without numbering in that order fall into a "Sem numeração" group (`season` 0) at the end.
      required: [season, label, episodes]
      properties:
        season:
          type: integer
          description: Season number in the ordering (0 in the absolute group, or without numbering).
        label:
          type: string
          description: Header label, not navigable (e.g. Season 1, Episodes).
        episodes:
          type: array
          items: { $ref: "#/components/schemas/EntityCard" }
    OwnershipInfo:
      type: object
      description: >
        Aggregated ownership of a season/series (0034): owned episodes
        (`owned_count`) over the total episodes (`total_count`). It feeds the
        "owns 12/13" badge. Derived from the media_file_entity links (kind='tv_episode').
      required: [owned_count, total_count]
      properties:
        owned_count: { type: integer }
        total_count: { type: integer }
    AncestorRef:
      type: object
      description: >
        Ancestor node of the breadcrumb (0032): the minimum to render and navigate to a
        parent level of the series tree.
      required: [id, type, title]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [movie, tv, collection, season, episode]
        title: { type: string }
    IntegrationSummary:
      type: object
      description: >
        ONE item of the GET /integrations listing (briefing 0095). `configurada`
        is computed by the provider OWN rule (e.g. TMDB accepts `token`
        OR `api_key`) from the effective values of each field — it is not
        "all required fields filled".
      required: [slug, nome, descricao, configurada]
      properties:
        slug:
          type: string
          description: "Stable URL/registry key (e.g. tmdb)."
        nome:
          type: string
          description: "Friendly label (e.g. TMDB)."
        descricao:
          type: string
          description: Short supporting text.
        configurada:
          type: boolean
          description: Whether the integration operates with the current effective values.
    IntegrationsListResponse:
      type: object
      description: Body of GET /integrations.
      required: [integrations]
      properties:
        integrations:
          type: array
          items: { $ref: "#/components/schemas/IntegrationSummary" }
    IntegrationFieldOption:
      type: object
      description: One option of a `tipo:"select"` field.
      required: [valor, label]
      properties:
        valor: { type: string }
        label: { type: string }
    IntegrationField:
      type: object
      description: >
        ONE field of an integration schema, with the EFFECTIVE value already
        resolved (database → env var → absent). `valor` only appears when
        `tipo` is NOT `"secret"` AND there is an effective value — a secret field
        NEVER returns the raw value, in no response (GET nor PUT echo).
      required: [nome, label, tipo, obrigatorio, definido, origem]
      properties:
        nome:
          type: string
          description: Stable field key (key in `values_json` and in the PUT).
        label:
          type: string
          description: Friendly label for the UI.
        tipo:
          type: string
          enum: [text, secret, bool, number, select]
          description: Presentation hint for the UI; it does not affect value resolution.
        obrigatorio:
          type: boolean
          description: >
            UI hint (asterisk); it does NOT decide `configurada` — each
            integration has its own rule (see IntegrationSummary).
        ajuda:
          type: string
          description: "Optional supporting text (e.g. where to get the key)."
        placeholder:
          type: string
          description: Optional example text.
        opcoes:
          type: array
          description: Present only when `tipo` is `"select"`.
          items: { $ref: "#/components/schemas/IntegrationFieldOption" }
        definido:
          type: boolean
          description: Whether there is an effective value (database OR env var) for this field.
        origem:
          type: string
          enum: [banco, env, nenhum]
          description: >
            `banco` = value stored in `integration_config` (precedence
            over the env var, ADR-0023); `env` = inherited from the bootstrap/fallback
            env var of this field; `nenhum` = neither of the two.
        valor:
          type: string
          description: >
            Raw effective value — present only when `tipo != "secret"` AND
            `definido:true`. Absent (never `null`) in the other cases.
    IntegrationDetail:
      type: object
      description: >
        Body of GET /integrations/{slug} and of PUT /integrations/{slug} (the
        post-write echo, same shape).
      required: [slug, nome, descricao, campos]
      properties:
        slug: { type: string }
        nome: { type: string }
        descricao: { type: string }
        campos:
          type: array
          items: { $ref: "#/components/schemas/IntegrationField" }
    PutIntegrationRequest:
      type: object
      description: >
        Body of PUT /integrations/{slug} (briefing 0095): PARTIAL upsert —
        only the keys present in `valores` change. A `null` value REMOVES the
        key from `values_json` (the field goes back to inheriting the env var, or stays
        `origem:"nenhum"` if that one is also empty); a key ABSENT from the
        object is not touched. 422 if `valores` comes empty or names a key
        that is not a field of the schema of this integration.
      required: [valores]
      properties:
        valores:
          type: object
          description: Map field-name → new value (string) or `null` (remove).
          additionalProperties:
            type: [string, "null"]
    LanguageSettings:
      type: object
      description: >
        Language config (ADR-0018): primary language, fallback and the set of
        allowed ones (BCP-47/TMDB codes). It is the PUT body and the response of
        GET/PUT /settings/languages.
      required: [primary, fallback, allowed]
      properties:
        primary:
          type: string
          description: "Primary language (read base, ∈ allowed)."
        fallback:
          type: string
          description: "Fallback language (∈ allowed)."
        allowed:
          type: array
          description: Allowed languages (they govern what can be written/scraped).
          items: { type: string }
    RetroactiveEnrichmentSettings:
      type: object
      description: >
        Retroactive enrichment throttle config (briefing 0085):
        minimum interval, in days, between two attempts of the SAME item. It is the
        PUT body and the response of GET/PUT /settings/enrichment-retroativo.
      required: [retry_days]
      properties:
        retry_days:
          type: integer
          minimum: 1
          maximum: 365
          description: >
            Days between two retroactive enrichment attempts of the same
            item, for libraries without their own override. Factory default
            15 when never configured.
    AutoMaterializeArtworkSettings:
      type: object
      description: >
        Automatic artwork materialization toggle (briefing 0089): when it is
        on, every successful scan auto-import (movie or series) immediately
        materializes, in the real library folder, the artwork
        discovered in the inventory. It is the PUT body and the response of
        GET/PUT /settings/auto-materialize-artwork.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: >
            Off by default (factory default `false`). Scope
            restricted to the scan auto-import -- it does not affect manual enrichment
            actions.
    AutoDownloadTrailerTemaSettings:
      type: object
      description: >
        Automatic trailer/theme song download toggle (briefing
        0104, ADR-0026): shared by the `trailer_tema_faltantes` periodic job
        and by the automatic trigger on scan -- when it is
        on, every successful scan auto-import (movie or series) tries
        to download trailer/theme in the background, without waiting for the periodic job or
        a manual click. It is the PUT body and the response of GET/PUT
        /settings/auto-download-trailer-tema.
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: >
            Off by default (factory default `false`). Scope
            restricted to the scan auto-import -- it does not affect the manual
            trailer/theme button (0102/0103); the periodic job remains always
            schedulable regardless of this value.
    YtdlpCustomPath:
      type: object
      description: >
        Body of PUT /settings/ytdlp (briefing 0101, ADR-0025): the custom
        path that the owner wants to use for the yt-dlp binary.
      properties:
        custom_binary_path:
          type: string
          nullable: true
          description: >
            Absolute path of the yt-dlp binary managed by the owner. `null` or
            an empty string clears the override (goes back to inheriting the
            `MYMEDIADB_YTDLP_PATH` env var/automatic download).
    YtdlpSettings:
      type: object
      description: >
        EFFECTIVE status of the yt-dlp binary (briefing 0101, ADR-0025): foundation
        of the YouTube downloader reused by trailer (0102) and
        theme song (0103). It is the response of GET/PUT /settings/ytdlp.
      required: [disponivel, origem]
      properties:
        disponivel:
          type: boolean
          description: Whether there is a usable yt-dlp binary now.
        origem:
          type: string
          enum: [custom, baixado, nenhum]
          description: >
            `custom` = admin path (database or env `MYMEDIADB_YTDLP_PATH`,
            database has precedence); `baixado` = binary downloaded dynamically
            by the process itself on first need; `nenhum` = unavailable.
        custom_binary_path:
          type: string
          nullable: true
          description: >
            Custom path currently stored in the DATABASE (`null` when not
            configured). Distinct from `origem="custom"` via env var, which
            is never echoed by this API.
        detalhe:
          type: string
          nullable: true
          description: >
            Reason when `disponivel=false` (e.g. "download failed: no
            network", "custom path unreachable: ..."). `null` when
            available.
    CatalogCompletenessSettings:
      type: object
      description: >
        "Catalog completeness" config (briefing 0057): per `entity.type`,
        which fields/artwork the owner considers desirable for the item to be well
        cataloged. A concept DIFFERENT from OWNERSHIP completeness (how many episodes/
        seasons the owner HAS on disk, `web/src/lib/entity-badges.ts`). Top-level
        key = `entity.type` — OPEN (today only `movie`/`tv` have UI, but the schema
        does not fix an enum, since `entity.type` is free TEXT). A type absent from the
        object means "nothing required" for that type. It is the PUT body and the
        response of GET/PUT /settings/catalog-completeness.
      additionalProperties:
        $ref: "#/components/schemas/TypeCompletenessConfig"
    TypeCompletenessConfig:
      type: object
      description: >
        Desirable fields/artwork for ONE `entity.type` (briefing 0057). All
        fields are required — the form always sends the complete object
        (full replacement in the PUT, not a partial merge).
      required:
        [
          description,
          runtime,
          certification,
          keywords,
          cast,
          media_file,
          artwork,
        ]
      properties:
        description:
          type: boolean
          description: "Requires a filled synopsis (mirrors Entidade.Description)."
        runtime:
          type: boolean
          description: Requires a filled duration (mirrors Entidade.Runtime).
        certification:
          type: boolean
          description: >
            Requires a filled age rating (mirrors
            Entidade.Certification).
        keywords:
          type: boolean
          description: >
            Requires at least 1 keyword (mirrors Entidade.Keywords — do not
            confuse with Tags/genres).
        cast:
          type: boolean
          description: >
            Requires at least 1 cast credit (mirrors Entidade.Cast, briefing
            0029/MD6).
        media_file:
          type: boolean
          description: >
            Requires at least one media_file with state='present' for the entity
            (SIMPLE ownership of the item — do not confuse with the AGGREGATED ownership of
            series/season from Ownership/0036).
        artwork:
          type: array
          description: >
            Desired artwork kinds (each one markable independently). Each
            item must belong to the system `kindsValidos` registry
            (`internal/server/assets.go`), validated in the Go handler — not fixed
            as an enum here. Values accepted today: `poster`, `fanart`, `still`,
            `logo`, `clearart`, `disc`, `banner`, `thumb`, `characterart`.
          items: { type: string }
    OverrideBlob:
      type: object
      description: >
        RAW override blob (briefing 0016), as stored — the sparse patch that
        the resolver interprets on read. Only EDITORIAL fields. Translatable
        ones (title/description/tags) are a MAP per language (`{"pt-BR":…}`), with `null`
        in a language = "set empty". Neutral ones (original_title/release_date/
        extension_data) are the direct scalar/object; `local_rating` (owner local
        score) is a NUMBER 0–10 or `null`. Missing keys = inherited. `{}` when there
        is no override. Free form (additionalProperties): the per-field semantics belong to the
        resolver, not to the schema.
      additionalProperties: true
    OverridePatch:
      type: object
      description: >
        Sparse patch of PATCH /override (briefing 0016). Each key is an
        editorial field; only the keys present are touched (sparse merge). The FORM of the
        VALUE depends on the field: scalars (title/original_title/description/
        release_date) accept `string` or `null`; `tags` accepts an array of strings
        (replacement), an object `{add?:[],remove?:[]}` (operation merge) or
        `null`; `extension_data` accepts an object or `null`; `local_rating` (local
        score) accepts a number 0–10 or `null`; `credits` (cast/crew/companies,
        briefing 0029 Phase C) accepts `null` (deletes ALL credits) or an object
        with the optional keys `cast`/`crew`/`companies` — a missing sub-key inherits the
        external base intact. Each block is `null` or an object with the optional
        operations `reorder`/`remove` (array of credit KEYS) / `edit` (map
        key→field patch) / `add` (array of new credits, each requiring a
        `source_id` CHOSEN BY THE OWNER + `name`). The credit KEY is `source_id`
        for `cast`/`companies`; for `crew` it is `"<source_id>|<job>"` (the same key
        that the provider already uses for dedup — a member can have two roles with the
        same `source_id`). `character`/`job`/`department` in `edit`/`add` are
        NEUTRAL at this stage (they do not compose per language — the source no longer brings these
        fields per language). For TRANSLATABLE fields the value is the one of the `?lang=`
        language (the handler builds the per-language map); NEUTRAL fields (incl. `credits`)
        ignore `lang`. `null` = set empty (do not confuse with CLEAR, which is the
        DELETE). Non-editorial key or invalid shape → 422.
      additionalProperties: true
      example:
        title: "Duna"
        description: null
        tags: { add: ["Clássico"], remove: ["Guerra"] }
        original_title: "Dune"
        credits:
          cast:
            reorder: ["6193"]
            edit: { "6193": { character: "Paul Atreides" } }
          crew:
            remove: ["1892|Producer"]
            add:
              [
                {
                  source_id: "custom-1",
                  name: "Fulano de Tal",
                  department: "Direção",
                  job: "Assistente de Direção",
                },
              ]
    MediaInfo:
      type: object
      description: Technical facts extracted from the file (ffprobe).
      properties:
        general:
          type: object
          properties:
            format: { type: string }
            duration_seconds: { type: number }
            size_bytes: { type: integer, format: int64 }
            bitrate: { type: integer, format: int64 }
        video:
          type: array
          items:
            type: object
            properties:
              codec: { type: string }
              width: { type: integer }
              height: { type: integer }
              hdr: { type: string }
        audio:
          type: array
          items:
            type: object
            properties:
              codec: { type: string }
              channels: { type: integer }
              language: { type: string }
        subtitle:
          type: array
          items:
            type: object
            properties:
              codec: { type: string }
              language: { type: string }
    MediaFile:
      type: object
      required: [id, path, size, edition, part_no, state, mediainfo]
      properties:
        id: { type: string }
        path: { type: string }
        size: { type: [integer, "null"], format: int64 }
        edition: { type: [string, "null"] }
        part_no: { type: [integer, "null"], format: int64 }
        state:
          type: string
          enum: [present, missing]
        mediainfo:
          oneOf:
            - $ref: "#/components/schemas/MediaInfo"
            - type: "null"
    FileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MediaFile" }
    Source:
      type: object
      required: [id, path, type, content_type, state, last_scan, watch_enabled]
      properties:
        id: { type: string }
        path: { type: string }
        type: { type: string }
        content_type:
          type: string
          description: >
            Library nature (0034): `movie` (default) | `series`. The scanner
            branches the match flow by this value. Free field (no CHECK); the UI
            only offers movie/series.
        state:
          type: string
          enum: [online, offline]
        last_scan: { type: [string, "null"] }
        watch_enabled:
          type: boolean
          description: >
            Turns the filesystem watcher (`fsnotify`) of this source on/off
            (briefing 0064). Default `false` on registration — sources mounted
            over the network (rclone/gdrive, the real project deployment) gain
            almost nothing from the watch, so the owner turns it on explicitly only when
            they know it is a real local disk. It only reduces the LATENCY until the
            next scan; the `midias_faltantes` periodic job/incremental scan
            remains the base even with the watch on. Editable only via
            `PATCH /api/v1/library/{id}`, applied hot (without restart).
        preferred_language:
          type: [string, "null"]
          description: >
            Preferred search/display language of this library (briefing
            0084). `null` = no preference, it uses the global language from
            `app_settings`.
        retroactive_enrichment_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          description: >
            Override, in days, of the retroactive enrichment throttle of this
            library (briefing 0085). `null` = no override, it uses the
            global value of `GET /settings/enrichment-retroativo`.
    SourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Source" }
    CreateSource:
      type: object
      required: [path, type]
      properties:
        path: { type: string }
        type:
          type: string
          enum: [movie, tv]
        content_type:
          type: string
          enum: [movie, series]
          description: >
            Library nature (0034). Optional; omitted => `movie` (compat).
            `series` enables the series scan flow (file→episode).
        preferred_language:
          type: string
          description: Preferred search/display language of this library (briefing 0084).
        retroactive_enrichment_days:
          type: integer
          minimum: 1
          maximum: 365
          description: >
            Override, in days, of the retroactive enrichment throttle of this
            library (briefing 0085). Optional; absent = no
            override, it uses the global value.
    PatchSource:
      type: object
      description: >
        PARTIAL patch of PATCH /api/v1/library/{id} (briefings 0064/0070) —
        missing fields stay unchanged; `path` and `watch_enabled` can come
        together or each one alone.
      properties:
        watch_enabled:
          type: boolean
          description: >
            Turns the `fsnotify` watcher of this source on/off. Applied HOT
            by the handler: `false→true` registers the watch immediately (same
            routine used at boot); `true→false` closes the watcher and removes the
            in-memory entry immediately. Neither direction
            requires a server restart.
        path:
          type: string
          description: >
            Re-points the datasource to a new path (e.g. the disk/mount
            moved). It validates as on registration (exists, is a directory,
            readable, without duplicating another source). It cascades
            `media_file.path`, `asset.local_path` and `entity.nfo_path` of this
            source to the new prefix — it does NOT trigger a scan nor move bytes on
            disk. Equal to the current path is a no-op.
        preferred_language:
          type: [string, "null"]
          description: >
            Preferred search/display language of this library (briefing
            0084). An explicit `null` in the body CLEARS the preference (goes back to
            using the global language); an ABSENT field leaves it unchanged.
        retroactive_enrichment_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 365
          description: >
            Override, in days, of the retroactive enrichment throttle of this
            library (briefing 0085). An explicit `null` in the body
            CLEARS the override (goes back to inheriting the global one); an ABSENT field
            leaves it unchanged.
    ScanStatus:
      type: object
      required: [running, files_seen, files_total]
      properties:
        running: { type: boolean }
        files_seen: { type: integer }
        files_total: { type: integer }
        started_at: { type: [string, "null"] }
        last_error: { type: string }
        current_item:
          type: [string, "null"]
          description: File being processed now, relative to the source root (ADR-0040).
        step_label:
          type: [string, "null"]
          description: Post-sweep stage in progress ("reconciliando pendentes da biblioteca").
        wait_ms:
          type: [integer, "null"]
          description: Time waiting in the queue; null when it never waited.
        elapsed_ms:
          type: [integer, "null"]
          description: Elapsed time since the start of the sweep.
    StartScan:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string }
        status: { type: string }
    BrowseEntry:
      type: object
      description: >
        A subdirectory listed by the folder browser (briefing 0071).
      required: [name, path, readable]
      properties:
        name: { type: string }
        path: { type: string }
        readable:
          type: boolean
          description: >
            `false` when this entry cannot be opened for listing
            (permission denied) — it appears in the list (the owner sees that the folder
            exists) but it is not navigable; the front end disables the click on it.
    BrowseResult:
      type: object
      description: >
        Response of `GET /api/v1/library/browse` (briefing 0071): content of
        a filesystem directory that the API process sees, used by the
        folder browser of the datasource registration/edition form.
      required: [path, parent, entries, truncated]
      properties:
        path:
          type: string
          description: Absolute path effectively listed (normalized).
        parent:
          type: [string, "null"]
          description: >
            Directory one level above `path`; `null` when `path` already is the
            filesystem root (`/`).
        entries:
          type: array
          items: { $ref: "#/components/schemas/BrowseEntry" }
        truncated:
          type: boolean
          description: >
            `true` when the directory has more than 2000 subfolders and the list
            came truncated (alphabetical order) at that safety limit.
    Job:
      type: object
      description: >
        A job known by the system (briefing 0052): dynamic config
        (enabled/schedule) + the last execution mirror + `running`
        (in-memory, ephemeral state).
      required:
        [
          id,
          nome,
          descricao,
          enabled,
          schedule_cron,
          next_run_at,
          last_run_at,
          last_status,
          last_message,
          running,
        ]
      properties:
        id:
          type: string
          description: Stable slug (e.g. backup_vacuum), not a uuid.
        nome: { type: string }
        descricao: { type: [string, "null"] }
        enabled:
          type: boolean
          description: Gates the AUTOMATIC trigger only; a manual run works regardless.
        schedule_cron:
          type: [string, "null"]
          description: 5-field cron expression; null means a manual-only job (no schedule).
        next_run_at:
          type: [string, "null"]
          description: Next scheduled run; null when disabled or without a schedule.
        last_run_at: { type: [string, "null"] }
        last_status:
          type: [string, "null"]
          enum: [success, error, null]
        last_message: { type: [string, "null"] }
        running:
          type: boolean
          description: >
            true while there is an active execution (queued or running) of this job.
        last_duration_ms:
          type: [integer, "null"]
          description: >
            How long the LAST finished execution took (started_at ->
            finished_at), in milliseconds (ADR-0040). null when the job never
            finished an execution.
        progress:
          oneOf:
            - $ref: "#/components/schemas/JobProgress"
            - type: "null"
          description: >
            State of the active execution (or of the last one, when the job is stopped):
            stage, current item, counters and elapsed time. null when the job
            never ran.
    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
    PatchJob:
      type: object
      description: PARTIAL patch of PATCH /jobs/{id} — missing fields stay unchanged.
      properties:
        enabled: { type: boolean }
        schedule_cron:
          type: [string, "null"]
          description: >
            5-field cron expression; an explicit `null` clears the schedule
            (the job becomes manual-only); absent = unchanged.
    RunJob:
      type: object
      required: [execution_id]
      properties:
        execution_id: { type: string }
    JobExecution:
      type: object
      description: One execution in a job history (briefing 0052); generic for ANY job type.
      required:
        [
          id,
          job_id,
          trigger,
          status,
          started_at,
          finished_at,
          message,
          ok,
          failed,
        ]
      properties:
        id: { type: string }
        job_id: { type: string }
        trigger:
          type: string
          enum: [schedule, manual]
        status:
          type: string
          enum: [running, success, error]
        started_at: { type: string }
        finished_at: { type: [string, "null"] }
        message:
          type: [string, "null"]
          description: Short result (success) or error (failure), without a stack trace.
        wait_ms:
          type: [integer, "null"]
          description: Time waiting in the queue (enqueued_at to started_at). null when it has not started yet.
        duration_ms:
          type: [integer, "null"]
          description: Time running (started_at to finished_at). null while it has not finished.
        ok:
          type: integer
          description: How many items the execution reported as done (ADR-0040).
        failed:
          type: integer
          description: How many items the execution reported as failed (ADR-0040).
    QueueItem:
      type: object
      description: >
        An execution queue item (ADR-0028/ADR-0040): scan or job, with the
        derived times and the readable label of the reference.
      required:
        [
          id,
          kind,
          ref_id,
          trigger,
          status,
          step_index,
          step_total,
          done,
          total,
          ok,
          failed,
          enqueued_at,
        ]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [scan, job]
        ref_id:
          type: string
          description: library_source.id (kind=scan) or job_definition.id (kind=job).
        ref_label:
          type: [string, "null"]
          description: Human-readable name of the reference (job name, source path); null if the reference no longer exists.
        trigger:
          type: string
          enum: [manual, schedule, watch]
        status:
          type: string
          enum: [queued, running, success, error]
        message:
          type: [string, "null"]
          description: Final result (success) or error of the execution.
        position:
          type: [integer, "null"]
          description: Queue position (1 means the next to run). Absent on the running item and on finished ones.
        step_label:
          type: [string, "null"]
        step_index: { type: integer }
        step_total: { type: integer }
        current_item:
          type: [string, "null"]
        current_label:
          type: [string, "null"]
          description: >
            `current_item` written the way a person reads it: when the run narrates
            an entity id instead of a title, this is the entity title. null when
            `current_item` already is the label (a file path, a source path) or when
            the id no longer resolves — the screen then shows `current_item`.
        done: { type: integer }
        total: { type: integer }
        ok: { type: integer }
        failed: { type: integer }
        enqueued_at: { type: string }
        started_at: { type: [string, "null"] }
        finished_at: { type: [string, "null"] }
        wait_ms:
          type: [integer, "null"]
          description: enqueued_at -> started_at.
        duration_ms:
          type: [integer, "null"]
          description: started_at -> finished_at (only for finished ones).
        elapsed_ms:
          type: [integer, "null"]
          description: started_at -> now (only for the running one).
    QueueView:
      type: object
      required: [queued, recent]
      properties:
        running:
          oneOf:
            - $ref: "#/components/schemas/QueueItem"
            - type: "null"
        queued:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }
        recent:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }
    QueueEvent:
      type: object
      description: One line of the per-item trace (ADR-0040).
      required: [seq, at, status, label]
      properties:
        seq: { type: integer }
        at: { type: string }
        status:
          type: string
          enum: [ok, error, skip]
        label: { type: string }
        detail: { type: [string, "null"] }
    QueueItemDetail:
      type: object
      required: [item, events]
      properties:
        item: { $ref: "#/components/schemas/QueueItem" }
        events:
          type: array
          items: { $ref: "#/components/schemas/QueueEvent" }
    JobProgress:
      type: object
      description: Live progress of ONE job execution (the same number the queue screen shows).
      required: [status, step_index, step_total, done, total, ok, failed]
      properties:
        status:
          type: string
          enum: [queued, running, success, error]
        step_label:
          type: [string, "null"]
          description: Label of the current stage ("enriquecimento retroativo").
        step_index: { type: integer }
        step_total: { type: integer }
        current_item:
          type: [string, "null"]
          description: What is being processed now (file, title, source).
        current_label:
          type: [string, "null"]
          description: >
            `current_item` written the way a person reads it (the entity title when
            the run narrates only an id). null when `current_item` already is the
            label or when the id no longer resolves.
        done: { type: integer }
        total: { type: integer }
        ok: { type: integer }
        failed: { type: integer }
        elapsed_ms:
          type: [integer, "null"]
          description: Time elapsed since the start; null when it is not running.
    JobExecutionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobExecution" }
    ExternalVideo:
      type: object
      required: [name, key, site, type, official, url]
      properties:
        name: { type: string }
        key: { type: string }
        site: { type: string }
        type: { type: string }
        official: { type: boolean }
        url:
          type: [string, "null"]
          description: Public video URL; null when the provider is unknown.
    ExternalCollection:
      type: object
      required: [source_id, name, poster_url]
      properties:
        source_id: { type: string }
        name: { type: string }
        poster_url: { type: [string, "null"] }
        internal_id:
          type: [string, "null"]
          description: id of the internal collection entity when already imported (0026); null otherwise.
    ExternalCollectionPart:
      type: object
      description: Item (part) of a collection; same lean shape as a search result.
      required: [source_id, type, title, year, overview, poster_url]
      properties:
        source_id: { type: string }
        type: { type: string }
        title: { type: string }
        year: { type: [string, "null"] }
        overview: { type: [string, "null"] }
        poster_url: { type: [string, "null"] }
        internal_id:
          type: [string, "null"]
          description: "id of the internal entity of this part when already imported (0026); null otherwise."
    ExternalCollectionDetail:
      type: object
      description: >
        External collection as a page (briefing 0024): metadata of the set and the
        parts. `parts` always comes as `[]` (never null). Hero artwork
        (poster_url/backdrop_url) may come as a local proxy route (0024); the
        part thumbnails remain direct from the source.
      required:
        [source, source_id, name, overview, poster_url, backdrop_url, parts]
      properties:
        source: { type: string }
        source_id: { type: string }
        name: { type: string }
        overview: { type: [string, "null"] }
        poster_url: { type: [string, "null"] }
        backdrop_url: { type: [string, "null"] }
        internal_id:
          type: [string, "null"]
          description: id of the internal collection entity when this collection was already imported (0025/0026); null otherwise.
        parts:
          type: array
          items: { $ref: "#/components/schemas/ExternalCollectionPart" }
    ExternalAlbumTrack:
      type: object
      description: >
        An OFFICIAL track of the release (MusicBrainz recording), briefing 0115
        Part 2.
      required: [source_id, title, track_number, disc_number, isrc]
      properties:
        source_id: { type: string }
        title: { type: string }
        track_number: { type: integer }
        disc_number: { type: integer }
        isrc: { type: [string, "null"] }
        internal_id:
          type: [string, "null"]
          description: >-
            id of the internal track entity when this track was ALREADY imported
            (linked to the album via entity_relation kind=music_album); null otherwise
            -- the UI then offers "Importar" for that track.
    ExternalAlbum:
      type: object
      description: >
        External album as a page (briefing 0115 Part 2): metadata of the release and
        the official tracks. `tracks` always comes as `[]` (never null).
      required: [source, source_id, name, year, genre, tracks]
      properties:
        source: { type: string }
        source_id: { type: string }
        name: { type: string }
        year: { type: [string, "null"] }
        genre: { type: [string, "null"] }
        internal_id:
          type: [string, "null"]
          description: "id of the internal album entity when this album was already imported; null otherwise."
        tracks:
          type: array
          items: { $ref: "#/components/schemas/ExternalAlbumTrack" }
    ExternalSimilar:
      type: object
      required: [source_id, type, title, year, poster_url]
      properties:
        source_id: { type: string }
        type: { type: string }
        title: { type: string }
        year: { type: [string, "null"] }
        poster_url: { type: [string, "null"] }
        internal_id:
          type: [string, "null"]
          description: "id of the internal entity of this similar item when already imported (internal-first, 0027); null otherwise."
    CreditCast:
      type: object
      description: >
        A CAST credit (0029). `name` is neutral (a proper name is not translated);
        `character` respects the active language. `episode_count` only in series (role
        aggregated per episode). `profile_url` already comes proxied.
      required: [source_id, name, character, order]
      properties:
        source_id: { type: string }
        name: { type: string }
        character: { type: string }
        order: { type: integer, description: "Billing order (lower = higher)." }
        profile_url:
          { type: [string, "null"], description: "Photo (proxied) or null." }
        episode_count:
          type: [integer, "null"]
          description: Number of episodes in the role (series only); null for a movie.
        person_id:
          type: [string, "null"]
          description: >
            Person id IN OUR catalog (internal-first, 0029 Phase D), present
            when that person was already persisted by some import. When present, the
            UI links to the person page (GET /person/{id}); null = no internal
            destination (it degrades to non-clickable).
    CreditCrew:
      type: object
      description: "A CREW credit (0029), groupable by `department`."
      required: [source_id, name, department, job]
      properties:
        source_id: { type: string }
        name: { type: string }
        department:
          { type: string, description: "Directing/Screenplay/Cinematography…" }
        job: { type: string }
        profile_url: { type: [string, "null"] }
        episode_count:
          {
            type: [integer, "null"],
            description: "Series only; null in a movie.",
          }
        person_id:
          type: [string, "null"]
          description: "Person id in the catalog (internal-first, 0029 Phase D); see CreditCast.person_id."
    CreditCompany:
      type: object
      description: "A production company/studio (0029)."
      required: [source_id, name]
      properties:
        source_id: { type: string }
        name: { type: string }
        logo_url:
          { type: [string, "null"], description: "Logo (proxied) or null." }
    Person:
      type: object
      description: >
        Person page (0029 Phase D, internal-first): the person deduplicated in the
        catalog plus their FILMOGRAPHY = the works already imported that credit them.
        Read-only at this stage (without cataloging the person as an entity). `source`/`source_id`
        allow the external link (TMDB) as a complement.
      required: [id, name, filmography]
      properties:
        id:
          { type: string, description: "Person id in our catalog (person.id)." }
        name: { type: string, description: "Name (neutral, not translated)." }
        profile_url:
          { type: [string, "null"], description: "Photo (proxied) or null." }
        source: { type: string, description: "Person source (e.g. tmdb)." }
        source_id:
          {
            type: string,
            description: "Person id at the source (for the external link).",
          }
        filmography:
          type: array
          description: >
            ALREADY IMPORTED works that credit the person (section "Na sua biblioteca");
            `[]` when none. It comes from the catalog (it works without the provider).
          items: { $ref: "#/components/schemas/PersonCredit" }
        filmography_external:
          type: array
          description: >
            Works of the person filmography (from the provider, e.g. TMDB) NOT YET
            imported (section "Ainda não importados") — they navigate to the external detail
            to import. `[]` when the provider brought nothing or is unavailable
            (degradation: the section goes away, the imported one remains). It excludes what is already in the
            catalog (that one appears in `filmography`).
          items: { $ref: "#/components/schemas/PersonExternalCredit" }
    PersonExternalCredit:
      type: object
      description: >
        A work of the person filmography that is NOT YET in the catalog (0029 Phase D):
        a card that navigates to the external detail (`/external/{source}/{type}/{source_id}`)
        to view/import. It mirrors PersonCredit, but with the EXTERNAL identity (source/
        source_id/type) instead of `entity_id`.
      required: [source, source_id, type, title, kind]
      properties:
        source: { type: string, description: "Work source (e.g. tmdb)." }
        source_id: { type: string, description: "Id da obra na fonte." }
        type: { type: string, description: "movie | tv." }
        title: { type: string }
        year: { type: [string, "null"] }
        poster_url:
          { type: [string, "null"], description: "Poster (proxied) or null." }
        kind: { type: string, description: "cast | crew." }
        character:
          { type: [string, "null"], description: "Character (when cast)." }
        job: { type: [string, "null"], description: "Job (when crew)." }
    PersonCredit:
      type: object
      description: >
        A work of the person filmography: the catalog entity plus their
        role/job in that work. A navigable card (entity_id → /entities/{id}).
      required: [entity_id, type, title, kind]
      properties:
        entity_id: { type: string }
        type: { type: string, description: "movie | tv | collection." }
        title: { type: string }
        year: { type: [string, "null"] }
        poster_url:
          {
            type: [string, "null"],
            description: "Poster of the card (served by the entity route) or null.",
          }
        kind: { type: string, description: "cast | crew." }
        character:
          { type: [string, "null"], description: "Character (when cast)." }
        job: { type: [string, "null"], description: "Job (when crew)." }
        department:
          { type: [string, "null"], description: "Department (when crew)." }
    ExternalDetail:
      type: object
      description: >
        Rich external detail (briefing 0022). Translatable fields already resolved in the
        active language; neutral ones come once. Lists always come as `[]` (never null).
      required:
        [
          source,
          source_id,
          type,
          lang,
          title,
          original_title,
          description,
          tagline,
          release_date,
          year,
          runtime,
          certification,
          original_language,
          vote_average,
          genres,
          keywords,
          poster_url,
          backdrop_url,
          videos,
          collection,
          similar,
          external_links,
          resolved_languages,
        ]
      properties:
        source: { type: string }
        source_id: { type: string }
        type: { type: string }
        lang: { type: string }
        title: { type: string }
        original_title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        tagline: { type: [string, "null"] }
        release_date: { type: [string, "null"] }
        year: { type: [string, "null"] }
        runtime: { type: [integer, "null"] }
        certification: { type: [string, "null"] }
        # Airing state of the series (0045), a RAW verbatim string; OPTIONAL
        # (absent for a movie, or when the source does not report it). The UI translates the label.
        airing_status: { type: [string, "null"] }
        original_language: { type: [string, "null"] }
        vote_average: { type: [number, "null"] }
        genres:
          type: array
          items: { type: string }
        keywords:
          type: array
          items: { type: string }
        # Artes do HERO: rota LOCAL do proxy (/api/v1/images?src=..., cacheada — 0024)
        # quando há diretório de assets e o host e proxyavel; senao a URL DIRETA da
        # fonte (degradacao). Similares/colecao seguem com a URL direta da fonte.
        poster_url: { type: [string, "null"] }
        backdrop_url: { type: [string, "null"] }
        videos:
          type: array
          items: { $ref: "#/components/schemas/ExternalVideo" }
        collection:
          oneOf:
            - $ref: "#/components/schemas/ExternalCollection"
            - type: "null"
        similar:
          type: array
          items: { $ref: "#/components/schemas/ExternalSimilar" }
        cast:
          type: array
          description: Cast (0029), same shape as ResolvedEntity (parity).
          items: { $ref: "#/components/schemas/CreditCast" }
        crew:
          type: array
          description: Crew (0029), same shape as ResolvedEntity.
          items: { $ref: "#/components/schemas/CreditCrew" }
        companies:
          type: array
          description: Production companies/studios (0029).
          items: { $ref: "#/components/schemas/CreditCompany" }
        external_links:
          type: object
          additionalProperties: { type: string }
          description: "Map link→URL (e.g. imdb, tmdb)."
        resolved_languages:
          type: object
          additionalProperties: { type: string }
          description: Language provenance of the translatable fields (ADR-0019).

openapi: 3.1.0
info:
  title: MyMediaDB — API nativa (v1)
  version: "0.1.0"
  description: >
    Contrato OpenAPI da superfície nativa /api/v1 do MyMediaDB. É a FONTE DE
    VERDADE dos tipos TS do front (gerados por `npm run gen:types` em
    web/src/lib/api-types.ts — ADR-0014), nunca mantidos à mão. Cobre a leitura
    do catálogo (/entities, briefing 0010) e os datasources (/library, 0008).
    Toda resposta de erro usa o envelope { error: { code, message } }.
servers:
  - url: /
    description: Mesmo origin do servidor (o binário serve API + SPA).
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Saúde do serviço.
      tags: [meta]
      responses:
        "200":
          description: Serviço no ar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/entities:
    get:
      operationId: listEntities
      summary: Lista paginada de entities (cards do catálogo).
      description: >
        Cada item traz a posse DERIVADA (EXISTS media_file present), a contagem
        de arquivos, a confiança de match (badge de revisão) e o link do pôster
        quando há arte local. Filtros opcionais e ordenação por título.
      tags: [entities]
      parameters:
        - name: type
          in: query
          description: "Filtra por tipo (ex.: movie, tv). Ausente = todos."
          required: false
          schema: { type: string }
        - name: owned
          in: query
          description: Filtra por posse (true = na biblioteca). Ausente = todos.
          required: false
          schema: { type: boolean }
        - name: limit
          in: query
          description: Tamanho da página (default 50, máximo 200).
          required: false
          schema: { type: integer, minimum: 0, default: 50 }
        - name: offset
          in: query
          description: Deslocamento da página (default 0).
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: sort
          in: query
          description: Ordenação por título — `title` (asc, default) ou `-title` (desc).
          required: false
          schema:
            type: string
            enum: [title, -title]
            default: title
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Página de cards.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityList" }
        "400":
          $ref: "#/components/responses/Error"
    post:
      operationId: createItem
      summary: "Cria um item local manual sem fonte externa (briefing 0027)."
      description: >
        Cria uma entity de mídia (type=movie|tv) LOCAL, sem external_ids, com os campos
        base dados pelo dono — para catalogar algo que a fonte não tem ou ainda não
        casou. Combina com PUT /entities/{id}/external-ids (fixar o id da fonte depois,
        para sincronizar). Responde 201 com a entity RESOLVIDA. 400 corpo inválido; 422
        type fora de movie|tv ou título vazio.
      tags: [entities]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItem" }
      responses:
        "201":
          description: Item criado, resolvido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}:
    get:
      operationId: getEntity
      summary: Entidade resolvida por idioma (camadas + cadeia de fallback).
      description: >
        Resolve a entity no idioma pedido (?lang=, default = principal das
        settings), com a cadeia de fallback `pedido → fallback → original_language
        → arquivo` (ADR-0019). A resposta é PLANA e traz `resolved_languages` (mapa
        campo → idioma efetivo) e `lang` (eco do pedido). `lang` fora dos permitidos
        → 400.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Entidade resolvida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: purgeEntity
      summary: Purga individual de uma entity (briefing 0018).
      description: >
        PURGA explícita (a única porta destrutiva, ADR-0012): apaga a entity; o
        ON DELETE CASCADE leva media_file/media_external/media_override/asset junto,
        e o diretório de binários de assets em disco é limpo best-effort. Nunca é
        efeito colateral de outra ação — sempre do dono, sempre explícita.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Entity purgada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeResult" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/settings/languages:
    get:
      operationId: getLanguageSettings
      summary: Config de idioma (principal, fallback, permitidos).
      description: >
        Devolve a config de idioma vigente (ADR-0018). Quando ainda não há linha
        gravada, responde o default seguro (`pt-BR` / `en` / `[pt-BR, en]`).
      tags: [settings]
      responses:
        "200":
          description: Config de idioma.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageSettings" }
    put:
      operationId: putLanguageSettings
      summary: Grava a config de idioma (com validação).
      description: >
        Valida que `primary` e `fallback` ∈ `allowed` e que os códigos não são
        vazios, então persiste (upsert) e invalida o cache. 422 quando inválida.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguageSettings" }
      responses:
        "200":
          description: Config gravada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageSettings" }
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/schema/entity-fields:
    get:
      operationId: getEntityFieldsSchema
      summary: Descritor do formulário editorial dirigido por schema (briefing 0030).
      description: >
        Devolve os DESCRITORES de campo do formulário editorial, derivados da fonte
        única `resolver.CamposEditaveis()` combinada com o registro de apresentação
        (label/grupo/widget/ordem/faixa). O front monta os inputs e a validação de
        cliente a partir daqui — sem redigitar a lista de campos. Metadado estático
        (imutável entre deploys), sem autenticação e cacheável. A lista sai ORDENADA
        por `order` crescente. O `extension_data` fica de fora (não é campo de
        formulário simples).
      tags: [schema]
      responses:
        "200":
          description: Descritores de campo do formulário editorial.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FieldSchema" }

  /api/v1/entities/{id}/enrich:
    post:
      operationId: enrichEntity
      summary: Enriquece uma entity existente a partir do provider (briefing 0015).
      description: >
        Puxa o detalhe da fonte e grava a camada externa (media_external, payload
        cru) + a identidade (external_ids) + o pôster cacheado; NÃO toca override
        nem arte do dono (não-destrutivo). Corpo opcional: sem source usa "tmdb";
        sem source_id usa external_ids[source] da entity (422 se não houver id).
        Responde a entity RESOLVIDA (com os dados externos compostos).
        MULTI-IDIOMA (briefing 0020): a fonte puxa TODAS as traduções permitidas
        (settings.allowed) numa só ida e grava um payload AUMENTADO tagueado por
        idioma, além de gravar entity.original_language (âncora do fallback). O shape
        RESOLVIDO desta resposta não muda — só passa a ter mais idiomas para o
        `?lang=` do GET /entities/{id} servir.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrichRequest" }
      responses:
        "200":
          description: Entidade resolvida após o enriquecimento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/external-ids:
    put:
      operationId: updateExternalIds
      summary: "Edita a identidade externa da entity (briefing 0027)."
      description: >
        Grava o mapa COMPLETO de external_ids (source -> id na fonte). As colunas
        geradas external_id_tmdb/imdb re-derivam do JSON, então fixar o id prepara uma
        sincronização futura (o dono corrige o id quando a fonte muda/apaga/funde). Um
        valor vazio remove aquela fonte. NÃO re-enriquece (o dono chama /enrich depois).
        Responde 200 com a entity RESOLVIDA. 404 entity inexistente; 400 corpo inválido;
        422 chave (source) vazia.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateExternalIds" }
      responses:
        "200":
          description: Entity resolvida com a nova identidade.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/override:
    get:
      operationId: getOverride
      summary: Blob CRU do override do dono (briefing 0016).
      description: >
        Devolve o `override_json` tal como GUARDADO (`{}` quando não há override),
        para a UI distinguir "overridado" de "herdado" POR CAMPO e POR IDIOMA. Não
        reinterpreta os valores — o resolver interpreta na leitura da entity. Campos
        traduzíveis (title/description/tags) aparecem como MAPA por idioma
        (`{"pt-BR":…, "en":…}`); campos neutros (original_title/release_date/
        extension_data) como o escalar/objeto direto. 404 se a entity não existe.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Blob cru de override (objeto esparso).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverrideBlob" }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: patchOverride
      summary: Funde um patch esparso de override, POR IDIOMA (briefing 0016).
      description: >
        MERGE ESPARSO de 2 níveis sobre o `override_json`. O `?lang=` é o PINCEL dos
        campos traduzíveis: cada chave traduzível do corpo é fundida em
        `override[campo][lang]` (deep-merge preservando os outros idiomas do campo; um
        override escalar LEGADO migra para `{principal: <legado>}` antes). Campos
        NEUTROS fundem o escalar em `override[campo]` (o `lang` é ignorado para eles).
        `null` no idioma é valor VÁLIDO = "definir vazio" (apaga a base e interrompe o
        fallback naquele idioma — distinto de LIMPAR via DELETE). `lang` default =
        principal; fora dos permitidos → 400. Responde a entity RESOLVIDA no `lang`.
        Chave não-editorial ou forma inválida → 422.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/LangQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverridePatch" }
      responses:
        "200":
          description: Entidade resolvida no idioma pedido após o merge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
    delete:
      operationId: resetOverride
      summary: Reset — apaga o override inteiro (briefing 0016).
      description: >
        Remove a linha de override da entity: todos os campos voltam a HERDAR a base
        (externo/arquivo). Responde a entity RESOLVIDA. 404 se a entity não existe.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Entidade resolvida (na base, sem override).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/override/{campo}:
    delete:
      operationId: clearOverrideField
      summary: Limpar override de um campo (por idioma ou inteiro, briefing 0016).
      description: >
        LIMPAR override (≠ definir vazio). Campo TRADUZÍVEL COM `?lang=` remove só
        `override[campo][lang]` (e a chave campo se o mapa esvaziar). Campo traduzível
        SEM `?lang=`, ou campo NEUTRO, remove a chave campo INTEIRA (todos os idiomas).
        Remover chave ausente é idempotente (200). Se o blob esvaziar, a linha de
        override é removida. Responde a entity RESOLVIDA. `{campo}` não editorial →
        422; `lang` presente fora dos permitidos → 400; entity inexistente → 404.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: campo
          in: path
          required: true
          description: >
            Campo editorial a limpar (title, original_title, description,
            release_date, tags, extension_data).
          schema: { type: string }
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Entidade resolvida após limpar o campo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/files:
    get:
      operationId: getEntityFiles
      summary: Arquivos (media_file) da entity com mediainfo.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Lista de arquivos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileList" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/members:
    get:
      operationId: getEntityMembers
      summary: Membros de uma coleção (briefing 0025).
      description: >
        Os filmes ligados a uma entity `type='collection'` por
        `entity_relation(kind='collection')`, como CARDS (o mesmo shape de
        GET /entities), ordenados por ANO ascendente (sem ano ao fim). `[]` quando a
        entity não é coleção ou não tem membros; 404 quando a entity não existe. O
        `?lang=` é aceito para paridade, mas o card usa o título base (como a lista).
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Cards dos membros (array, possivelmente vazio).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityCard" }
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: addCollectionMember
      summary: "Liga um item à coleção como membro (briefing 0025, Fase B)."
      description: >
        Liga o item `child_id` à coleção `id` por `entity_relation(kind='collection')`.
        Valida que o pai existe e é uma coleção (senão 404/422), e que o filho existe,
        não é ele mesmo e não é outra coleção (sem aninhamento). Idempotente (religar
        não duplica). Devolve a lista de membros ATUALIZADA (mesmo shape e ordenação por
        ano de GET).
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMember" }
      responses:
        "200":
          description: Cards dos membros após ligar (array, ordenado por ano).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityCard" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/members/{childId}:
    delete:
      operationId: removeCollectionMember
      summary: "Desliga um membro da coleção (briefing 0025, Fase B)."
      description: >
        Remove a ligação `entity_relation(kind='collection')` entre a coleção `id` e o
        item `childId`. Idempotente (desligar o que não está ligado é no-op). 404 quando
        a coleção não existe. Devolve a lista de membros ATUALIZADA.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: childId
          in: path
          required: true
          description: Id do item membro a desligar.
          schema: { type: string }
      responses:
        "200":
          description: Cards dos membros após desligar (array).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityCard" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/episodes:
    get:
      operationId: getEntityEpisodes
      summary: Episódios da série agrupados por ordem de exibição (briefing 0040).
      description: >
        Devolve TODOS os episódios da série (descendentes via a árvore
        série→temporada→episódio) AGRUPADOS e ordenados pela ordem `ordering`
        (official/dvd/absolute…), projetados na LEITURA a partir do `numbering`
        gravado no import (core.tv@1) — ADR-0021: ordens ALTERNATIVAS não viram
        entidade de temporada, são agrupadas aqui no server (cabeçalhos de temporada
        são rótulos, só o episódio é navegável). Cada card traz `numbering` já naquela
        ordem. `ordering` ausente ou inválido cai no default da série; `absolute` é uma
        ordem especial (grupo único corrido por `absolute_number`). Episódio sem
        numeração naquela ordem cai num grupo "Sem numeração" ao fim. Entity que não é
        série → grupos vazios; 404 quando a entity não existe.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - name: ordering
          in: query
          required: false
          description: >
            Ordem de exibição (uma das `orderings.available` do detalhe da série, ex.:
            `official`, `dvd`, `absolute`). Ausente/inválida cai no default da série.
          schema: { type: string }
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Episódios agrupados pela ordem aplicada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpisodeGroups" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/assets/poster:
    get:
      operationId: getEntityPoster
      summary: Serve o binário do pôster local (image/*).
      description: >
        Devolve o arquivo de pôster com o content-type correto. 404 quando não há
        arte (a UI cai no placeholder); 403 quando o caminho gravado não está sob
        um datasource conhecido (guarda de path-traversal).
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Binário da imagem.
          content:
            image/*:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/assets:
    get:
      operationId: listAssets
      summary: Galeria de arte da entity (briefing 0017).
      description: >
        Lista os assets da entity (poster/fanart), cada um com origem (`user` do
        dono × `external` cacheado × `local` do scanner), a flag `preferred` (lida
        do `meta_json`) e a `url` do binário (rota do /file). `[]` quando não há
        arte; 404 se a entity não existe.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Lista de assets (vazia quando não há arte).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetList" }
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: uploadAsset
      summary: Upload de arte custom do dono (origin=user, briefing 0017).
      description: >
        Recebe multipart/form-data — campo `file` (o binário) + campo `kind`
        (`poster`|`fanart`, default `poster`). O tipo é validado pelos MAGIC BYTES
        (não pela extensão nem pelo header do cliente): só `image/jpeg|png|webp`.
        Tamanho ≤ 20 MiB. Grava o binário atomicamente sob o diretório de assets e
        cria o asset `origin='user'`. Subir arte já a faz o pôster ser servido
        (vence a externa). 201 com o asset criado.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Binário da imagem (JPEG, PNG ou WebP).
                kind:
                  type: string
                  enum: [poster, fanart]
                  description: "Tipo de arte (default: poster)."
      responses:
        "201":
          description: Asset criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/assets/{assetId}/file:
    get:
      operationId: getAssetFile
      summary: Serve o binário de um asset específico (image/*).
      description: >
        Miniaturas da galeria: devolve o arquivo do asset com o content-type
        correto e a MESMA guarda de path-traversal do pôster. O `assetId` precisa
        pertencer à entity. 404 quando não existe/binário sumiu; 403 fora das raízes
        confiáveis.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Binário da imagem.
          content:
            image/*:
              schema: { type: string, format: binary }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/assets/{assetId}/prefer:
    put:
      operationId: preferAsset
      summary: Marca o asset como preferido do seu kind (briefing 0017).
      description: >
        Seta `meta.preferred=true` no asset e LIMPA a flag dos outros do mesmo
        `(entity, kind)` — uma preferida por kind. Preserva as demais chaves do
        `meta_json`. 200 com o asset; 404 asset/entity inexistente.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Asset marcado como preferido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/assets/{assetId}:
    delete:
      operationId: deleteAsset
      summary: Remove uma arte do dono (origin=user, briefing 0017).
      description: >
        Apaga a linha do asset + o binário (best-effort). Recusa (422) apagar arte
        `origin='external'`: é cache re-puxável que some sozinho no re-enrich
        (não-destrutivo). 200 com o asset removido; 404 se não existe/não é da
        entity.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Asset removido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/search:
    get:
      operationId: search
      summary: Busca local-first no catálogo + fonte externa (briefing 0014).
      description: >
        Consulta SEMPRE o catálogo local (FTS5) e devolve cards no mesmo shape da
        lista. Quando há provider externo configurado (ex.: TMDB), acrescenta
        resultados "não salvos" (saved:false) — a busca nunca cria entidade.
        `external_available:false` separa "fonte indisponível/não configurada" de
        "zero resultados". Falha/timeout do externo degrada (external:[]) sem 5xx.
      tags: [entities]
      parameters:
        - name: q
          in: query
          description: Termo de busca (obrigatório).
          required: true
          schema: { type: string }
        - name: type
          in: query
          description: "Filtra por tipo (movie, tv). Ausente = todos."
          required: false
          schema:
            type: string
            enum: [movie, tv]
        - name: include
          in: query
          description: >
            Religa sub-nós da árvore de séries nos resultados locais, que por
            padrão ficam de fora (a busca é de topo: movie/tv/collection). CSV,
            aceita `season` e/ou `episode` (ex.: `include=season,episode`);
            valores fora desse conjunto são ignorados. Os sub-nós vêm no mesmo
            `local[]`, distinguíveis pelo campo `type` — a UI os separa em seções.
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Resultados locais e externos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/import:
    post:
      operationId: importEntity
      summary: Import explícito de um resultado externo (find-or-create, briefing 0015).
      description: >
        Find-or-create por id externo (dedup MD4): se já existe entity com aquele
        external_id, reusa (200); senão cria (201, status cataloged, título inicial
        do detalhe). Em ambos os casos enriquece pelo mesmo caminho (grava external
        + external_ids + pôster cacheado, nunca override). Responde a entity
        RESOLVIDA. MULTI-IDIOMA (briefing 0020): puxa todas as traduções permitidas
        e grava entity.original_language — ver POST /entities/{id}/enrich.
        `type=collection` (0025) importa a coleção inteira: cria a entity da coleção,
        importa cada filme membro (find-or-create) e os liga por entity_relation.
      tags: [entities]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportRequest" }
      responses:
        "200":
          description: Entity já existente (reuso), resolvida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "201":
          description: Entity criada e enriquecida, resolvida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/collections:
    post:
      operationId: createCollection
      summary: "Cria uma coleção local manual (briefing 0025, Fase B)."
      description: >
        Cria uma entity `type='collection'` LOCAL (sem fonte externa) com o título e a
        descrição dados pelo dono. Ao contrário do import de coleção (0025 Fase A), não
        há fonte: a coleção nasce vazia e os membros entram depois por
        POST /entities/{id}/members. Responde 201 com a entity RESOLVIDA. 400 corpo
        inválido; 422 título vazio.
      tags: [entities]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCollection" }
      responses:
        "201":
          description: Coleção criada, resolvida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "400":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/external/{source}/{type}/{id}:
    get:
      operationId: getExternalDetail
      summary: Detalhe externo rico antes de importar (briefing 0022).
      description: >
        Detalhe COMPLETO de um item externo (como o TMDB), para o dono decidir
        importar: título/título original, sinopse, slogan, gêneros e palavras-chave,
        duração, classificação indicativa (por região do idioma ativo, fallback US),
        pôster e fundo, vídeos, coleção, similares (navegáveis), nota externa e links.
        PERSISTE na 1ª chamada (cache re-componível) e serve do cache nas seguintes
        (refresh por TTL ou quando o conjunto de idiomas permitidos muda). Resolve os
        campos traduzíveis no idioma ativo. Ver o externo NUNCA cria entity. SEM
        elenco/equipe (MD6) nem nota local — briefings próprios.
      tags: [entities]
      parameters:
        - name: source
          in: path
          required: true
          description: "Fonte externa (ex.: tmdb)."
          schema: { type: string }
        - name: type
          in: path
          required: true
          description: "Tipo do item na fonte (movie|tv)."
          schema:
            type: string
            enum: [movie, tv]
        - name: id
          in: path
          required: true
          description: Id do item NA FONTE (source_id).
          schema: { type: string }
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Detalhe externo rico, resolvido no idioma ativo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalDetail" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/external/{source}/collection/{id}:
    get:
      operationId: getExternalCollection
      summary: Coleção externa como página própria (briefing 0024, follow-up do 0023).
      description: >
        Coleção de filmes (belongs_to_collection do TMDB) como destino navegável:
        nome/sinopse/artes do conjunto e a lista das PARTES (filmes), cada uma
        navegável ao detalhe externo. Localizada no idioma ativo (mono-idioma
        pragmático — sem o cache re-componível multi-idioma do 0022, que fica como
        follow-up). As artes do hero (pôster/fundo) podem sair como rota do proxy
        local (0024); as miniaturas das partes seguem diretas. Ver a coleção NUNCA
        cria entity. Requer uma fonte com a capacidade de coleção (senão 503).
      tags: [entities]
      parameters:
        - name: source
          in: path
          required: true
          description: "Fonte externa (ex.: tmdb)."
          schema: { type: string }
        - name: id
          in: path
          required: true
          description: Id da coleção NA FONTE (source_id).
          schema: { type: string }
        - $ref: "#/components/parameters/LangQuery"
      responses:
        "200":
          description: Coleção externa, resolvida no idioma ativo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalCollectionDetail" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/images:
    get:
      operationId: getImageProxy
      summary: Proxy read-through de imagem externa (briefing 0024).
      description: >
        Baixa e CACHEIA em disco a imagem apontada por `src` (pôster/fundo do detalhe
        do EXTERNO, pré-import) e a serve do cache nas próximas — a UI deixa de bater
        no CDN da fonte em runtime, como o pôster/fanart cacheados da entity (0015).
        `src` DEVE apontar a um host da allowlist (defesa contra SSRF); o cache é por
        URL (sha256), compartilhado. Responde o BINÁRIO da imagem (não JSON). 503 sem
        diretório de assets; 400 se `src` faltar ou o host não for permitido; 502 se a
        fonte falhar ou não devolver uma imagem.
      tags: [entities]
      parameters:
        - name: src
          in: query
          required: true
          description: "URL absoluta da imagem, em host permitido (ex.: image.tmdb.org)."
          schema: { type: string, format: uri }
      responses:
        "200":
          description: Binário da imagem cacheada.
          content:
            image/*:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/review:
    get:
      operationId: listReview
      summary: Fila de revisão (draft ou baixa confiança, briefing 0018).
      description: >
        Cards (mesmo shape EntityCard da lista) dos itens que pedem curadoria:
        `status='draft'` (não-identificado) OU com um media_file `present` cuja
        `match_confidence` está em (0, 70) — o limiar espelha o
        LIMIAR_BAIXA_CONFIANCA=70 do front. Ordenado por confiança ascendente (pior
        primeiro), drafts ao fim. `[]` quando vazia.
      tags: [entities]
      responses:
        "200":
          description: Cards da fila de revisão (array, possivelmente vazio).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityCard" }

  /api/v1/orphans:
    get:
      operationId: listOrphans
      summary: Fila de órfãs (auto-criadas, sumidas, sem investimento, briefing 0018).
      description: >
        Cards das entities órfãs: `status='cataloged'` (auto-criada pelo scanner),
        com ao menos um media_file e TODOS `missing`, e SEM investimento do dono
        (sem media_override e sem asset origin='user'). Uma entity só importada (sem
        media_file) não é órfã. Nada é apagado sozinho — a purga é sempre explícita.
      tags: [entities]
      responses:
        "200":
          description: Cards da fila de órfãs (array, possivelmente vazio).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntityCard" }

  /api/v1/entities/{id}/confirm:
    post:
      operationId: confirmEntity
      summary: Confirma o match de baixa confiança (briefing 0018).
      description: >
        O dono aceita o palpite: sobe a `match_confidence` de todos os media_file da
        entity para 100 (autoridade do dono), tirando o item da fila de revisão.
        Responde a entity RESOLVIDA. Não toca override/arte. 404 se a entity não
        existe.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      responses:
        "200":
          description: Entidade resolvida após confirmar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/entities/{id}/correct:
    post:
      operationId: correctEntity
      summary: Corrige o match informando a identidade correta (briefing 0018).
      description: >
        O dono informa o id correto da fonte: grava external_ids[source]=source_id
        (identidade vence, MD4) e RE-ENRIQUECE pelo serviço do 0015 (multi-idioma de
        graça), depois sobe a confiança para 100. Não toca override/arte (o enrich é
        não-destrutivo). Responde a entity RESOLVIDA. source default "tmdb";
        source_id obrigatório (422). 404 inexistente; 502 se a fonte falhar; 503 se o
        enrich está desligado.
      tags: [entities]
      parameters:
        - $ref: "#/components/parameters/EntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectRequest" }
      responses:
        "200":
          description: Entidade resolvida após corrigir.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedEntity" }
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/entities/purge:
    post:
      operationId: purgeEntities
      summary: Purga em lote de entities (briefing 0018).
      description: >
        PURGA explícita em lote: purga cada id do corpo (ApagarEntity + CASCADE +
        limpeza best-effort dos binários), ignorando ids ausentes (idempotente).
        Responde quantas entities foram de fato removidas. 422 corpo inválido.
      tags: [entities]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurgeBatchRequest" }
      responses:
        "200":
          description: Resumo da purga em lote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgeBatchResult" }
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/library:
    get:
      operationId: listLibrary
      summary: Lista os datasources (com state reavaliado na leitura).
      tags: [library]
      responses:
        "200":
          description: Lista de fontes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceList" }
    post:
      operationId: createLibrary
      summary: Cadastra um datasource.
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSource" }
      responses:
        "201":
          description: Fonte criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /api/v1/library/{id}:
    get:
      operationId: getLibrary
      summary: Obtém um datasource.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Fonte.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteLibrary
      summary: Remove um datasource (não purga entities).
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "204":
          description: Removido.
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/library/{id}/scan:
    get:
      operationId: getScanStatus
      summary: Progresso do scan de um datasource.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Status do job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanStatus" }
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: startScan
      summary: Dispara um scan em background.
      tags: [library]
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "202":
          description: Scan aceito.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartScan" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

components:
  parameters:
    EntityId:
      name: id
      in: path
      required: true
      description: Id da entity.
      schema: { type: string }
    SourceId:
      name: id
      in: path
      required: true
      description: Id do datasource.
      schema: { type: string }
    AssetId:
      name: assetId
      in: path
      required: true
      description: Id do asset (arte).
      schema: { type: string }
    LangQuery:
      name: lang
      in: query
      required: false
      description: >
        Idioma pedido (código BCP-47/TMDB, ex.: `pt-BR`). Ausente = idioma
        principal das settings. Fora dos permitidos → 400. Na lista, valida o
        contrato; os cards servem o título neutro (a resolução por idioma é do
        detalhe).
      schema: { type: string }
  responses:
    Error:
      description: "Erro no envelope padrão { error: { code, message } }."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Slug estável (não localizado) para o cliente ramificar.
            message:
              type: string
              description: Texto humano (pt-BR).
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string }
        version: { type: string }
    FieldSchema:
      type: object
      description: >
        Descritores de campo do formulário editorial (briefing 0030), ordenados por
        `order` crescente.
      required: [fields]
      properties:
        fields:
          type: array
          items: { $ref: "#/components/schemas/FieldDescriptor" }
    FieldDescriptor:
      type: object
      description: >
        Descritor de UM campo editável: combina a apresentação (label/grupo/widget/
        ordem/faixa, no server) com a etiqueta pública do resolver (translatable/kind).
      required: [name, label, group, widget, translatable, kind, order, creatable]
      properties:
        name:
          type: string
          description: Chave do campo (= chave do override/registro).
        label:
          type: string
          description: Rótulo pt-BR (UI mono-idioma hoje).
        group:
          type: string
          enum: [traduzivel, neutro]
          description: Seção do formulário.
        widget:
          type: string
          enum: [text, textarea, number, date, tags]
          description: Widget de renderização do input.
        translatable:
          type: boolean
          description: Se o campo compõe por idioma (= registroOrigem[campo].traduzivel).
        kind:
          type: string
          enum: [escalar, lista, numero]
          description: Classe de composição pública do resolver (extensao fica de fora do formulário).
        order:
          type: integer
          description: Ordem estável de renderização.
        creatable:
          type: boolean
          description: Aparece no formulário de CRIAR item (subconjunto plano).
        min:
          type: number
          description: Mínimo (só para widget number).
        max:
          type: number
          description: Máximo (só para widget number).
        step:
          type: number
          description: Passo (só para widget number).
        placeholder:
          type: [string, "null"]
          description: Placeholder opcional do input.
    EntityCard:
      type: object
      required: [id, type, title, status, owned, file_count, match_confidence, poster_url]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [movie, tv, collection, season, episode]
          description: >
            Tipo canonico da entity. `season`/`episode` (0031) compoem a arvore de
            series: GET /members de uma `tv` traz as `season`s; de uma `season`, os
            `episode`s (ordenados por sort_index).
        title: { type: string }
        status: { type: string }
        owned:
          type: boolean
          description: Posse derivada (EXISTS media_file present).
        file_count:
          type: integer
          format: int64
        match_confidence:
          type: [number, "null"]
          description: Maior confiança de match entre os arquivos (badge de revisão).
        poster_url:
          type: [string, "null"]
          description: Rota do pôster local, ou null quando não há arte.
        ownership:
          description: >
            Posse AGREGADA do card na árvore de séries (0036): episódios possuídos
            sobre o total. OPCIONAL — presente só nos cards `season` (e opcionalmente
            `tv`) de GET /entities/{id}/members; ausente/`null` para movie/episode/
            collection (que usam a posse simples de `owned`). Anotado no server
            pós-listagem, sem mudar a query do card.
          oneOf:
            - $ref: "#/components/schemas/OwnershipInfo"
            - type: "null"
        numbering:
          description: >
            Numeração REAL do episódio (0039): `season`/`number` projetados na
            ordenação da temporada-pai e o `absolute_number` quando houver. Reflete o
            número CATALOGADO (S02E05), não a posição na lista — biblioteca com E01+E05
            mostra E01 e E05. OPCIONAL: presente só nos cards `episode` de
            GET /entities/{id}/members; ausente/`null` para os demais tipos e para
            episódio sem numbering (draft), que cai no rótulo neutro. Anotado no server
            pós-listagem, sem mudar a query do card.
          oneOf:
            - $ref: "#/components/schemas/EpisodeNumbering"
            - type: "null"
        still_url:
          type: [string, "null"]
          description: >
            URL CRUA do still (frame 16:9) do episódio (0042), como veio do provider —
            artwork NEUTRO de idioma, gravada no import SEM baixar a imagem. OPCIONAL:
            presente só nos cards `episode` com still; ausente/`null` para os demais
            tipos e para episódio sem still (cai no placeholder). O front a serve pelo
            image proxy (GET /images?src=), que busca+cacheia sob demanda na 1a exibição.
    EpisodeNumbering:
      type: object
      description: >
        Numeração de um episódio na ordenação da temporada-pai (0039). `season`/`number`
        vêm do numbering multi-ordem gravado no import (core.tv@1); `absolute_number` é o
        número contínuo através das temporadas (anime), presente quando a fonte informou.
      required: [season, number]
      properties:
        season: { type: integer }
        number: { type: integer }
        absolute_number:
          type: integer
          description: Número absoluto (contínuo), quando disponível.
    EntityList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EntityCard" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
    ExternalResult:
      type: object
      description: >
        Resultado de uma fonte EXTERNA (ex.: TMDB). saved é sempre false: nunca é
        uma entidade do catálogo até o import explícito (briefing 0015).
      required: [source, source_id, type, title, year, overview, poster_url, saved]
      properties:
        source:
          type: string
          description: "Nome da fonte (ex.: tmdb)."
        source_id:
          type: string
          description: Id do item NA FONTE.
        type: { type: string }
        title: { type: string }
        year: { type: [string, "null"] }
        overview: { type: [string, "null"] }
        poster_url:
          type: [string, "null"]
          description: URL direta da arte na fonte (o proxy/cache é do 0015).
        saved:
          type: boolean
          description: Sempre false na busca (resultado externo não é entidade).
        internal_id:
          type: [string, "null"]
          description: >
            Id da entity interna quando este resultado externo JÁ foi importado
            (interno-first, 0027); null caso contrário. A UI mostra "na biblioteca"
            e linka ao interno em vez de reimportar.
    SearchResult:
      type: object
      required: [query, local, external, external_available]
      properties:
        query: { type: string }
        local:
          type: array
          description: Cards do catálogo (mesmo shape da lista).
          items: { $ref: "#/components/schemas/EntityCard" }
        external:
          type: array
          description: Resultados "não salvos" da fonte externa (vazio quando indisponível).
          items: { $ref: "#/components/schemas/ExternalResult" }
        external_available:
          type: boolean
          description: >
            false quando não há credencial/provider ou a fonte falhou — distingue
            "fonte indisponível" de "zero resultados".
    Asset:
      type: object
      description: >
        Uma arte da entity (briefing 0017). origin distingue a proveniência: `user`
        (upload do dono), `external` (cache re-puxável do enriquecimento) ou `local`
        (arte do scanner). preferred é a flag do dono (uma por (entity, kind)); url é
        a rota que serve o binário.
      required: [id, kind, origin, preferred, url]
      properties:
        id: { type: string }
        kind:
          type: string
          description: "Tipo de arte (ex.: poster, fanart)."
        origin:
          type: string
          description: "Proveniência (user, external, local)."
        preferred:
          type: boolean
          description: Marcada como preferida do seu kind (lida do meta_json).
        url:
          type: string
          description: Rota que serve o binário deste asset.
    AssetList:
      type: array
      description: Galeria de arte da entity (vazia quando não há arte).
      items: { $ref: "#/components/schemas/Asset" }
    EnrichRequest:
      type: object
      description: >
        Corpo OPCIONAL de POST /entities/{id}/enrich. Sem source usa "tmdb"; sem
        source_id usa external_ids[source] da entity.
      properties:
        source:
          type: string
          description: "Fonte a consultar (default tmdb)."
        source_id:
          type: string
          description: Id do item NA FONTE; se ausente, usa external_ids[source].
    ImportRequest:
      type: object
      description: Corpo de POST /import — o item externo a importar.
      required: [source_id, type]
      properties:
        source:
          type: string
          description: "Fonte (default tmdb)."
        source_id:
          type: string
          description: Id do item NA FONTE (obrigatório).
        type:
          type: string
          enum: [movie, tv, collection]
          description: >
            Tipo canônico do item (obrigatório). `collection` (0025) importa a coleção
            inteira: cria a entity `type='collection'` e importa/liga os filmes membros.
    CreateCollection:
      type: object
      description: >
        Corpo de POST /collections (0025 Fase B) — cria uma coleção LOCAL manual.
        Só o título é obrigatório; a descrição é opcional.
      required: [title]
      properties:
        title:
          type: string
          description: Nome da coleção (obrigatório, não pode ser vazio).
        description:
          type: string
          description: "Descrição livre da coleção (opcional)."
    AddMember:
      type: object
      description: >
        Corpo de POST /entities/{id}/members (0025 Fase B) — o item a ligar à coleção.
      required: [child_id]
      properties:
        child_id:
          type: string
          description: Id da entity (filme/série) a incluir como membro.
    CreateItem:
      type: object
      description: >
        Corpo de POST /entities (0027) — cria um ITEM LOCAL manual (movie|tv) SEM fonte
        externa. type e title são obrigatórios; os demais campos base são opcionais.
      required: [type, title]
      properties:
        type:
          type: string
          enum: [movie, tv]
          description: "Tipo do item (movie ou tv; coleção usa POST /collections)."
        title:
          type: string
          description: Título do item (obrigatório, não pode ser vazio).
        original_title:
          type: string
          description: "Título original (opcional)."
        description:
          type: string
          description: "Sinopse (opcional)."
        release_date:
          type: string
          description: "Data de lançamento ISO, ex.: 1999-03-31 (opcional)."
    UpdateExternalIds:
      type: object
      description: >
        Corpo de PUT /entities/{id}/external-ids (0027) — o mapa COMPLETO de identidades
        externas (source -> id na fonte). Substitui o mapa inteiro; um valor vazio remove
        aquela fonte. NÃO re-enriquece (fixa só a identidade, para sincronização futura).
      required: [external_ids]
      properties:
        external_ids:
          type: object
          additionalProperties: { type: string }
          description: "Mapa source->id, ex.: {\"tmdb\": \"603\", \"imdb\": \"tt0133093\"}."
    CorrectRequest:
      type: object
      description: >
        Corpo de POST /entities/{id}/correct — a identidade correta que o dono
        informa. source default "tmdb"; source_id obrigatório.
      required: [source_id]
      properties:
        source:
          type: string
          description: "Fonte (default tmdb)."
        source_id:
          type: string
          description: Id correto do item NA FONTE (obrigatório).
    PurgeBatchRequest:
      type: object
      description: Corpo de POST /entities/purge — os ids a purgar em lote.
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string }
          description: Ids das entities a purgar (ids ausentes são ignorados).
    PurgeResult:
      type: object
      description: Resultado da purga individual (DELETE /entities/{id}).
      required: [purged]
      properties:
        purged:
          type: boolean
          description: Sempre true quando a entity existia e foi purgada.
    PurgeBatchResult:
      type: object
      description: Resultado da purga em lote (POST /entities/purge).
      required: [removed]
      properties:
        removed:
          type: integer
          description: Quantas entities foram de fato removidas (idempotente por ausente).
    ResolvedEntity:
      type: object
      description: >
        Visão resolvida — shape FINAL. Hoje reflete a camada arquivo/núcleo; a
        Fase 3 preenche os mesmos campos com override/externo sem mudar o shape.
        Os campos RICOS (tagline, keywords, runtime, certification, vote_average,
        backdrop_url, videos, collection, similar, external_links) dão PARIDADE
        com o detalhe do externo (0022/0023): vêm da camada externa já enriquecida
        e usam o MESMO shape (componentes ExternalVideo/Collection/Similar). Os
        gêneros NÃO têm campo próprio — são as `tags` (que já os carregam).
      required:
        [id, type, title, original_title, description, release_date, status,
         tags, external_ids, owned, file_count, poster_url, extension_data,
         lang, original_language, resolved_languages,
         tagline, keywords, runtime, certification, vote_average, local_rating,
         backdrop_url, videos, collection, similar, external_links, ancestors,
         ownership]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [movie, tv, collection, season, episode]
          description: >
            Tipo canonico da entity. `season`/`episode` (0031) sao os nos internos da
            arvore de series (mesmo shape resolvido; navegados por GET /members).
        title: { type: string }
        original_title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        release_date: { type: [string, "null"] }
        status: { type: string }
        tags:
          type: array
          items: { type: string }
        external_ids:
          type: object
          additionalProperties: { type: string }
        owned: { type: boolean }
        file_count: { type: integer }
        poster_url: { type: [string, "null"] }
        extension_data:
          type: object
          description: >
            Dados de verticais (namespace → objeto de campos), compostos pela
            mesma precedência override ⟵ externo ⟵ arquivo. Objeto vazio quando
            não há extensões; nunca null.
          additionalProperties: { type: object }
        lang:
          type: string
          description: >
            Eco do idioma pedido (ADR-0019). Vazio quando não há contexto de
            idioma (compatível com o comportamento pré-multi-idioma).
        original_language:
          type: [string, "null"]
          description: Código NEUTRO do idioma original da obra (âncora do fallback), ou null.
        resolved_languages:
          type: object
          description: >
            Proveniência de IDIOMA (ADR-0019): campo traduzível → idioma efetivo
            que serviu o valor (`""` = base neutra/arquivo). Mapa lateral; não muda
            os campos (o shape segue plano).
          additionalProperties: { type: string }
        tagline:
          type: [string, "null"]
          description: Slogan traduzível resolvido no idioma ativo (paridade com o externo).
        keywords:
          type: array
          description: Palavras-chave traduzíveis (distintas dos gêneros/tags). `[]` quando ausentes.
          items: { type: string }
        runtime:
          type: [integer, "null"]
          description: Duração em minutos, ou null.
        certification:
          type: [string, "null"]
          description: Classificação indicativa da região do idioma ativo (fallback US), ou null.
        airing_status:
          type: [string, "null"]
          description: >
            SITUAÇÃO de exibição de uma SÉRIE (0045): string CRUA da fonte, exposta
            VERBATIM (TMDB: "Returning Series"|"Ended"|"Canceled"|"In Production"|
            "Planned"; TVDB: status.name) — a UI traduz o rótulo p/ pt-BR. Neutra e
            read-only. OPCIONAL: presente só quando a fonte a informa; AUSENTE para
            filme e série só-TVDB sem match.
        vote_average:
          type: [number, "null"]
          description: Nota média externa (0–10), ou null.
        local_rating:
          type: [number, "null"]
          description: >
            Nota LOCAL do dono (0–10), gravada na camada de override (ADR-0012):
            complementa/sobrepõe a nota da fonte (vote_average). null quando o dono
            não avaliou — a UI então mostra a nota da fonte (limpar é não-destrutivo).
        backdrop_url:
          type: [string, "null"]
          description: >
            Fundo (backdrop) da entity: rota LOCAL do fanart cacheado (0015) quando
            existe, senão a URL direta da fonte; null quando não há.
        videos:
          type: array
          description: Vídeos (trailer/clip) da fonte. `[]` quando ausentes.
          items: { $ref: '#/components/schemas/ExternalVideo' }
        collection:
          oneOf:
            - $ref: '#/components/schemas/ExternalCollection'
            - type: "null"
          description: Coleção a que o item pertence, ou null.
        similar:
          type: array
          description: Itens similares. `[]` quando ausentes.
          items: { $ref: '#/components/schemas/ExternalSimilar' }
        external_links:
          type: object
          description: "Mapa link→URL (imdb, tmdb…). `{}` quando ausentes."
          additionalProperties: { type: string }
        ancestors:
          type: array
          description: >
            Trilha RAIZ→PAI (breadcrumb, 0032) na árvore de séries: episódio →
            [série, temporada]; temporada → [série]; obra de topo
            (movie/tv/collection) → `[]`. Nunca null.
          items: { $ref: '#/components/schemas/AncestorRef' }
        ownership:
          description: >
            Posse AGREGADA de uma entity-pai da árvore de séries (0034): episódios
            possuídos sobre o total. Presente só para `tv` (soma across temporadas)
            e `season` (episódios diretos); `null` para movie/episódio/coleção (que
            usam a posse simples de `owned`).
          oneOf:
            - $ref: '#/components/schemas/OwnershipInfo'
            - type: "null"
        orderings:
          description: >
            Ordens de exibição de episódios disponíveis de uma SÉRIE (0040): a
            `default` e a lista `available` (união das chaves de `numbering` dos
            episódios + `absolute` quando há absolute_number, com o default primeiro).
            OPCIONAL: presente só para `tv` com ao menos uma ordem; AUSENTE para os
            demais tipos e para série sem numbering. A UI só mostra o seletor quando
            `available` tem mais de um item.
          $ref: '#/components/schemas/OrderingsInfo'
        still_url:
          type: [string, "null"]
          description: >
            URL CRUA do still (frame 16:9) do EPISÓDIO (0042), como veio do provider —
            artwork NEUTRO de idioma, do extension_data core.tv@1. OPCIONAL: presente só
            para `episode` com still; AUSENTE para os demais tipos e para episódio sem
            still (cai no placeholder). O front a serve pelo image proxy (busca+cacheia
            sob demanda); nunca é baixada no import.
    OrderingsInfo:
      type: object
      description: >
        Ordens de exibição de episódios de uma série (0040): `default` é a ordem
        inicial (o default_season_type gravado no import) e `available` a lista
        oferecida ao seletor (o default primeiro, `absolute` ao fim quando há número
        absoluto). O seletor só aparece com mais de uma ordem.
      required: [default, available]
      properties:
        default:
          type: string
          description: Ordem inicial (default_season_type da série).
        available:
          type: array
          description: Ordens oferecidas, o default primeiro.
          items: { type: string }
    EpisodeGroups:
      type: object
      description: >
        Resposta de GET /entities/{id}/episodes (0040): a ordem efetivamente aplicada
        (`ordering`, já resolvida contra as disponíveis) e os grupos de episódios.
      required: [ordering, groups]
      properties:
        ordering:
          type: string
          description: Ordem aplicada (o default quando a pedida foi ausente/inválida).
        groups:
          type: array
          items: { $ref: '#/components/schemas/EpisodeGroup' }
    EpisodeGroup:
      type: object
      description: >
        Um grupo de episódios (temporada da ORDEM pedida) com o rótulo NÃO-navegável do
        cabeçalho e os cards de episódio já com `numbering` projetado naquela ordem. No
        `absolute` há um grupo único corrido (`season` 0, label "Episódios"); episódios
        sem numeração naquela ordem caem num grupo "Sem numeração" (`season` 0) ao fim.
      required: [season, label, episodes]
      properties:
        season:
          type: integer
          description: Número da temporada da ordem (0 no grupo absoluto / sem numeração).
        label:
          type: string
          description: 'Rótulo do cabeçalho, não-navegável (ex.: Temporada 1, Episódios).'
        episodes:
          type: array
          items: { $ref: '#/components/schemas/EntityCard' }
    OwnershipInfo:
      type: object
      description: >
        Posse agregada de uma temporada/série (0034): episódios possuídos
        (`owned_count`) sobre o total de episódios (`total_count`). Alimenta o badge
        "possui 12/13". Derivada dos vínculos media_file_entity (kind='tv_episode').
      required: [owned_count, total_count]
      properties:
        owned_count: { type: integer }
        total_count: { type: integer }
    AncestorRef:
      type: object
      description: >
        Nó ancestral do breadcrumb (0032): o mínimo para renderizar e navegar a um
        nível-pai da árvore de séries.
      required: [id, type, title]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [movie, tv, collection, season, episode]
        title: { type: string }
    LanguageSettings:
      type: object
      description: >
        Config de idioma (ADR-0018): idioma principal, fallback e o conjunto de
        permitidos (códigos BCP-47/TMDB). É o corpo do PUT e a resposta do
        GET/PUT /settings/languages.
      required: [primary, fallback, allowed]
      properties:
        primary:
          type: string
          description: "Idioma principal (base de leitura, ∈ allowed)."
        fallback:
          type: string
          description: "Idioma de fallback (∈ allowed)."
        allowed:
          type: array
          description: Idiomas permitidos (governam o que pode ser escrito/scraped).
          items: { type: string }
    OverrideBlob:
      type: object
      description: >
        Blob CRU de override (briefing 0016), tal como guardado — o patch esparso que
        o resolver interpreta na leitura. Só campos EDITORIAIS. Traduzíveis
        (title/description/tags) são um MAPA por idioma (`{"pt-BR":…}`), com `null`
        num idioma = "definir vazio". Neutros (original_title/release_date/
        extension_data) são o escalar/objeto direto; `local_rating` (nota local do
        dono) é um NÚMERO 0–10 ou `null`. Chaves ausentes = herdado. `{}` quando não
        há override. Forma livre (additionalProperties): a semântica por campo é a do
        resolver, não do schema.
      additionalProperties: true
    OverridePatch:
      type: object
      description: >
        Patch esparso de PATCH /override (briefing 0016). Cada chave é um campo
        editorial; só as chaves presentes são tocadas (merge esparso). A FORMA do
        VALOR depende do campo: escalares (title/original_title/description/
        release_date) aceitam `string` ou `null`; `tags` aceita um array de strings
        (substituição), um objeto `{add?:[],remove?:[]}` (merge de operações) ou
        `null`; `extension_data` aceita um objeto ou `null`; `local_rating` (nota
        local) aceita um número 0–10 ou `null`. Para campos TRADUZÍVEIS o valor é o do
        idioma `?lang=` (o handler monta o mapa por idioma); campos NEUTROS ignoram o
        `lang`. `null` = definir vazio (não confundir com LIMPAR, que é o DELETE). Chave
        não-editorial ou forma inválida → 422.
      additionalProperties: true
      example:
        title: "Duna"
        description: null
        tags: { add: ["Clássico"], remove: ["Guerra"] }
        original_title: "Dune"
    MediaInfo:
      type: object
      description: Fatos técnicos extraídos do arquivo (ffprobe).
      properties:
        general:
          type: object
          properties:
            format: { type: string }
            duration_seconds: { type: number }
            size_bytes: { type: integer, format: int64 }
            bitrate: { type: integer, format: int64 }
        video:
          type: array
          items:
            type: object
            properties:
              codec: { type: string }
              width: { type: integer }
              height: { type: integer }
              hdr: { type: string }
        audio:
          type: array
          items:
            type: object
            properties:
              codec: { type: string }
              channels: { type: integer }
              language: { type: string }
        subtitle:
          type: array
          items:
            type: object
            properties:
              codec: { type: string }
              language: { type: string }
    MediaFile:
      type: object
      required: [id, path, size, edition, part_no, state, mediainfo]
      properties:
        id: { type: string }
        path: { type: string }
        size: { type: [integer, "null"], format: int64 }
        edition: { type: [string, "null"] }
        part_no: { type: [integer, "null"], format: int64 }
        state:
          type: string
          enum: [present, missing]
        mediainfo:
          oneOf:
            - $ref: "#/components/schemas/MediaInfo"
            - type: "null"
    FileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MediaFile" }
    Source:
      type: object
      required: [id, path, type, content_type, state, last_scan]
      properties:
        id: { type: string }
        path: { type: string }
        type: { type: string }
        content_type:
          type: string
          description: >
            Natureza da biblioteca (0034): `movie` (default) | `series`. O scanner
            ramifica o fluxo de match por este valor. Campo livre (sem CHECK); a UI
            oferece só movie/series.
        state:
          type: string
          enum: [online, offline]
        last_scan: { type: [string, "null"] }
    SourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Source" }
    CreateSource:
      type: object
      required: [path, type]
      properties:
        path: { type: string }
        type:
          type: string
          enum: [movie, tv]
        content_type:
          type: string
          enum: [movie, series]
          description: >
            Natureza da biblioteca (0034). Opcional; omitido => `movie` (compat).
            `series` liga o fluxo de scan de séries (arquivo→episódio).
    ScanStatus:
      type: object
      required: [running, files_seen, files_total]
      properties:
        running: { type: boolean }
        files_seen: { type: integer }
        files_total: { type: integer }
        started_at: { type: [string, "null"] }
        last_error: { type: string }
    StartScan:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string }
        status: { type: string }
    ExternalVideo:
      type: object
      required: [name, key, site, type, official, url]
      properties:
        name: { type: string }
        key: { type: string }
        site: { type: string }
        type: { type: string }
        official: { type: boolean }
        url:
          type: [string, "null"]
          description: URL pública do vídeo; null quando o provedor é desconhecido.
    ExternalCollection:
      type: object
      required: [source_id, name, poster_url]
      properties:
        source_id: { type: string }
        name: { type: string }
        poster_url: { type: [string, "null"] }
        internal_id:
          type: [string, "null"]
          description: "id da entity coleção interna quando ja importada (0026); null caso contrario."
    ExternalCollectionPart:
      type: object
      description: Item (parte) de uma coleção; mesmo shape enxuto de um resultado de busca.
      required: [source_id, type, title, year, overview, poster_url]
      properties:
        source_id: { type: string }
        type: { type: string }
        title: { type: string }
        year: { type: [string, "null"] }
        overview: { type: [string, "null"] }
        poster_url: { type: [string, "null"] }
        internal_id:
          type: [string, "null"]
          description: "id da entity interna desta parte quando ja importada (0026); null caso contrario."
    ExternalCollectionDetail:
      type: object
      description: >
        Coleção externa como página (briefing 0024): metadados do conjunto e as
        partes. `parts` sai sempre como `[]` (nunca null). Artes do hero
        (poster_url/backdrop_url) podem vir como rota do proxy local (0024); as
        miniaturas das partes seguem diretas da fonte.
      required:
        [source, source_id, name, overview, poster_url, backdrop_url, parts]
      properties:
        source: { type: string }
        source_id: { type: string }
        name: { type: string }
        overview: { type: [string, "null"] }
        poster_url: { type: [string, "null"] }
        backdrop_url: { type: [string, "null"] }
        internal_id:
          type: [string, "null"]
          description: "id da entity coleção interna quando esta coleção ja foi importada (0025/0026); null caso contrario."
        parts:
          type: array
          items: { $ref: "#/components/schemas/ExternalCollectionPart" }
    ExternalSimilar:
      type: object
      required: [source_id, type, title, year, poster_url]
      properties:
        source_id: { type: string }
        type: { type: string }
        title: { type: string }
        year: { type: [string, "null"] }
        poster_url: { type: [string, "null"] }
        internal_id:
          type: [string, "null"]
          description: "id da entity interna deste similar quando ja importado (interno-first, 0027); null caso contrario."
    ExternalDetail:
      type: object
      description: >
        Detalhe externo rico (briefing 0022). Campos traduzíveis já resolvidos no
        idioma ativo; neutros vêm uma vez. Listas saem sempre como `[]` (nunca null).
      required:
        [
          source,
          source_id,
          type,
          lang,
          title,
          original_title,
          description,
          tagline,
          release_date,
          year,
          runtime,
          certification,
          original_language,
          vote_average,
          genres,
          keywords,
          poster_url,
          backdrop_url,
          videos,
          collection,
          similar,
          external_links,
          resolved_languages,
        ]
      properties:
        source: { type: string }
        source_id: { type: string }
        type: { type: string }
        lang: { type: string }
        title: { type: string }
        original_title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        tagline: { type: [string, "null"] }
        release_date: { type: [string, "null"] }
        year: { type: [string, "null"] }
        runtime: { type: [integer, "null"] }
        certification: { type: [string, "null"] }
        # Situação de exibição da série (0045), string CRUA verbatim; OPCIONAL
        # (ausente p/ filme ou quando a fonte não informa). A UI traduz o rótulo.
        airing_status: { type: [string, "null"] }
        original_language: { type: [string, "null"] }
        vote_average: { type: [number, "null"] }
        genres:
          type: array
          items: { type: string }
        keywords:
          type: array
          items: { type: string }
        # Artes do HERO: rota LOCAL do proxy (/api/v1/images?src=..., cacheada — 0024)
        # quando há diretório de assets e o host e proxyavel; senao a URL DIRETA da
        # fonte (degradacao). Similares/colecao seguem com a URL direta da fonte.
        poster_url: { type: [string, "null"] }
        backdrop_url: { type: [string, "null"] }
        videos:
          type: array
          items: { $ref: "#/components/schemas/ExternalVideo" }
        collection:
          oneOf:
            - $ref: "#/components/schemas/ExternalCollection"
            - type: "null"
        similar:
          type: array
          items: { $ref: "#/components/schemas/ExternalSimilar" }
        external_links:
          type: object
          additionalProperties: { type: string }
          description: "Mapa link→URL (ex.: imdb, tmdb)."
        resolved_languages:
          type: object
          additionalProperties: { type: string }
          description: Proveniência de idioma dos campos traduzíveis (ADR-0019).

# golangci-lint (v2) configuration for MyMediaDB.
#
# Small and sensible: the golangci-lint default set (errcheck, govet,
# ineffassign, staticcheck, unused) and nothing exotic. Version 2 already ships
# staticcheck with gosimple and stylecheck inside. The `go_lint_issues` metric in
# the quality gate is a WARNING for now (incremental ratchet) and hardens later.
version: "2"

run:
  timeout: 5m

linters:
  # `default: standard` is the set golangci-lint recommends
  # (errcheck, govet, ineffassign, staticcheck, unused). We list the main ones in
  # `enable` so the intent is explicit and survives a default change between
  # versions.
  default: standard
  enable:
    - errcheck      # unchecked returned errors
    - govet         # static analysis from the toolchain
    - ineffassign   # assignments with no effect
    - staticcheck   # meta linter (includes gosimple and stylecheck in v2)
    - unused        # unused symbols

  exclusions:
    generated: lax
    paths:
      - internal/webui/dist   # embedded assets (Vite build), not our code
      - node_modules          # npm packages in web/ (flatted embeds a .go); not our code.
                              # The substring matches web/node_modules and web/node_modules_rootbak.

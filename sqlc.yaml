# sqlc configuration (v2) — generates typed Go access from SQL.
#
# sqlc coexists with goose (ADR-0017): goose VERSIONS the DDL (the migrations),
# and sqlc READS those same migrations as the schema to generate the models and
# the queries. sqlc understands the `-- +goose Up/Down` annotations and considers
# only Up.
#
# Decision: the generated code is VERSIONED in the repo (the internal/db/sqlcgen
# directory). That way `go build` does not depend on sqlc being installed;
# regenerating is an explicit dev step (`sqlc generate`).
version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/db/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/db/sqlcgen"
        emit_interface: true
        emit_empty_slices: true

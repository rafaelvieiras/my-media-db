# compose.prod.yaml — ambiente de PRODUÇÃO (contraste com compose.dev.yaml,
# que builda localmente e tem hot reload). Este arquivo NÃO builda nada: só
# puxa a imagem já publicada pelo GitHub Actions (.github/workflows/release.yml)
# no GitHub Container Registry, e mantém ela atualizada sozinha via Watchtower.
#
# Pré-requisitos no host:
#   1) `docker login ghcr.io` — a imagem é PRIVADA, tanto o `pull` deste
#      compose quanto o Watchtower dependem da credencial salva em
#      ~/.docker/config.json (ver docs/deploy.md).
#   2) Um `.env` na raiz com as credenciais opcionais de enriquecimento —
#      copie de `.env.prod.example` e preencha (ou deixe vazio: a busca
#      externa fica desligada, sem erro).
#
# Subir:
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d

# Nome de projeto PRÓPRIO: isola prod do dev (compose.dev.yaml usa o nome
# derivado da pasta, `my-media-db`). Sem isto os dois compartilhariam rede e o
# prod veria os containers de dev como "órfãos" (e vice-versa).
name: mymediadb-prod

services:
  app:
    image: ghcr.io/rafaelvieiras/my-media-db:latest
    container_name: mymediadb
    restart: unless-stopped
    ports:
      # HOST:CONTAINER — o app escuta 8080 dentro do container; expõe em 8096 no
      # host (8080 é o dev-api, 5173 o dev-web, 8090 já usada por outro serviço).
      # Ajuste o lado esquerdo se a porta já estiver em uso no alvo.
      - "8096:8080"
    # Credenciais opcionais (TMDB/fanart.tv/TVDB) — arquivo gitignored, nunca
    # versionado. O compose reclama se o arquivo não existir: crie a partir
    # de .env.prod.example mesmo que vazio.
    env_file:
      - .env
    # Sobrescreve o uid:gid non-root embutido na imagem (100:101, ver
    # Dockerfile) pelo uid:gid do dono do host (rafael, 1000:1000). Motivo: a
    # montagem FUSE do rclone (biblioteca de mídia, abaixo) só é visível para
    # o uid que fez o mount — sem isto precisaríamos de `--allow-other` no
    # rclone + `user_allow_other` em /etc/fuse.conf (mudança de escopo global
    # no host). Rodar como 1000:1000 evita essa mudança de sistema; em troca,
    # ./data (bind-mount) precisa pertencer a 1000:1000 em vez de 100:101 —
    # `sudo chown -R 1000:1000 ./data`. Sem uso de os/user no binário, então
    # um uid sem entrada em /etc/passwd do container não é problema.
    user: "1000:1000"
    environment:
      PORT: "8080"
      # Dados persistidos em /data dentro do container (SQLite + arte
      # baixada) — ver o bind-mount abaixo.
      MYMEDIADB_DB_PATH: /data/mymediadb.sqlite
      MYMEDIADB_ASSETS_DIR: /data/assets
    volumes:
      # Bind-mount: os dados ficam em ./data no host (visíveis e triviais de
      # fazer backup — um tar da pasta, ou o scripts/backup.sh com VACUUM INTO).
      # O container roda como uid:gid 1000:1000 (ver `user:` acima, override do
      # non-root 100:101 da imagem), então ./data precisa pertencer ao seu
      # usuário: `sudo chown -R 1000:1000 ./data`. Se preferir um volume
      # nomeado gerenciado pelo Docker, troque por `- mymediadb-data:/data` e
      # redeclare o volume no bloco `volumes:` no fim do arquivo.
      - ./data:/data
      # Biblioteca de mídia: montagem rclone do Google Drive no host
      # (/mnt/gdrive-media, remoto gdrive-rw:Medias — ampliado de Medias/Videos em
      # 21/jul/2026). Leitura E escrita — o export one-way de NFO/artes (briefings
      # 0062-0065) grava nela; o remoto rclone já é "gdrive-rw" e o mount no host já
      # é rw (rclone-gdrive-media.service) exatamente para isso. O mount FUSE só é
      # visível para o uid que o criou (rafael, 1000); daí o
      # `user: "1000:1000"` acima em vez de exigir `--allow-other` no rclone.
      # Ao cadastrar a fonte na UI/API, use o path *dentro do container*, ex.:
      # /media/gdrive-media/Videos/Filmes. (/media/gdrive-media/Musicas também existe,
      # biblioteca de música — não é vídeo, fora do escopo deste app.)
      - /mnt/gdrive-media:/media/gdrive-media
    labels:
      # Só containers com este label são candidatos a auto-update do
      # Watchtower (WATCHTOWER_LABEL_ENABLE=true no serviço abaixo).
      - "com.centurylinklabs.watchtower.enable=true"
    # SEM healthcheck aqui de propósito: herda o HEALTHCHECK já definido no
    # Dockerfile (GET /api/v1/health via wget do busybox).

  watchtower:
    # Versão PINADA — evita que um bump automático do Watchtower mude
    # comportamento de auto-update sem aviso.
    image: containrrr/watchtower:1.7.1
    container_name: mymediadb-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Credencial do ghcr (imagem PRIVADA): o Watchtower usa o mesmo
      # ~/.docker/config.json criado pelo `docker login ghcr.io` no host para
      # autenticar o pull. Sem isso o Watchtower recebe 401/403 do registry.
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      # O containrrr/watchtower fala uma versão antiga da API Docker (1.25) por
      # padrão; daemons novos (Engine 26+, MinAPIVersion 1.40) a recusam com
      # "client version is too old". Fixa a versão da API num valor aceito.
      DOCKER_API_VERSION: "1.40"
      # Só atualiza containers com o label com.centurylinklabs.watchtower.enable
      # (aqui, só o serviço `app`).
      WATCHTOWER_LABEL_ENABLE: "true"
      # Remove a imagem antiga após recriar o container — ESSENCIAL no
      # Raspberry Pi de 1GB/cartão SD pequeno, senão o disco entope com
      # versões velhas acumuladas a cada release.
      WATCHTOWER_CLEANUP: "true"
      # Intervalo de checagem do registry, em segundos (5 min).
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
    # Sem `command:` — o Watchtower, sem argumentos de container específicos,
    # vigia TODOS os containers do host e age só nos que têm o label acima.

# lefthook.yml — MyMediaDB git hooks (Go + TS repo).
#
# Install once with:  lefthook install   (see CONTRIBUTING.md)
#
# Three hooks:
#   pre-commit  → auto-formats the staged files (gofmt / prettier), re-staging them.
#   pre-push    → runs the unified quality ratchet; aborts the push on regression.
#   commit-msg  → validates Conventional Commits (messages in pt-BR, `tipo: resumo`).

# ─── pre-commit: fast auto-formatting ────────────────────────────────────────
# `stage_fixed: true` stages again the files the formatter changed,
# so a commit of unformatted code lands formatted, without relying on the editor.
pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    # Two jobs because of lefthook's glob semantics: `web/**/*.EXT` matches
    # files in SUBdirectories, but NOT the ones sitting directly in `web/` (e.g.:
    # vite.config.ts, index.html, tsconfig*.json). `web/*.EXT` covers the root.
    # package-lock.json is protected by web/.prettierignore.
    prettier:
      glob: "web/**/*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css,scss,md,html,yml,yaml}"
      run: npx --yes prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    prettier-root:
      glob: "web/*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css,scss,md,html,yml,yaml}"
      run: npx --yes prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

# ─── pre-push: quality ratchet (heavy) ───────────────────────────────────────
# Requires the Go tools on the PATH (golangci-lint, govulncheck, gocyclo); the
# missing ones are simply skipped by the gate (see CONTRIBUTING.md).
pre-push:
  commands:
    quality-gate:
      run: node scripts/quality-gate.mjs --local

# ─── commit-msg: Conventional Commits ────────────────────────────────────────
# {1} = path to the file with the commit message, passed by git.
commit-msg:
  commands:
    conventional:
      run: node scripts/check-commit-msg.mjs {1}

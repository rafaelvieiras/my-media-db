# air configuration (github.com/air-verse/air) — dev watcher for the Go backend.
# Rebuilds and restarts the binary on every change to *.go. It is a dev-ONLY
# dependency: it never enters the production image (Dockerfile).
root = "."
tmp_dir = "tmp"

[build]
  # Same entrypoint as production; CGO disabled for a static, fast binary.
  # -buildvcs=false: the repo is bind-mounted and the git inside the container
  # reports "dubious ownership", which breaks VCS stamping. In dev we do not
  # need it.
  cmd = "CGO_ENABLED=0 go build -buildvcs=false -o ./tmp/main ./cmd/mymediadb"
  bin = "./tmp/main"
  # Watches Go only; the front end has its own HMR (Vite) and does not go through air.
  include_ext = ["go"]
  # Directories that do not trigger a backend rebuild.
  exclude_dir = ["web", "internal/webui/dist", "tmp", "reports", "scripts"]
  # Compilation errors go to this log inside tmp/ (git-ignored).
  log = "build-errors.log"
  # Small delay to group burst saves into a single rebuild.
  delay = 300
  stop_on_error = true

[log]
  time = true

[misc]
  # Removes tmp/ when air exits.
  clean_on_exit = true

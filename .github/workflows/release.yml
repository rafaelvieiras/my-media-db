# release.yml — build e publicação da imagem Docker de produção no GHCR.
#
# Builda a imagem multi-arch (amd64/arm64/armv7 — Dockerfile faz cross-
# compilação, não emulação QEMU nos estágios pesados) e publica no GitHub
# Container Registry (ghcr.io/rafaelvieiras/my-media-db), imagem PRIVADA por
# ora. A tag `:latest` é o que o Watchtower no alvo (compose.prod.yaml) fica
# perseguindo: a cada push no master a imagem é rebuildada e o Watchtower
# puxa a nova versão automaticamente em até 5 min (WATCHTOWER_POLL_INTERVAL).
#
# paths-ignore evita gastar CI em mudanças que não afetam a imagem final
# (docs, briefings, reports, compose de produção, exemplo de .env).

name: Release (imagem Docker)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'briefings/**'
      - 'docs/**'
      - 'reports/**'
      - 'compose.prod.yaml'
      - '.env.prod.example'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Build e push da imagem multi-arch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Habilita emulação para os estágios que rodam de fato na arch alvo
      # (ex.: `apk add ffmpeg` no estágio `final` do Dockerfile) — os
      # estágios builder-web/builder-go cross-compilam e não precisam disso.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Imagem privada: autentica com o token automático do workflow, que já
      # tem `packages: write` via a permissão declarada acima. Não precisa de
      # PAT dedicado no CI.
      - name: Login no ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deriva as tags da imagem: `latest` só no branch default, sha curto
      # sempre, e semver quando o push for de uma tag `v*`.
      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build e push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}

# release.yml — version, GitHub Release, and the Docker image.
#
# Two jobs, in this order:
#
#   version  reads the Conventional Commits since the last tag, decides the next
#            version, creates the git tag and the GitHub Release with the notes.
#   docker   builds the multi-arch image and pushes it to GHCR with the tags
#            :latest, :<major.minor> and :<full version>.
#
# The version comes from the commits and nothing else. A push to `master` with a
# `feat:` commit publishes a minor release; with only `fix:` commits, a patch.
# With no feat/fix/breaking commit, no release is made and the image is not
# rebuilt.
#
# `:latest` is what Watchtower follows on the deployment host, so a new release
# reaches the server within five minutes.

name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # semantic-release needs the full history and the tags to find the
          # last release.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install release tooling
        run: npm ci

      # semantic-release creates the tag and the GitHub Release and THEN pushes the release
      # notes to refs/notes/...; when that last push is rejected the whole command exits 1 with
      # everything already published (issue #46). `continue-on-error` keeps that from killing a
      # release that exists, and the version is read from the TAG ON HEAD below, so a real
      # failure -- nothing published -- still stops the pipeline.
      - name: Run semantic-release
        id: semantic
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Read the published version from the tag on HEAD
        id: version
        run: |
          tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          if [ -z "$tag" ]; then
            echo "::error::semantic-release did not publish a tag for this commit (see the step log above)"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Warn that the release notes were not pushed
        if: steps.semantic.outcome == 'failure'
        run: |
          echo "::warning::semantic-release failed after publishing the tag and the GitHub Release (the release notes push, issue #46). Version ${{ steps.version.outputs.version }} and its image are still released."

  docker:
    name: Build and push the multi-arch image
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}

      # Emulation is only for the stages that really run on the target
      # architecture, such as `apk add ffmpeg` in the final stage. The builder
      # stages cross-compile and do not need it.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      # The workflow token carries `packages: write` from the permissions block.
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}

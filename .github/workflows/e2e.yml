# e2e.yml — browser E2E (Layer 2) in CI.
#
# A job SEPARATE from the ratchet (slower): it builds the front end + the binary
# with -cover, brings the binary up with the fake provider
# (MYMEDIADB_FAKE_PROVIDER=1) and drives a real Chromium through Playwright over
# the inventory of user flows. It collects the browser coverage (binary via
# GOCOVERDIR + go tool covdata; front end via monocart V8) and locks both metrics
# as a BLOCKING ratchet (node scripts/quality-gate.mjs --e2e vs baseline.json) —
# a job SEPARATE from the unit ratchet (quality-gate.yml), it only fails on a
# browser coverage regression, not on any code change. If you want the failure
# here not to block the merge, mark this check as non-required in the branch
# protection (the workflow itself always reports an honest pass/fail).

name: E2E (Playwright)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E de navegador (Camada 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # EXACT patch (= go.mod toolchain), same as the ratchet. Do not use
          # '1.26.x' (the runner may land on an earlier patch through the cache).
          go-version: '1.26.11'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          # Only web/ has a versioned lockfile; the e2e/ one is gitignored on purpose.
          cache-dependency-path: web/package-lock.json

      # The e2e global-setup runs `npm run build` in web/, so the web deps
      # must exist. `npm ci` respects the strict lockfile (same as Docker).
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # ISOLATED e2e/ project: `npm install` (NEVER `npm ci`) so as not to touch the
      # strict lockfile of web/ (rule of this npm version).
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # make e2e-cov = cd e2e && E2E_COVERAGE=1 npm run e2e: builds front end+binary,
      # brings it up with the fake, runs the journeys and extracts the browser coverage.
      - name: Run E2E (com cobertura)
        run: make e2e-cov

      - name: Travar cobertura de navegador na catraca
        id: e2e-gate
        run: node scripts/quality-gate.mjs --e2e
        continue-on-error: true

      - name: Comment e2e coverage table on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: e2e-quality-gate
          recreate: true
          path: reports/e2e-quality-gate-report.md

      - name: Fail on blocking regression (cobertura de navegador)
        if: steps.e2e-gate.outcome == 'failure'
        run: |
          echo "Cobertura de navegador regrediu vs baseline. Veja reports/e2e-quality-gate-report.md."
          exit 1

      # The artifact is best-effort (the coverage already shows up in the log of the step above):
      # an upload failure — e.g. a full artifact storage quota — must NOT
      # paint the job red; the E2E step decides the outcome.
      - name: Upload E2E artifacts (cobertura + logs)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 30
          path: |
            e2e/.artifacts/e2e-binary-coverage.txt
            e2e/.artifacts/web-coverage
            e2e/.artifacts/server.log
            e2e/test-results

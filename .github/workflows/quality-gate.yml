# quality-gate.yml — MyMediaDB unified quality ratchet (Go + TS).
#
# Runs the same `scripts/quality-gate.mjs` as the local pre-push, now in CI
# mode (Markdown output). Blocks the merge on a blocking regression and comments the
# metrics table on the PR (sticky comment). The gate is dev/CI tooling and does not
# enter the production image.

name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    name: Quality Gate (Go + TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # EXACT patch (= go.mod toolchain). Do not use '1.26.x': the runner
          # resolves through the cache and may land on an earlier patch with a
          # stdlib vuln already fixed in the current pin, and govulncheck flags it
          # as blocking. Pinning also guarantees deterministic coverage in the
          # ratchet. Bump it together with the go.mod toolchain.
          go-version: '1.26.11'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Go quality tools
        # PINNED versions (do not use @latest): a new linter release may
        # introduce checks that find new issues, or gocyclo may count
        # differently, breaking the ratchet with no code change. Pinning guarantees
        # determinism; bump it consciously after revalidating the baseline
        # (0 issues / 0 vulns / 4 funcs > gocyclo 10).
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The internal/mediainfo package has an integration test that runs ffprobe
      # FOR REAL (it generates a clip with ffmpeg); it skips itself when the
      # binaries are missing. Without ffmpeg on the runner that path stays
      # uncovered and the Go total drops ~0.3% (73.9% vs 74.2% of the baseline,
      # captured with ffmpeg present). Installing ffmpeg makes CI reproduce the
      # baseline and exercise the integration.
      - name: Install ffmpeg (teste real do ffprobe)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run quality gate (CI / Markdown)
        id: gate
        env:
          GATE_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/quality-gate.mjs
        continue-on-error: true

      - name: Comment metrics table on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: quality-gate
          recreate: true
          path: reports/quality-gate-report.md

      # Best-effort: the metrics table is already commented on the PR and the
      # blocking regression is decided by the step below. An upload failure (e.g. a full
      # artifact storage quota) must NOT paint the ratchet red.
      - name: Upload quality reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports/
          retention-days: 30

      - name: Fail on blocking regression
        if: steps.gate.outcome == 'failure'
        run: |
          echo "Quality gate falhou: regressão bloqueante. Veja a tabela no comentário do PR / no relatório."
          exit 1

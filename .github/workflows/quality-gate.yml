# quality-gate.yml — MyMediaDB unified quality ratchet (Go + TS).
#
# Runs the same `scripts/quality-gate.mjs` as the local pre-push, now in CI mode
# (Markdown output). Blocks the merge on a blocking regression and comments the
# metrics table on the PR (sticky comment). The gate is dev/CI tooling and does not
# enter the production image.
#
# THREE jobs instead of one, because the two sides are independent work:
#
#   go      measures the Go side (unit coverage, journey coverage, gofmt, lint,
#           vulns, gocyclo) in web-less runner.
#   web     measures the Web side (coverage, type-check, lint, duplication, audit).
#   report  merges the two partial reports, comments ONE table on the PR and owns the
#           verdict. Its name is kept as `Quality Gate (Go + TS)` on purpose: it is
#           the check the branch protection points at, and the split must not change
#           what a merge is waiting for.
#
# Wall time is the MAXIMUM of the two sides instead of their sum. Measured on the run
# before the split: 272 s total, of which 52 s was compiling golangci-lint from source
# (`go install`), 18 s was ffmpeg, 47 s was `npm ci` and 144 s was the gate itself.
#
# DOCUMENTATION-ONLY CHANGES DO NOT MEASURE ANYTHING. The `changes` job classifies the
# diff; when every changed file is documentation (*.md, docs/, LICENSE, the root
# assets/), `go` and `web` are skipped and `report` states why instead of publishing a
# table of numbers that cannot have moved. The classification lives in a JOB, not in a
# `paths-ignore` trigger, on purpose: a skipped workflow creates no check run, so a
# required status that is skipped never reports and the PR waits forever. With the job
# pattern the contract name (`Quality Gate (Go + TS)`) is reported either way.
#
# The classification FAILS OPEN: if the diff cannot be computed, everything runs.

name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

# A new push to the same PR makes the previous run pointless: cancel it instead of
# paying for two full ratchets. `cancel-in-progress` is safe here because the gate is
# read-only (it comments and uploads artifacts, nothing else).
concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # EXACT patches, bumped deliberately (see the comments in each job).
  GO_VERSION: '1.26.11'
  NODE_VERSION: '24'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  GOVULNCHECK_VERSION: 'v1.6.0'
  GOCYCLO_VERSION: 'v0.6.0'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The classification diffs against the base of the PR/push.
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/${BASE_REF}...${SHA}"
          else
            range="${BEFORE}..${SHA}"
          fi
          # FAIL OPEN: an unreadable diff means "assume code", which runs everything.
          if ! files=$(git diff --name-only "$range"); then
            echo "diff of '${range}' failed: assuming code changed."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              # Documentation and the README logo: nothing in the binary, nothing in
              # the front end, nothing in the tooling. `docs/*` covers docs/adr too.
              *.md | docs/* | LICENSE | assets/*) echo "documentation: $file" ;;
              *) echo "code: $file"; code=true ;;
            esac
          done <<< "$files"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

  go:
    name: Gate — Go
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The gate diffs against the base of the PR/push, so it needs the history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # EXACT patch (= go.mod toolchain). Do not use '1.26.x': the runner
          # resolves through the cache and may land on an earlier patch with a
          # stdlib vuln already fixed in the current pin, and govulncheck flags it
          # as blocking. Pinning also guarantees deterministic coverage in the
          # ratchet. Bump it together with the go.mod toolchain.
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The three tools are pinned (do not use @latest): a new linter release may
      # introduce checks that find new issues, or gocyclo may count differently,
      # breaking the ratchet with no code change. Bump consciously, after
      # revalidating the baseline.
      #
      # The binaries are cached by version, so the install only happens when a
      # version changes. On a miss, golangci-lint is a PREBUILT download: `go install`
      # compiles it from source and that alone cost 52 s of every run.
      - name: Cache the Go quality tools
        id: gotools
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: gotools-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-${{ env.GOCYCLO_VERSION }}

      - name: Install the Go quality tools
        if: steps.gotools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ver="${GOLANGCI_LINT_VERSION#v}"
          curl -fsSL "https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}/golangci-lint-${ver}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          install "/tmp/golangci-lint-${ver}-linux-amd64/golangci-lint" "$(go env GOPATH)/bin/"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "github.com/fzipp/gocyclo/cmd/gocyclo@${GOCYCLO_VERSION}"

      # Always, cache hit or not: restoring the bin directory does not put it on PATH.
      - name: Put the Go quality tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # These three are OPTIONAL for the gate: a collector that cannot find its tool
      # skips the metric instead of blocking (right on a dev machine, wrong in CI).
      # Verify them here, so a corrupted cache or a silent install failure becomes a
      # red step instead of a metric that quietly disappears from the table.
      - name: Verify the Go quality tools
        run: |
          set -euo pipefail
          for tool in golangci-lint govulncheck gocyclo; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::$tool não está no PATH — o gate pularia a métrica. Abortando."
              exit 1
            fi
            echo "ok: $tool ($(command -v "$tool"))"
          done

      # The internal/mediainfo package has an integration test that runs ffprobe
      # FOR REAL (it generates a clip with ffmpeg); it skips itself when the
      # binaries are missing. Without ffmpeg on the runner that path stays
      # uncovered and the Go total drops ~0.3% (73.9% vs 74.2% of the baseline,
      # captured with ffmpeg present). Installing ffmpeg makes CI reproduce the
      # baseline and exercise the integration.
      # --no-install-recommends: the recommends of ffmpeg are not needed by a CLI
      # test and pull in a pile of GUI libraries that only cost download time.
      # ffmpeg is the slowest and most erratic step of this job: no hosted image ships
      # it, so every run had apt fetch 87 packages from the mirror — 18 s to 43 s on a
      # good day, 12 min 39 s when the mirror crawled (all measured). The .deb files are
      # cached and installed offline; a cold cache is the old behaviour plus a cache write.
      - name: Cache the ffmpeg packages
        id: ffmpeg-debs
        uses: actions/cache@v6
        with:
          path: ~/.cache/ffmpeg-debs
          key: ffmpeg-debs-${{ runner.os }}-noble-v2

      - name: Download the ffmpeg packages
        if: steps.ffmpeg-debs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          mkdir -p ~/.cache/ffmpeg-debs
          # `-d` = download only: apt resolves the closure and leaves the .deb files in
          # its own archive directory, so nothing has to be parsed out of --print-uris
          # (whose URLs are relative to the runner's mirrorlist and cannot be curled).
          sudo apt-get install -d -y --no-install-recommends ffmpeg
          sudo cp /var/cache/apt/archives/*.deb ~/.cache/ffmpeg-debs/
          echo "pacotes no cache: $(ls ~/.cache/ffmpeg-debs | wc -l)"

      # The internal/mediainfo package has an integration test that runs ffprobe FOR REAL
      # (it generates a clip with ffmpeg); it SKIPS itself when the binaries are missing,
      # which would drop coverage silently — hence the install and the final check.
      - name: Install ffmpeg (offline when the cache is warm)
        run: |
          set -euo pipefail
          if ls ~/.cache/ffmpeg-debs/*.deb >/dev/null 2>&1; then
            # dpkg does not order dependencies; --configure -a finishes whatever the
            # first pass left configured too early.
            sudo dpkg -i ~/.cache/ffmpeg-debs/*.deb || true
            sudo dpkg --configure -a || true
          fi
          # Reach the network only if the offline attempt did not produce working tools.
          if ! ffmpeg -version >/dev/null 2>&1 || ! ffprobe -version >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run the Go side of the gate
        id: gate
        env:
          GATE_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/quality-gate.mjs --side=go --out=reports/metrics-go.json
        continue-on-error: true

      # Best-effort: the merge job below owns the metric table and the verdict. An
      # upload failure (e.g. a full artifact storage quota) must NOT paint the ratchet
      # red — but it DOES leave the merge without a number, which shows up as a
      # skipped metric there.
      - name: Upload the Go partial report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: metrics-go
          path: |
            reports/metrics-go.json
            reports/*-failure.log
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on a blocking Go regression
        if: steps.gate.outcome == 'failure'
        run: |
          echo "Quality gate (Go) falhou: regressão bloqueante. Veja a tabela no comentário do PR."
          exit 1

  web:
    name: Gate — TS/Web
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # `npm ci` unpacks the whole tree on every run (~47 s measured) even with the
      # npm cache warm, because that cache holds the tarballs, not the result. The
      # installed tree is cached directly, keyed by BOTH files: a change in
      # package.json invalidates it even when the lockfile is untouched.
      - name: Cache web/node_modules
        id: nodemodules
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: nodemodules-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ hashFiles('web/package-lock.json', 'web/package.json') }}

      - name: Install web dependencies
        if: steps.nodemodules.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run the Web side of the gate
        id: gate
        env:
          GATE_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/quality-gate.mjs --side=web --out=reports/metrics-web.json
        continue-on-error: true

      - name: Upload the Web partial report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: metrics-web
          path: |
            reports/metrics-web.json
            reports/*-failure.log
          if-no-files-found: warn
          retention-days: 30

      - name: Fail on a blocking Web regression
        if: steps.gate.outcome == 'failure'
        run: |
          echo "Quality gate (Web) falhou: regressão bloqueante. Veja a tabela no comentário do PR."
          exit 1

  # The merge is cheap (a few seconds) and keeps ONE table, ONE comment and ONE check
  # name for the branch protection — the split changed where the work runs, not what
  # the ratchet means.
  report:
    name: Quality Gate (Go + TS)
    needs: [changes, go, web]
    # Always: a red side still has to produce the table that explains why, and a
    # documentation-only run still has to REPORT the contract name as a success.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The documentation-only path: no side ran, so there is no table to merge. It
      # writes the same file the sticky comment reads, so the PR ends up with one
      # truthful line instead of a table of numbers that cannot have changed.
      - name: Explain that there is no code to measure
        if: needs.changes.outputs.code != 'true'
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo '## Quality Gate: skipped, no code changed'
            echo
            echo 'Every changed file in this run is documentation (`*.md`, `docs/`,'
            echo '`LICENSE` or the README assets), so the Go and TS sides have nothing'
            echo 'to measure and were skipped on purpose.'
            echo
            echo 'This is a success, not a missing check: the ratchet only guards code.'
          } > reports/quality-gate-report.md
          cat reports/quality-gate-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Download both partial reports
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: reports
          merge-multiple: true
          pattern: metrics-*

      - name: Merge, comment and decide
        if: needs.changes.outputs.code == 'true'
        env:
          GO_RESULT: ${{ needs.go.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          set +e
          node scripts/quality-gate.mjs --report=reports/metrics-go.json,reports/metrics-web.json
          gate=$?
          set -e
          if [ "$GO_RESULT" != "success" ] || [ "$WEB_RESULT" != "success" ]; then
            echo "Um dos lados não terminou bem: go=$GO_RESULT web=$WEB_RESULT."
            exit 1
          fi
          exit "$gate"

      - name: Comment metrics table on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: quality-gate
          recreate: true
          path: reports/quality-gate-report.md

      - name: Upload quality reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports/
          retention-days: 30

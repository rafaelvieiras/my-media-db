# quality-gate.yml — catraca de qualidade unificada (Go + TS) do MyMediaDB.
#
# Roda o mesmo `scripts/quality-gate.mjs` do pre-push local, agora em modo CI
# (saída Markdown). Bloqueia o merge em regressão bloqueante e comenta a tabela
# de métricas no PR (comentário sticky). O gate é ferramenta de dev/CI e não
# entra na imagem de produção.

name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    name: Quality Gate (Go + TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # Patch EXATO (= toolchain do go.mod). Nao usar '1.26.x': o runner
          # resolve pelo cache e pode cair na 1.26.4, que tem a vuln de stdlib
          # (corrigida na 1.26.5) e o govulncheck marca como bloqueante. Pin
          # tambem garante cobertura deterministica no ratchet. Bumpar junto com
          # o toolchain do go.mod.
          go-version: '1.26.5'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Go quality tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # O pacote internal/mediainfo tem um teste de integracao que roda o ffprobe
      # DE VERDADE (gera um clipe com ffmpeg); ele se auto-pula se os binarios
      # faltam. Sem ffmpeg no runner esse caminho fica sem cobertura e o total Go
      # cai ~0,3% (73,9% vs 74,2% do baseline, capturado com ffmpeg presente).
      # Instalar ffmpeg faz o CI reproduzir o baseline e exercitar a integracao.
      - name: Install ffmpeg (teste real do ffprobe)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run quality gate (CI / Markdown)
        id: gate
        run: node scripts/quality-gate.mjs
        continue-on-error: true

      - name: Comment metrics table on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: quality-gate
          recreate: true
          path: reports/quality-gate-report.md

      # Best-effort: a tabela de metricas ja e comentada no PR e a regressao
      # bloqueante e decidida pelo passo abaixo. Uma falha de upload (p.ex. cota
      # de storage de artefatos cheia) NAO deve pintar a catraca de vermelho.
      - name: Upload quality reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports/
          retention-days: 30

      - name: Fail on blocking regression
        if: steps.gate.outcome == 'failure'
        run: |
          echo "Quality gate falhou: regressão bloqueante. Veja a tabela no comentário do PR / no relatório."
          exit 1
